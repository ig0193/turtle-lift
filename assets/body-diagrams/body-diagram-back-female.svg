<svg viewBox="0 0 704 1252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Female back view body diagram with anatomically traced, individually tappable muscle segments">
  <title>Back view muscle diagram (female) — traced from source artwork</title>
  <desc>
    Traced from a female back-view line-art reference, using the same connected-component
    method as the male back view. Segment structure, ids, and data attributes are identical to
    body-diagram-back.svg -- app logic doesn't need to branch on gender beyond choosing which
    asset file to render.

    Same corrections applied as the male back view: the knee tie-in shape below the hamstring,
    and the lower leg/ankle taper below the calf, are intentionally excluded -- they render as
    plain body silhouette, not as part of hamstrings or calves.

    Decorative, non-interactive, excluded entirely: head, hair, neck, hands, fingertips.
  </desc>
