<svg viewBox="0 0 712 1324" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full body back view diagram with anatomically traced, individually tappable muscle segments">
  <title>Back view muscle diagram — traced from source artwork, corrected</title>
  <desc>
    Traced from a back-view line-art reference using connected-component analysis. Corrected
    from an earlier pass: the small knee tie-in shape below the hamstring, and the lower
    leg/ankle taper below the calf bulge, are intentionally excluded from the hamstrings and
    calves segments -- they render as plain body silhouette, not as part of either muscle,
    since they are not the hamstring or calf muscle itself.

    Labeling notes:
    - High confidence, matched directly to a shape in the source art: upper back/traps, lats,
      lower back, rear delts, triceps, forearms, glutes, hamstrings, calves.
    - Decorative, non-interactive, excluded entirely: head, hair, neck, hands, fingertips, the
      knee tie-in area, and the lower leg/ankle taper below the calf.
    - Combine with the front-view diagram (body-diagram-front.svg) for full coverage: the
      front view has chest/abs/obliques/biceps/front-delt/quads; this back view adds
      lats/upper-back/lower-back/rear-delt/triceps/glutes/hamstrings. Forearms and calves
      appear in both views.
  </desc>
