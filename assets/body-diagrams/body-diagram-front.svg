<svg viewBox="0 0 700 1324" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full body front view diagram with anatomically traced, individually tappable muscle segments">
  <title>Full body muscle diagram — traced from source artwork, chest and abs subdivided</title>
  <desc>
    Traced from a full-body line-art reference using connected-component analysis (each
    muscle in the source was already drawn as its own enclosed shape, bounded by outline
    strokes). Chest and abs were further split into upper/mid/lower (chest) and upper/lower
    (abs) via polygon clipping, since the source art drew each as one undivided shape.

    Labeling notes:
    - High confidence, matched directly to a shape in the source art: shoulders (front delt),
      biceps, forearms, obliques, chest (all 3 bands), abs (upper/lower), quads, calves.
    - Folded into a neighbouring canonical group because they are not part of the app's defined
      muscle taxonomy: traps -> re-tagged to back/upper ("Upper back &amp; traps"), matching the back view, since
      the same muscle should not sit under a different parent depending on viewing angle;
      serratus -> grouped under obliques. The
      serratus shape keeps its own element id so it can still be rendered as a distinct visual
      piece, but carries data-sub-muscle-group="obliques", so querying or tapping it behaves
      exactly like the obliques region. NOTE: a data-sub-muscle-group value may therefore match
      more than one &lt;g&gt; in this file -- always select ALL matches, never the first one.
    - Decorative, non-interactive, excluded entirely: head, hair, neck, hands, fingertips, and
      the knee/quad tie-in shape below the quad (id="silhouette-knee-tie-in"). The knee tie-in
      is not a canonical muscle group; it renders as plain body silhouette. This matches the
      same correction already applied in body-diagram-back.svg, body-diagram-front-female.svg
      and body-diagram-back-female.svg.
    - Not present as separate shapes in this source art and therefore not included as their own
      segments: side/rear delts, triceps, hamstrings, glutes, lats/back (this is a front-view
      illustration only -- these would need a back-view counterpart).
    - Canonical sub-muscle groups exposed by this file (12, identical to the female front view):
      chest upper/mid/lower, abs upper/lower, obliques, biceps, forearms, quads, calves,
      shoulders front-delt, shoulders traps.
  </desc>
