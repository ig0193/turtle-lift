<svg viewBox="0 0 700 1268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Female front view body diagram with anatomically traced, individually tappable muscle segments">
  <title>Front view muscle diagram (female) — traced from source artwork</title>
  <desc>
    Traced from a female front-view line-art reference, using the same connected-component
    method as the male front/back diagrams. Segment structure, ids, and data attributes are
    identical to body-diagram-front.svg -- same data-muscle-group / data-sub-muscle-group
    values throughout -- so app logic doesn't need to branch on gender beyond choosing which
    asset file to render.

    Labeling notes mirror the male front view: chest split upper/mid/lower via clipping (the
    source art draws one undivided pec per side); abs split upper/lower via clipping, with the
    lower V-taper region folded into "lower abs"; the knee tie-in shape below the quad is
    excluded (not a canonical muscle group), matching the male version's correction.
    Decorative, non-interactive, excluded entirely: head, hair, ears, neck, hands, fingertips.

    Segment-count note: this file has 12 &lt;g class="muscle-segment"&gt; elements; the male front
    view has 13. The extra male element is a serratus shape that the female source art does not
    draw. It is NOT an extra muscle -- it carries data-sub-muscle-group="obliques" and routes to
    the obliques region. The set of canonical sub-muscle groups is therefore identical across
    both front views (12): chest upper/mid/lower, abs upper/lower, obliques, biceps, forearms,
    quads, calves, shoulders front-delt, shoulders traps. Select segments by
    data-sub-muscle-group and always handle ALL matching elements, not just the first.
  </desc>
