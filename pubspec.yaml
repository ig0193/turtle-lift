name: turtle_lift
description: "Offline workout logging. Local-only, no login, no cloud."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a simulator or device. The widget suite proves the
  # screens in isolation; this proves the flow through them against the real
  # database and the real boot path.
  integration_test:
    sdk: flutter
  # Host side of `flutter drive`, which saves the taste-audit screenshots
  # (test_driver/integration_test.dart, tool/taste_shots.sh).
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    # 260 validated exercises. Generated -- see assets/exercises/exercise_library.py.
    - assets/exercises/exercises.json
    # Protein food list for Diet, IFCT 2017. Generated -- see assets/foods/validate_food_catalogue.py.
    - assets/foods/foods.json
