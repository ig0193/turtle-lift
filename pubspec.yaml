name: turtle_lift
description: "Offline workout logging. Local-only, no login, no cloud."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a simulator or device. The widget suite proves the
  # screens in isolation; this proves the flow through them against the real
  # database and the real boot path.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    # 260 validated exercises. Generated -- see assets/exercises/exercise_library.py.
    - assets/exercises/exercises.json
