# Asks .maestro/scripts/push_server.py for a "Log your lunch" diet reminder, taps the
# banner where iOS draws it (the banner is not in the accessibility tree), and
# checks the app opened on the Diet tab with today selected.
appId: dev.indresh.turtleLift
---
- evalScript: "${http.post('http://127.0.0.1:8765/push', { body: '' }).status}"
# Let the banner slide in (Maestro has no sleep; this spins 1.2 s in JS).
- evalScript: "${(function () { var t = Date.now(); while (Date.now() - t < 1200) {} return 1; })()}"
- tapOn:
    point: "50%, 9%"
- extendedWaitUntil:
    visible: "Diet"
    timeout: 20000
# The Diet tab is the selected one (the tab bar item carries `selected`).
- assertVisible:
    text: "Diet"
    selected: true
# The pushed Personal details screen (on You) was popped (KTD17).
- assertNotVisible: "Body diagram"
# Diet opens on the day view; the log is empty in this flow.
- assertVisible: "Nothing logged for.*"
