# Scrolls the live session to Finish (clear of the floating tab bar, which
# would otherwise take the tap) and finishes, landing on the summary.
appId: dev.indresh.turtleLift
---
- scrollUntilVisible:
    element: "Finish workout"
    centerElement: true
- tapOn: "Finish workout"
- waitForAnimationToEnd
- assertVisible: "What you did"
