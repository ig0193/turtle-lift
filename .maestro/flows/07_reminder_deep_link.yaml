# User story (R11, AE6): tapping a diet reminder opens Profile -> Diet on
# today, warm (popping a pushed screen first) and cold.
#
# This file is only the setup. It needs the host shell between steps
# (`xcrun simctl push`), so tool/maestro_run.sh runs it through
# .maestro/scripts/07_reminder_deep_link.sh, which then drives
# ../subflows/reminder_*.yaml. Run that script, not this file alone.
appId: dev.indresh.turtleLift
name: 07 Reminder tap deep-links to Profile -> Diet (setup)
tags: [notifications, scripted]
---
- launchApp:
    clearState: true
# Notification permission through the app's own opt-in: clearState revokes
# it, and Maestro's launchApp permissions do not grant it on iOS 26.
- tapOn: "Profile"
- tapOn: "Schedule"
- tapOn: "Monday"
- tapOn: "Remind me.*"
- tapOn: "Allow reminders"
# The iOS permission prompt. Maestro's iOS driver may accept a system
# alert on its own before this step sees it, so the tap is conditional and
# the proof is the state that follows (the switch only stays on once iOS
# grants permission).
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- tapOn: "Personal"
# Leave the app on a pushed screen on another tab, so the tap has to pop it.
- tapOn: "Personal details.*"
- assertVisible: "Body diagram"
- pressKey: home
