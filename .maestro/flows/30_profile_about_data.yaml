# User story (ADR 0014): You > Profile ends with About (version, the privacy
# promise, open-source licences). A diet target alone is something to
# export and is counted; Export says it adds a CSV. Delete all data offers
# Export first and says exported files are not touched.
appId: dev.indresh.turtleLift
name: 30 Profile - About, export a diet target, Export first
tags: [profile, data]
---
- launchApp:
    clearState: true
- runFlow: ../subflows/open_profile_pane.yaml
- scrollUntilVisible:
    element: "Open-source licences"
    centerElement: true
- assertVisible: "About"
- assertVisible: "Version .*"
- assertVisible: "Your data stays on this phone.*"
- takeScreenshot: 30-about
- tapOn: "Open-source licences"
- assertVisible: ".*TurtleLift.*"
- tapOn: "Back"

# --- a diet target alone makes something to export (B9). The segment control
# is pinned above the panes, so there is nothing to scroll back to.
- tapOn: "Diet"
- tapOn: "Set a daily target"
- tapOn: { id: "protein-target-field" }
- inputText: "120"
- tapOn: "Daily protein target"
- tapOn: "Save"
- runFlow: ../subflows/open_profile_pane.yaml
- tapOn: "Export everything"
- assertNotVisible: "Nothing to export yet.*"
- assertVisible: ".*Foods logged.*0.*"
- assertVisible: ".*CSV of your sets.*"
- assertVisible:
    text: "Export"
    enabled: true
- tapOn: "Back"

# --- Delete all data: Export first, and what it does not touch
- tapOn: "Delete all data"
- assertVisible: ".*Files you already exported or shared are not touched\\..*"
- tapOn: "Export first"
- assertVisible: "Export everything"
- assertVisible: ".*Foods logged.*0.*"
- tapOn: "Back"
- assertVisible: "Delete all data"
