# User story (ADR 0014): reminders never read "on" when nothing will fire.
# Meal reminders with the master on and nothing chosen read "None chosen" on
# the Diet tab, and each time row names its meal. (The Schedule's training-day
# reminder this flow once also covered is gone, ADR 0015.)
appId: dev.indresh.turtleLift
name: 29 Profile - honest reminder states
tags: [profile, notifications]
---
- launchApp:
    clearState: true
# Diet is its own tab (ADR 0016): no You or segment taps.
- tapOn: "Diet"
- tapOn: "Set a daily target"
- tapOn: { id: "protein-target-field" }
- inputText: "120"
- tapOn: "Daily protein target"
- tapOn: "Save"
- scrollUntilVisible:
    element: "Reminders.*"
    centerElement: true
- assertVisible: "Reminders, Off\\..*"
- tapOn: "Reminders.*"
- assertVisible: "Turn on reminders to set times"
- assertVisible: "Breakfast time\\. 8:00 AM"
- assertVisible: "Dinner time\\. 8:30 PM"

# --- master on through the explain-first sheet and the OS prompt
- tapOn: "Remind me\\. A nudge at each meal you turn on"
- assertVisible: "Remind you to log meals\\?"
- tapOn: "Allow reminders"
# The iOS permission prompt. Maestro's iOS driver may accept a system
# alert on its own before this step sees it, so the tap is conditional and
# the proof is the state that follows (the switch only stays on once iOS
# grants permission).
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- assertNotVisible: "Turn on reminders to set times"
- assertNotVisible: "Morning summary.*"
- takeScreenshot: 29-master-on
- tapOn: "Back"
- scrollUntilVisible:
    element: "Reminders.*"
    centerElement: true
- assertVisible: "Reminders, None chosen\\..*"
- takeScreenshot: 29-none-chosen
