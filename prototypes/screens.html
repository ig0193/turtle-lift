<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype — screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17140F; --card:#211D18; --line:#332C22; --off:#241F19;
  --t1:#F5EFE8; --t2:#A89C8E; --t3:#6B6156;
  --acc:#D85A30; --acc2:#F0997B; --on-acc:#1B0C05;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0A07;font-family:Inter,system-ui,sans-serif;color:var(--t1);
     -webkit-font-smoothing:antialiased;padding:24px 16px 60px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600}

/* ---- harness ---- */
.harness{max-width:1180px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;
     background:#141109;border:1px solid #241F19;border-radius:12px;padding:10px 12px}
.bar h1{font-size:13px;font-weight:600;color:var(--t2);margin-right:6px}
.bar .sp{flex:1}
.tg{display:flex;background:#0C0A07;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tg button{background:none;border:0;color:var(--t3);font:inherit;font-size:11px;font-weight:500;
           padding:6px 12px;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.note{font-size:11px;color:var(--t3)}
.grid{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
figure{margin:0}
figcaption{font-size:11px;color:var(--t3);margin-top:8px;text-align:center;letter-spacing:.04em;
           text-transform:uppercase}

/* ---- phone ---- */
.phone{width:330px;height:660px;background:var(--bg);border-radius:30px;overflow:hidden;
       position:relative;border:1px solid #2A241C;display:flex;flex-direction:column}
.status{height:26px;display:flex;align-items:center;justify-content:space-between;
        padding:0 18px;font-size:10px;color:var(--t3);flex-shrink:0}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 12px}
.body::-webkit-scrollbar{width:0}

/* ---- tabbar ---- */
.tabs{display:flex;border-top:1px solid var(--line);flex-shrink:0;background:var(--bg)}
.tabs button{flex:1;background:none;border:0;padding:9px 0 11px;cursor:pointer;color:var(--t3);
             font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current=page]{color:var(--acc)}
.tabs span{font-size:10px;font-weight:500}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round}

/* ---- pieces ---- */
/* Pinned header. The header is a sibling of the scroll body in the app
   (Scaffold.appBar); here it lives inside .body, so sticky + a full-bleed
   opaque background reproduces the same behaviour: content scrolls under
   a header that stays put. */
h2.sc{font-size:23px;font-weight:600;letter-spacing:-.02em;
      position:sticky;top:0;z-index:20;background:var(--bg);
      margin:0 -16px 16px;padding:14px 16px 0}
.stat{background:var(--card);border-radius:var(--r);padding:11px 8px;text-align:center}
.stat .n{font-size:19px;display:block}
.stat .l{font-size:10px;color:var(--t3);margin-top:3px;display:block}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.big{width:100%;background:var(--acc);color:var(--on-acc);border:0;border-radius:var(--r);
     padding:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.ghost{width:100%;background:var(--card);color:var(--t1);border:1px solid var(--line);
       border-radius:var(--r);padding:13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.listbtn{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
         padding:13px;display:flex;align-items:center;justify-content:space-between;
         color:var(--t1);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 8px}
.hrow{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hrow p{font-size:14px}
.hrow small{font-size:12px;color:var(--t3);display:block;margin-top:2px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:11px 12px 11px 34px;color:var(--t1);font:inherit;font-size:13px}
.search::placeholder{color:var(--t3)}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
                stroke:var(--t3);fill:none;stroke-width:2}
.empty{text-align:center;padding:34px 18px}
.empty .ico{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;background:var(--card);
            display:flex;align-items:center;justify-content:center}
.empty .ico svg{width:22px;height:22px;stroke:var(--t3);fill:none;stroke-width:1.6}
.empty h3{font-size:15px;font-weight:600;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--t2);line-height:1.55}

/* ---- body map ---- */
.bodymap{width:100%;height:auto;display:block}
.bodymap .muscle-segment path{fill:var(--off);stroke:var(--line);stroke-width:2;
                              transition:fill .18s ease;cursor:pointer}
.bodymap .muscle-segment:hover path{fill:#35291F}
.bodymap .muscle-segment.on path{fill:var(--acc)}
.bodymap .muscle-segment.on2 path{fill:var(--acc2)}
.bodymap [aria-hidden=true]{fill:#2A241C}
.flip{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.flip button{background:var(--card);border:1px solid var(--line);color:var(--t3);font:inherit;
             font-size:11px;font-weight:500;padding:5px 15px;border-radius:99px;cursor:pointer}
.flip button[aria-pressed=true]{background:#33221A;border-color:var(--acc);color:var(--acc2)}
.hint{text-align:center;font-size:11.5px;color:var(--t3);margin-top:8px}
.hidden{display:none!important}

/* ---- splash ---- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        cursor:pointer}
.mark{width:74px;height:74px;border-radius:20px;background:var(--acc);display:flex;
      align-items:center;justify-content:center}
.mark svg{width:38px;height:38px;stroke:var(--on-acc);fill:none;stroke-width:2.2;stroke-linecap:round}
.wordmark{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tagline{font-size:12.5px;color:var(--t2)}
.splash small{position:absolute;bottom:26px;font-size:10.5px;color:var(--t3);letter-spacing:.05em}
@media (prefers-reduced-motion:no-preference){
  .mark{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
  .wordmark,.tagline{animation:fade .45s ease both .22s}
}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- flow screens ---- */
.hdr{display:flex;align-items:center;gap:8px;
     position:sticky;top:0;z-index:20;background:var(--bg);
     margin:0 -16px 6px;padding:10px 16px 0}
.hdr h3{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;outline:none}
.back{background:none;border:0;color:var(--t2);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.pencil{color:var(--t3);font-size:12px}
.info{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--card);
  border:1px solid var(--line);color:var(--t2);font:inherit;font-size:12px;font-style:italic;
  font-weight:600;cursor:pointer;line-height:1}
.datechip{background:var(--card);border:1px solid var(--line);color:var(--t2);font:inherit;
          font-size:11.5px;padding:5px 11px;border-radius:99px;cursor:pointer;margin-bottom:6px}
.tpl{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
     border-bottom:1px solid var(--line);cursor:pointer}
.tpl p{font-size:14px}
.tpl small{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.tpl.sel p{color:var(--acc2)}
.chev{color:var(--t3);font-size:16px}
.acc{border-bottom:1px solid var(--line)}
.acch{width:100%;background:none;border:0;color:var(--t1);font:inherit;font-size:14px;font-weight:500;
      display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer}
.accb{padding-bottom:4px}
.sub{display:flex;align-items:center;justify-content:space-between;padding:9px 0 9px 14px;
     font-size:13.5px;color:var(--t2);cursor:pointer;border-top:1px solid #201B15}
.sub.flat{padding-left:0;font-size:14px;color:var(--t1);font-weight:500;padding:12px 0;
          border-top:0;border-bottom:1px solid var(--line)}
.tick{color:var(--acc);font-size:14px}
.sub.done{color:var(--t1)}
.chips{display:flex;gap:6px;margin:2px 0 12px}
.chip{font-size:11px;color:var(--t2);background:var(--card);border:1px solid var(--line);
      border-radius:99px;padding:4px 10px}
.last{font-size:12px;color:var(--t3);margin-bottom:10px}
.last b{color:var(--t1);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r);padding:8px 9px}
.setrow.done{border-color:#3E3226}
.sn{width:16px;font-size:12px;color:var(--t3);flex-shrink:0}
.in{width:46px;background:#191510;border:1px solid var(--line);border-radius:7px;color:var(--t1);
    font:inherit;font-size:14px;font-weight:600;text-align:center;padding:6px 2px;
    font-variant-numeric:tabular-nums}
.in.wide{width:62px}
.in.ghosted{color:var(--t3);font-weight:500}
.u{font-size:11px;color:var(--t3);margin-right:2px}
.ck{margin-left:auto;width:30px;height:30px;flex-shrink:0;border-radius:8px;background:#191510;
    border:1px solid var(--line);color:var(--t3);font-size:14px;cursor:pointer}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.addw{background:none;border:1px dashed var(--t3);color:var(--t3);font:inherit;font-size:10.5px;
      padding:4px 8px;border-radius:99px;cursor:pointer;white-space:nowrap}
.addw.on{border:1px solid var(--acc);border-style:solid;color:var(--acc2);background:#33221A}
.ghosthint{font-size:11px;color:var(--t3);margin-top:9px;line-height:1.5}
.banner{display:flex;gap:8px;background:#33221A;border:1px solid var(--acc);border-radius:var(--r);
        padding:9px 11px;margin-bottom:11px}
.banner span{color:var(--acc2);font-size:14px}
.banner p{font-size:11.5px;color:var(--acc2);line-height:1.5}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--t2);font:inherit;
              font-size:11.5px;padding:7px 0;border-radius:8px;cursor:pointer}
.exrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);
       cursor:pointer}
.glyph{width:42px;height:42px;flex-shrink:0;background:var(--card);border:1px solid var(--line);
       border-radius:9px;display:flex;align-items:center;justify-content:center}
.glyph svg{width:24px;height:24px;stroke:var(--acc2);fill:none;stroke-width:2;stroke-linecap:round}
.exrow p{font-size:13.5px}
.exrow small{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.mini .muscle-segment path{cursor:default}
.state{font-size:10px;padding:2.5px 8px;border-radius:99px;margin-left:auto;flex-shrink:0}
.state.todo{color:var(--t3);border:1px solid var(--line)}
.state.doing{color:var(--acc2);background:#33221A;border:1px solid var(--acc)}
.state.done{color:var(--acc);border:1px solid #3E3226}
.mg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.mg span{background:#33221A;color:var(--acc2);font-size:12px;padding:6px 11px;border-radius:8px;
  display:inline-flex;align-items:center;gap:6px}
.mg span.add{background:none;border:1px dashed var(--t3);color:var(--t3)}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  color:var(--t1);font:inherit;font-size:14px;padding:11px 12px;margin-bottom:16px}
.pick{display:flex;gap:7px;margin-bottom:7px}
.pick button{background:var(--card);border:1px solid var(--line);color:var(--t2);font:inherit;
  font-size:12.5px;padding:8px 15px;border-radius:8px;cursor:pointer}
.pick button[aria-pressed=true]{background:#33221A;border-color:var(--acc);color:var(--acc2)}
.helper{font-size:11px;color:var(--t3);line-height:1.55;margin-bottom:18px}
.kcal{background:var(--card);border-radius:var(--r);padding:11px 12px;margin-bottom:16px}
.kcal h4{font-size:12px;font-weight:600;margin-bottom:8px}
.kcal .kr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t2);
  padding:4px 0;border-bottom:1px solid #201B15}
.kcal p{font-size:10.5px;color:var(--t3);margin-top:8px;line-height:1.5}
.icobtn{background:none;border:0;color:var(--t3);font-size:15px;cursor:pointer;padding:2px 4px}
.subcount{font-size:11px;color:var(--t3)}
.danger{width:100%;background:none;border:1px solid #4A2A20;color:#E07A5F;border-radius:var(--r);
  padding:11px;font:inherit;font-size:13px;cursor:pointer;margin-top:10px}

.cel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.celmark{width:62px;height:62px;border-radius:50%;background:var(--acc);display:flex;
  align-items:center;justify-content:center;font-size:30px;color:var(--on-acc)}
.celtitle{font-size:20px;font-weight:600;letter-spacing:-.02em}
.celsub{font-size:13px;color:var(--t2)}
.celstats{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:6px}
.celstats div{text-align:center}
.celstats .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.celstats .l{font-size:10.5px;color:var(--t3);margin-top:2px}
.share{display:flex;flex-direction:column;align-items:center;padding:16px 14px 18px;
  background:var(--card);border-radius:14px;margin-top:6px}
.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--t3);text-transform:uppercase}
.sharetitle{font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;
  gap:6px;margin:3px 0 10px}
.pbpill{display:inline-flex;align-items:center;gap:5px;background:#33221A;border:1px solid var(--acc);
  color:var(--acc2);font-size:11.5px;padding:4px 11px;border-radius:99px;margin-top:12px}
.sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 20px;margin-top:14px;width:100%;max-width:210px}
.sharegrid div{text-align:center}
.sharegrid .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.sharegrid .l{font-size:10px;color:var(--t3);margin-top:1px}
.sharemaps{display:flex;gap:12px;justify-content:center}
.sharemaps .m{width:78px}
.sharemaps .cap{font-size:9.5px;color:var(--t3);text-align:center;margin-top:2px}
.foot{display:flex;gap:8px;margin-top:14px}
.foot button{flex:1}
.wordm{font-size:9.5px;color:var(--t3);letter-spacing:.1em;margin-top:12px}

.hsum{display:flex;gap:6px;font-size:11.5px;color:var(--t3);margin:2px 0 14px;flex-wrap:wrap}
.hsum b{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}
.hsess{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hsess .top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hsess .dt{font-size:12.5px;color:var(--t1);font-weight:500}
.hsess .ago{font-size:11px;color:var(--t3)}
.hsess .pb{font-size:10px;color:var(--acc2);background:#33221A;border:1px solid var(--acc);
  border-radius:99px;padding:1.5px 7px;margin-left:auto}
.hsess .sets{flex-direction:row;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;color:var(--t2);background:var(--card);border-radius:6px;padding:3px 7px;
  font-variant-numeric:tabular-nums}
.pill.best{color:var(--acc2);background:#33221A}

.hist{margin-bottom:11px}
.histrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px solid #201B15;font-size:12px}
.histrow span:first-child{color:var(--t3);flex-shrink:0}
.histrow span:last-child{color:var(--t2);font-variant-numeric:tabular-nums;text-align:right}
.seemore{background:none;border:0;color:var(--acc2);font:inherit;font-size:11.5px;padding:7px 0;cursor:pointer}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2);margin-bottom:3px}
.sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.howblk{background:var(--card);border-radius:var(--r);padding:11px 12px;margin:12px 0}
.howblk h4{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;margin-bottom:3px}
.howblk h4:not(:first-child){margin-top:10px}
.howblk p{font-size:12px;color:var(--t1);line-height:1.55}
.dual{display:flex;gap:12px;justify-content:center;margin:6px 0 10px}
.dual figure{text-align:center}
.dual .cap{font-size:10px;color:var(--t3);margin-top:3px}
.dual .crop{width:118px;background:var(--card);border-radius:9px;padding:8px 6px}

button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
</style></head><body>

<div class="harness">
<div class="bar">
  <h1>Prototype</h1>
  <div class="tg" role="group" aria-label="Data state">
    <button id="b-new" aria-pressed="true">First launch</button>
    <button id="b-old" aria-pressed="false">Returning user</button>
  </div>
  <span class="sp"></span>
  <span class="note">Screens 1–22 · complete app flow</span>
</div>

<div class="grid">

<figure>
<div class="phone">
  <div class="splash" id="splash" tabindex="0" role="button" aria-label="Continue to app">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8v8M10 6v12M14 6v12M17 8v8"/></svg></div>
    <div style="text-align:center">
      <p class="wordmark">[ App name ]</p>
      <p class="tagline">Log a set. That's it.</p>
    </div>
    <small>TAP TO CONTINUE</small>
  </div>
</div>
<figcaption>1 · Splash</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="status"><span>9:41</span><span>▮▮▮</span></div>
  <div class="body">
    <h2 class="sc">Workout</h2>
    <div id="w-new">
      <div class="empty">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8v8M17 8v8"/></svg></div>
        <h3>Ready when you are</h3>
        <p>Pick a template for a planned session, or go ad-hoc and add exercises as you find them.</p>
      </div>
    </div>
    <div id="w-old" class="hidden">
      <div class="listbtn" style="border-color:var(--acc);background:#33221A;margin-bottom:14px">
        <span style="color:var(--acc2)">Resume · Push day</span>
        <span class="num" style="font-size:12px;color:var(--acc2)">3 exercises</span>
      </div>
      <p class="lbl" style="margin-top:0">Last time</p>
      <div class="hrow" style="border-top:1px solid var(--line)">
        <p>Chest and triceps day</p><small>2 days ago · 6 exercises · 18 sets</small>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:18px">
      <button class="big">Start workout</button>
      <button class="ghost">Ad-hoc workout</button>
    </div>
  </div>
  __TABS_A__
</div>
<figcaption>2 · Workout</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="status"><span>9:41</span><span>▮▮▮</span></div>
  <div class="body">
    <h2 class="sc">Muscles</h2>
    <div class="searchwrap" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search" placeholder="Search 260 exercises">
    </div>
    <div class="flip">
      <button id="f-front" aria-pressed="true">Front</button>
      <button id="f-back" aria-pressed="false">Back</button>
    </div>

</div></div>

<script>
const TABS = (active) => `<nav class="tabs">
 <button ${active==0?'aria-current="page"':''}><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8v8M17 8v8"/></svg><span>Workout</span></button>
 <button ${active==1?'aria-current="page"':''}><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M12 15l-3 6M12 15l3 6M7 10h10"/></svg><span>Muscles</span></button>
 <button ${active==2?'aria-current="page"':''}><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg><span>Profile</span></button>
</nav>`;
document.querySelectorAll('.phone').forEach((p,i)=>{
  const slot=[...p.childNodes].find(n=>n.nodeType===3&&n.textContent.includes('__TABS'));
  if(slot) slot.replaceWith(document.createRange().createContextualFragment(TABS(i===2?1:i===3?2:[11,12,17].includes(i)?1:i>=18?2:0)));
});

/* data-state toggle */
const $ = id => document.getElementById(id);
const setState = (fresh)=>{
  $('b-new').setAttribute('aria-pressed',fresh); $('b-old').setAttribute('aria-pressed',!fresh);
  $('w-new').classList.toggle('hidden',!fresh); $('w-old').classList.toggle('hidden',fresh);
  $('p-new').classList.toggle('hidden',!fresh); $('p-old').classList.toggle('hidden',fresh);
  const v = fresh ? ['0','0','0'] : ['5','12','247'];
  ['s1','s2','s3'].forEach((id,i)=>$(id).textContent=v[i]);
};
$('b-new').onclick=()=>setState(true);
$('b-old').onclick=()=>setState(false);

/* front / back */
function flip(front){
  $('f-front').setAttribute('aria-pressed',front); $('f-back').setAttribute('aria-pressed',!front);
  $('wrap-front').classList.toggle('hidden',!front); $('wrap-back').classList.toggle('hidden',front);
}
$('f-front').onclick=()=>flip(true);
$('f-back').onclick=()=>flip(false);

/* tappable muscle segments */
document.querySelectorAll('.bodymap .muscle-segment').forEach(g=>{
  g.setAttribute('tabindex','0');
  g.setAttribute('role','button');
  g.setAttribute('aria-label', g.getAttribute('data-label')||'muscle');
  const hit=()=>{
    const on=g.classList.contains('on');
    g.closest('svg').querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
    if(!on) g.classList.add('on');
    const hint=g.closest('.body').querySelector('.hint');
    hint.textContent = on ? 'Tap a muscle to see its exercises'
                          : (g.getAttribute('data-label')||'') + ' — tap again to open';
  };
  g.addEventListener('click',hit);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit();}});
});

/* overview mini-map: real asset, chest lit */
const mini=$('mini-slot');
if(mini){
  const c=$('svg-front').cloneNode(true);
  c.removeAttribute('id'); c.classList.add('mini');
  c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  c.querySelectorAll('[tabindex]').forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role');});
  c.querySelectorAll('[data-muscle-group="chest"]').forEach(n=>n.classList.add('on'));
  c.style.maxWidth='108px';
  mini.appendChild(c);
}

/* exercise detail: real diagrams, real crop values */
function crop(slot,src,vb,prim,sec){
  const host=$(slot); if(!host) return;
  const c=$(src).cloneNode(true);
  c.removeAttribute('id'); if(vb) c.setAttribute('viewBox',vb);
  c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  c.querySelectorAll('[tabindex]').forEach(n=>{n.removeAttribute('tabindex');n.removeAttribute('role');});
  c.classList.add('mini');
  prim.forEach(q=>c.querySelectorAll(q).forEach(n=>n.classList.add('on')));
  sec.forEach(q=>c.querySelectorAll(q).forEach(n=>n.classList.add('on2')));
  host.appendChild(c);
}
crop('crop-front','svg-front',null,
     ['[data-muscle-group="chest"][data-sub-muscle-group="lower"]'],
     ['[data-sub-muscle-group="front-delt"]']);
crop('crop-back','svg-back',null,[],['[data-muscle-group="triceps"]']);
crop('sum-front','svg-front',null,
     ['[data-muscle-group="chest"]'],['[data-sub-muscle-group="front-delt"]']);
crop('sum-back','svg-back',null,['[data-muscle-group="triceps"]'],[]);
crop('adhoc-map','svg-front',null,['[data-muscle-group="biceps"]'],['[data-muscle-group="forearms"]']);
crop('chest-map','svg-front',null,['[data-muscle-group="chest"]'],[]);
crop('past-front','svg-front',null,['[data-muscle-group="quads"]'],['[data-muscle-group="calves"]']);
crop('past-back','svg-back',null,['[data-muscle-group="hamstrings"]','[data-muscle-group="glutes"]'],
     ['[data-muscle-group="calves"]']);

/* splash */
$('splash').onclick=()=>$('splash').innerHTML='<p class="tagline">→ continues to Workout tab</p>';
setState(true);
</script></body></html>
