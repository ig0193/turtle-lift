<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive flow — log a workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17140F;--card:#211D18;--line:#332C22;--off:#241F19;--t1:#F5EFE8;--t2:#A89C8E;
      --t3:#6B6156;--acc:#D85A30;--acc2:#F0997B;--on:#1B0C05;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0907;font-family:Inter,system-ui,sans-serif;color:var(--t1);
     -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;
     gap:16px;padding:26px 14px 50px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hint{max-width:352px;font-size:12px;color:#6B6156;line-height:1.6;text-align:center}
.hint b{color:#A89C8E;font-weight:500}

.phone{width:352px;height:716px;background:var(--bg);border-radius:32px;border:1px solid #2A241C;
       overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
        font-size:10px;color:var(--t3);flex-shrink:0}
.scroll{flex:1;overflow-y:auto;padding:2px 18px 16px}
.scroll::-webkit-scrollbar{width:0}
.tabs{display:flex;border-top:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;background:none;border:0;padding:9px 0 11px;color:var(--t3);font:inherit;
             cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--acc)}
.tabs span{font-size:10px;font-weight:500}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round}

h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:14px 0 16px}
.hdr{display:flex;align-items:center;gap:9px;margin:12px 0 10px}
.hdr h2{font-size:16px;font-weight:600;flex:1;letter-spacing:-.01em}
.back{background:none;border:0;color:var(--t2);font-size:23px;line-height:1;cursor:pointer;padding:0 3px}
.big{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:var(--r);padding:14px;
     font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.big:disabled{opacity:.4;cursor:not-allowed}
.ghost{width:100%;background:var(--card);color:var(--t1);border:1px solid var(--line);
       border-radius:var(--r);padding:13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
     border-bottom:1px solid var(--line);cursor:pointer}
.row p{font-size:14px}
.row small{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
.chev{color:var(--t3);font-size:17px}
.tick{color:var(--acc);font-size:15px}

.maps{display:flex;gap:12px;justify-content:center;margin:4px 0 8px}
.maps figure{text-align:center}
.maps .cap{font-size:10px;color:var(--t3);margin-top:2px}
.bm{width:112px;height:auto;display:block}
.bm .muscle-segment path{fill:var(--off);stroke:var(--line);stroke-width:2;transition:fill .3s ease}
.bm .muscle-segment.p path{fill:var(--acc)}
.bm .muscle-segment.s path{fill:var(--acc2)}
.bm [aria-hidden=true]{fill:#2A241C}
.datechip{background:var(--card);border:1px solid var(--line);color:var(--t2);font:inherit;
          font-size:11.5px;padding:5px 11px;border-radius:99px;margin-bottom:8px;cursor:default}
.acch{width:100%;background:none;border:0;color:var(--t1);font:inherit;font-size:14px;font-weight:500;
      display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sub{display:flex;align-items:center;justify-content:space-between;padding:10px 0 10px 14px;
     font-size:13.5px;color:var(--t2);cursor:pointer;border-bottom:1px solid #201B15}
.sub.done{color:var(--t1)}

.glyph{width:42px;height:42px;flex-shrink:0;background:var(--card);border:1px solid var(--line);
       border-radius:9px;display:flex;align-items:center;justify-content:center}
.glyph svg{width:24px;height:24px;stroke:var(--acc2);fill:none;stroke-width:2;stroke-linecap:round}
.exrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}

.chips{display:flex;gap:6px;margin:2px 0 12px}
.chip{font-size:11px;color:var(--t2);background:var(--card);border:1px solid var(--line);
      border-radius:99px;padding:4px 10px}
.setrow{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r);padding:8px 9px;margin-bottom:6px}
.setrow.ok{border-color:#3E3226}
.sn{width:15px;font-size:12px;color:var(--t3);flex-shrink:0}
.in{width:50px;background:#191510;border:1px solid var(--line);border-radius:7px;color:var(--t1);
    font:inherit;font-size:14px;font-weight:600;text-align:center;padding:6px 2px;
    font-variant-numeric:tabular-nums}
.in.wide{width:66px}
.in.ghost2{color:var(--t3);font-weight:500}
.u{font-size:11px;color:var(--t3)}
.ck{margin-left:auto;width:30px;height:30px;flex-shrink:0;border-radius:8px;background:#191510;
    border:1px solid var(--line);color:var(--t3);font-size:14px;cursor:pointer}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.note{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.5}
.hrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #201B15;font-size:12px}
.hrow span:first-child{color:var(--t3)}
.hrow span:last-child{color:var(--t2);font-variant-numeric:tabular-nums}

.cel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px}
.mark{width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--on);font-size:31px;
      display:flex;align-items:center;justify-content:center}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-top:4px}
.cstats div{text-align:center}
.cstats .n{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cstats .l{font-size:10.5px;color:var(--t3);margin-top:2px}
.pbpill{display:inline-flex;align-items:center;gap:5px;background:#33221A;border:1px solid var(--acc);
        color:var(--acc2);font-size:11.5px;padding:4px 12px;border-radius:99px}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;cursor:pointer}
.logo{width:74px;height:74px;border-radius:20px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.logo svg{width:38px;height:38px;stroke:var(--on);fill:none;stroke-width:2.2;stroke-linecap:round}
.tap{position:absolute;bottom:28px;font-size:10.5px;color:var(--t3);letter-spacing:.06em}
.hide{display:none!important}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
</style></head><body>

<div class="phone">
  <div class="status"><span>9:41</span><span>&#9646;&#9646;&#9646;</span></div>
  <div class="scroll" id="view"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<p class="hint" id="tip"></p>

<script>
/* ---------- data ---------- */
const EX = {
 iby:{n:'Incline barbell bench press',e:'barbell',l:'weighted',p:['chest/upper'],s:['triceps/triceps','shoulders/front-delt']},
 idp:{n:'Incline dumbbell press',e:'dumbbell',l:'weighted',p:['chest/upper'],s:['triceps/triceps','shoulders/front-delt']},
 imp:{n:'Incline machine chest press',e:'machine',l:'weighted',p:['chest/upper'],s:['triceps/triceps']},
 fep:{n:'Feet-elevated push-up',e:'bodyweight',l:'bodyweight',p:['chest/upper'],s:['triceps/triceps']},
 bbp:{n:'Barbell bench press',e:'barbell',l:'weighted',p:['chest/mid'],s:['triceps/triceps','shoulders/front-delt']},
 dbp:{n:'Dumbbell bench press',e:'dumbbell',l:'weighted',p:['chest/mid'],s:['triceps/triceps']},
 mcp:{n:'Machine chest press',e:'machine',l:'weighted',p:['chest/mid'],s:['triceps/triceps']},
 pu :{n:'Push-up',e:'bodyweight',l:'bodyweight',p:['chest/mid'],s:['triceps/triceps']},
 ccm:{n:'Cable crossover (mid pulley)',e:'cable',l:'weighted',p:['chest/mid'],s:['shoulders/front-delt']},
 dbb:{n:'Decline barbell bench press',e:'barbell',l:'weighted',p:['chest/lower'],s:['triceps/triceps']},
 dip:{n:'Chest dip',e:'bodyweight',l:'bodyweight',p:['chest/lower'],s:['triceps/triceps']},
 hlc:{n:'High-to-low cable crossover',e:'cable',l:'weighted',p:['chest/lower'],s:['shoulders/front-delt']},
 crp:{n:'Cable rope pushdown',e:'cable',l:'weighted',p:['triceps/triceps'],s:[]},
 skl:{n:'EZ-bar skull crusher',e:'barbell',l:'weighted',p:['triceps/triceps'],s:[]},
 dmd:{n:'Diamond push-up',e:'bodyweight',l:'bodyweight',p:['triceps/triceps'],s:['chest/mid']},
 btd:{n:'Bench triceps dip',e:'bodyweight',l:'bodyweight',p:['triceps/triceps'],s:['shoulders/front-delt']},
};
const SUBS = [
 {id:'chest/upper', name:'Upper chest', parent:'Chest'},
 {id:'chest/mid',   name:'Mid chest',   parent:'Chest'},
 {id:'chest/lower', name:'Lower chest', parent:'Chest'},
 {id:'triceps/triceps', name:'Triceps', parent:'Triceps', flat:true},
];
/* what the user did last time, so prefills and PBs are real */
const LAST = {bbp:{w:57.5,r:8,txt:'57.5kg × 8'}, crp:{w:30,r:12,txt:'30kg × 12'},
              idp:{w:22,r:10,txt:'22kg × 10'}, dip:{r:10,txt:'10 reps'}};
const HIST = {bbp:[['9 Jul','57.5×8 · 57.5×7 · 55×8'],['5 Jul','55×8 · 55×8']],
              crp:[['9 Jul','30×12 · 30×10'],['5 Jul','27.5×12']]};
const GLYPH = {
 barbell:'<path d="M4 16h24"/><path d="M7 11v10M10 9v14M22 9v14M25 11v10"/>',
 dumbbell:'<path d="M11 16h10"/><path d="M8 11v10M5 13v6M24 11v10M27 13v6"/>',
 machine:'<rect x="6" y="6" width="20" height="20" rx="3"/><path d="M11 12h10M11 16h10M11 20h5"/>',
 cable:'<path d="M16 4v12"/><circle cx="16" cy="19" r="3"/><path d="M11 26h10"/>',
 bodyweight:'<circle cx="16" cy="7" r="3"/><path d="M16 11v9M16 20l-5 6M16 20l5 6M9 14h14"/>',
};

/* ---------- state ---------- */
let S, sub=null, cur=null;
const reset = () => { S = {screen:'splash', session:null}; sub=null; cur=null; };
reset();

const ex = id => S.session.ex.find(e => e.id === id);
const complete = (st, l) => st.ok && ((l==='bodyweight' ? st.r : st.r) > 0);
const setsDone = () => !S.session ? 0 :
  S.session.ex.reduce((n,e)=>n+e.sets.filter(s=>complete(s,EX[e.id].l)).length,0);
const trained = () => !S.session ? [] :
  [...new Set(S.session.ex.filter(e=>e.state==='done').flatMap(e=>EX[e.id].p))];
const worked = () => { // everything touched, primary + secondary, for the map
  if(!S.session) return {p:[],s:[]};
  const done = S.session.ex.filter(e=>e.state==='done');
  return {p:[...new Set(done.flatMap(e=>EX[e.id].p))],
          s:[...new Set(done.flatMap(e=>EX[e.id].s))]};
};
const isPB = e => { const L=LAST[e.id]; if(!L) return false;
  const best = e.sets.filter(s=>complete(s,EX[e.id].l))
                     .reduce((b,s)=>!b||(s.w||0)>(b.w||0)||((s.w||0)===(b.w||0)&&s.r>(b.r||0))?s:b,null);
  if(!best) return false;
  return (best.w||0) > (L.w||0) || ((best.w||0)===(L.w||0) && best.r > L.r); };
const pbCount = () => S.session.ex.filter(isPB).length;

/* ---------- helpers ---------- */
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h; return d; };
function bodyMap(srcId, w) {
  const c = document.getElementById(srcId).cloneNode(true);
  c.removeAttribute('id'); c.classList.add('bm');
  c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  const W = worked();
  W.p.forEach(m=>c.querySelectorAll(`[data-muscle-group="${m.split('/')[0]}"][data-sub-muscle-group="${m.split('/')[1]}"]`).forEach(n=>n.classList.add('p')));
  W.s.forEach(m=>c.querySelectorAll(`[data-muscle-group="${m.split('/')[0]}"][data-sub-muscle-group="${m.split('/')[1]}"]`).forEach(n=>n.classList.add('s')));
  return c.outerHTML;
}
const TIPS = {
 splash:'Tap the screen to enter. <b>Everything here is live</b> — nothing is a picture.',
 home:'Tap <b>Start workout</b>.',
 templates:'Pick <b>Chest and triceps day</b>.',
 overview:'Tap a muscle to see its exercises. Watch the diagram fill in as you mark exercises done — <b>primary muscles fill strong, secondary light</b>.',
 exlist:'Equipment is the only thing that differs inside a muscle group, so the glyph carries it.',
 log:'Edit the numbers, tick the sets. <b>Greyed values are guesses from last time.</b> A set only counts once ticked AND its field is above zero.',
 celebrate:'', summary:''
};

/* ---------- screens ---------- */
function render() {
  const v = document.getElementById('view'), T = document.getElementById('tabs');
  document.getElementById('tip').innerHTML = TIPS[S.screen] || '';
  T.style.display = (S.screen==='splash'||S.screen==='celebrate') ? 'none' : 'flex';
  T.innerHTML = ['Workout','Muscles','Profile'].map((n,i)=>
    `<button class="${i===0?'on':''}"><svg viewBox="0 0 24 24">${
      i===0?'<path d="M4 12h16M7 8v8M17 8v8"/>':
      i===1?'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M12 15l-3 6M12 15l3 6M7 10h10"/>':
            '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>'
    }</svg><span>${n}</span></button>`).join('');

  v.className = 'scroll';
  v.innerHTML = ({splash:vSplash, home:vHome, templates:vTemplates, overview:vOverview,
                  exlist:vExlist, log:vLog, celebrate:vCel, summary:vSummary})[S.screen]();
  wire(v);
  v.scrollTop = 0;
}

const vSplash = () => `<div class="splash" id="go-home">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 8v8M10 6v12M14 6v12M17 8v8"/></svg></div>
  <div style="text-align:center"><p style="font-size:19px;font-weight:600">[ App name ]</p>
  <p style="font-size:12.5px;color:var(--t2);margin-top:3px">Log a set. That's it.</p></div>
  <span class="tap">TAP TO CONTINUE</span></div>`;

const vHome = () => `<h1>Workout</h1>
  <div style="text-align:center;padding:24px 14px 26px">
    <p style="font-size:15px;font-weight:600;margin-bottom:5px">Ready when you are</p>
    <p style="font-size:12.5px;color:var(--t2);line-height:1.55">Pick a template for a planned session, or go ad-hoc.</p></div>
  <button class="big" id="go-templates">Start workout</button>
  <button class="ghost" style="margin-top:9px">Ad-hoc workout</button>`;

const vTemplates = () => `<div class="hdr"><button class="back" data-go="home">&#8249;</button><h2>Choose a template</h2></div>
  <p class="lbl" style="margin-top:4px">Predefined</p>
  ${[['Push day','Chest, shoulders, triceps',0],['Pull day','Back, biceps',0],
     ['Leg day','Quads, hamstrings, glutes, calves',0],['Chest and triceps day','Chest, triceps',1]]
    .map(([n,d,live])=>`<div class="row" ${live?'id="go-overview"':''} style="${live?'':'opacity:.45'}">
      <div><p ${live?'style="color:var(--acc2)"':''}>${n}</p><small>${d}</small></div><span class="chev">&#8250;</span></div>`).join('')}`;

function vOverview() {
  const t = trained();
  return `<div class="hdr"><button class="back" data-go="templates">&#8249;</button><h2>Chest and triceps day</h2></div>
  <button class="datechip">Today</button>
  <div class="maps"><figure>${bodyMap('src-front')}<p class="cap">Front</p></figure>
    <figure>${bodyMap('src-back')}<p class="cap">Back</p></figure></div>
  <div class="acch"><span>Chest</span><span class="chev">&#8964;</span></div>
  ${SUBS.filter(s=>!s.flat).map(s=>`<div class="sub ${t.includes(s.id)?'done':''}" data-sub="${s.id}">
      <span>${s.name}</span>${t.includes(s.id)?'<span class="tick">&#10003;</span>':'<span class="chev">&#8250;</span>'}</div>`).join('')}
  ${SUBS.filter(s=>s.flat).map(s=>`<div class="acch" data-sub="${s.id}" style="cursor:pointer">
      <span>${s.name}</span>${t.includes(s.id)?'<span class="tick">&#10003;</span>':'<span class="chev">&#8250;</span>'}</div>`).join('')}
  <div style="margin-top:20px">
    <button class="big" id="go-finish" ${setsDone()?'':'disabled'}>Finish workout</button>
    ${setsDone()?'':'<p class="note">Log at least one set to finish — an empty session is never saved.</p>'}
    <button class="ghost" style="margin-top:8px;color:var(--t2)" data-go="home">Discard workout</button></div>`;
}

function vExlist() {
  const meta = SUBS.find(s=>s.id===sub);
  const list = Object.entries(EX).filter(([,x])=>x.p.includes(sub));
  return `<div class="hdr"><button class="back" data-go="overview">&#8249;</button><h2>${meta.name}</h2></div>
  <p class="note" style="margin:0 0 8px">${list.length} exercises — pick whichever kit is free</p>
  ${list.map(([id,x])=>{
    const done = S.session.ex.find(e=>e.id===id);
    return `<div class="exrow" data-ex="${id}">
      <div class="glyph"><svg viewBox="0 0 32 32">${GLYPH[x.e]}</svg></div>
      <div style="flex:1"><p>${x.n}</p><small>${x.e[0].toUpperCase()+x.e.slice(1)}${
        LAST[id]?' · Last '+LAST[id].txt:''}</small></div>
      ${done?`<span class="tick">${done.state==='done'?'&#10003;':'&#8226;'}</span>`:'<span class="chev">&#8250;</span>'}</div>`;
  }).join('')}`;
}

function vLog() {
  const x = EX[cur], e = ex(cur), L = LAST[cur], bw = x.l==='bodyweight';
  return `<div class="hdr"><button class="back" data-go="exlist">&#8249;</button><h2>${x.n}</h2></div>
  <div class="chips"><span class="chip">${x.e[0].toUpperCase()+x.e.slice(1)}</span>
    <span class="chip">${bw?'Reps':'Weight × reps'}</span></div>
  <div id="sets">${e.sets.map((st,i)=>`
    <div class="setrow ${complete(st,x.l)?'ok':''}"><span class="sn num">${i+1}</span>
      ${bw?'':`<input class="in num ${st.touched?'':'ghost2'}" data-i="${i}" data-f="w" value="${st.w}"><span class="u">kg</span>`}
      <input class="in num ${bw?'wide ':''}${st.touched?'':'ghost2'}" data-i="${i}" data-f="r" value="${st.r}"><span class="u">reps</span>
      <button class="ck ${st.ok?'on':''}" data-tick="${i}">&#10003;</button></div>`).join('')}</div>
  <p class="note">Greyed values are guesses from last time — tap to change.</p>
  <button class="ghost" style="margin-top:11px" id="add-set">+ Add set</button>
  <button class="big" style="margin-top:8px" id="mark-done" ${e.sets.some(s=>complete(s,x.l))?'':'disabled'}>
    ${e.state==='done'?'Done &#10003;':'Mark exercise done'}</button>
  ${HIST[cur]?`<p class="lbl">Recent</p>${HIST[cur].map(([d,s])=>
      `<div class="hrow"><span>${d}</span><span>${s}</span></div>`).join('')}`:''}`;
}

const vCel = () => { const pb = pbCount(); return `<div class="cel">
  <div class="mark">&#10003;</div>
  <p style="font-size:20px;font-weight:600;letter-spacing:-.02em">Workout saved</p>
  <p style="font-size:13px;color:var(--t2)">Chest and triceps day</p>
  <div class="cstats">
    <div><p class="n">${setsDone()}</p><p class="l">Sets</p></div>
    <div><p class="n">${S.session.ex.filter(e=>e.state==='done').length}</p><p class="l">Exercises</p></div>
    <div><p class="n">1</p><p class="l">Day streak</p></div>
    <div><p class="n">${Math.round(setsDone()*42.5/60*(setsDone()<10?3.5:5)*3.5*70/200)}</p><p class="l">kcal</p></div></div>
  ${pb?`<div class="pbpill">&#9733; ${pb} personal best${pb>1?'s':''}</div>`:''}
  <button class="ghost" style="width:auto;padding:10px 22px;margin-top:10px" id="go-summary">See summary</button>
</div>`; };

function vSummary() {
  const pb = pbCount();
  return `<div class="hdr"><button class="back" data-go="home">&#8249;</button><h2>Summary</h2></div>
  <div style="background:var(--card);border-radius:14px;padding:16px 14px;display:flex;
       flex-direction:column;align-items:center">
    <p style="font-size:10px;letter-spacing:.12em;color:var(--t3);text-transform:uppercase">Today</p>
    <p style="font-size:17px;font-weight:600;margin:3px 0 10px">Chest and triceps day</p>
    <div class="maps"><figure>${bodyMap('src-front')}<p class="cap">Front</p></figure>
      <figure>${bodyMap('src-back')}<p class="cap">Back</p></figure></div>
    ${pb?`<div class="pbpill" style="margin-top:12px">&#9733; ${pb} personal best${pb>1?'s':''}</div>`:''}
    <div class="cstats" style="margin-top:14px">
      <div><p class="n" style="font-size:19px">${setsDone()}</p><p class="l">Sets</p></div>
      <div><p class="n" style="font-size:19px">${S.session.ex.filter(e=>e.state==='done').length}</p><p class="l">Exercises</p></div></div>
    <p style="font-size:9.5px;color:var(--t3);letter-spacing:.1em;margin-top:12px">[ APP NAME ]</p></div>
  <p class="lbl">What you did</p>
  ${S.session.ex.filter(e=>e.sets.some(s=>complete(s,EX[e.id].l))).map(e=>`
    <div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
        <span style="font-size:12.5px;font-weight:500">${EX[e.id].n}</span>
        ${isPB(e)?'<span class="pbpill" style="font-size:10px;padding:1px 8px">&#9733; PB</span>':''}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${e.sets.filter(s=>complete(s,EX[e.id].l))
        .map(s=>`<span style="font-size:11.5px;color:var(--t2);background:var(--card);border-radius:6px;
          padding:3px 7px" class="num">${EX[e.id].l==='bodyweight'?s.r+' reps':s.w+'×'+s.r}</span>`).join('')}</div></div>`).join('')}
  <button class="big" style="margin-top:16px" id="restart">Start again</button>`;
}

/* ---------- interactions ---------- */
function wire(v) {
  const on = (sel, fn) => v.querySelectorAll(sel).forEach(n => n.onclick = fn);
  const nav = s => { S.screen = s; render(); };

  on('#go-home', ()=>nav('home'));
  on('#go-templates', ()=>nav('templates'));
  on('[data-go]', e => nav(e.currentTarget.dataset.go));
  on('#go-overview', ()=>{ S.session = {ex:[]}; nav('overview'); });
  on('[data-sub]', e => { sub = e.currentTarget.dataset.sub; nav('exlist'); });
  on('[data-ex]', e => {
    cur = e.currentTarget.dataset.ex;
    if (!ex(cur)) {
      const L = LAST[cur], bw = EX[cur].l==='bodyweight';
      S.session.ex.push({id:cur, state:'in_progress',
        sets:[{w: L? L.w : (bw?0:20), r: L? L.r : 8, ok:false, touched:false}]});
    }
    nav('log');
  });
  on('[data-tick]', e => {
    const st = ex(cur).sets[+e.currentTarget.dataset.tick];
    if (!st.ok && !(st.r > 0)) { e.currentTarget.animate(
      [{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],160); return; }
    st.ok = !st.ok; render();
  });
  on('#add-set', () => {
    const s = ex(cur).sets, last = s[s.length-1];
    s.push({w:last.w, r:last.r, ok:false, touched:false}); render();
  });
  on('#mark-done', () => { ex(cur).state='done'; nav('overview'); });
  on('#go-finish', ()=>nav('celebrate'));
  on('#go-summary', ()=>nav('summary'));
  on('#restart', ()=>{ reset(); render(); });

  v.querySelectorAll('.in').forEach(inp => {
    inp.oninput = () => {
      const st = ex(cur).sets[+inp.dataset.i];
      st[inp.dataset.f] = parseFloat(inp.value) || 0;
      st.touched = true; inp.classList.remove('ghost2');
      const btn = v.querySelector('#mark-done');
      if (btn) btn.disabled = !ex(cur).sets.some(s=>complete(s,EX[cur].l));
    };
  });
}
render();
</script></body></html>
