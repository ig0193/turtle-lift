/quads"],"s":[],"su":"Stand with feet wider than shoulder width, toes turned out 30 to 45 degrees. Hold one kettlebell by the horns at chest height or hanging between the legs.","po":"Chest up, torso upright, core braced, knees pushed out to track over the toes.","exn":"Inhale and squat straight down until the thighs are at least parallel. Drive up through the heels and squeeze the glutes at the top, exhaling.","cm":"Letting the knees cave inward. Leaning forward as the bell pulls down."},{"id":"banded-lateral-walk","n":"Banded lateral walk","eq":"bands","lt":"weighted","p":["glutes/glutes"],"s":[],"su":"Loop a band around the legs just above the knees or around the ankles. Feet hip width, quarter-squat position.","po":"Chest up, hips low in a quarter squat, core braced, feet pointing straight ahead throughout.","exn":"Step sideways against the band, keeping constant tension and never letting the feet come fully together. Breathe steadily. Take the set number of steps each way.","cm":"Standing up tall between steps, which kills the tension. Letting the feet turn outward. Letting the trailing foot snap in."},{"id":"standing-calf-raise-machine","n":"Standing calf raise machine","eq":"machine","lt":"weighted","p":["calves/calves"],"s":[],"su":"Shoulders under the pads, balls of the feet on the platform edge, heels hanging free. Feet hip width, toes pointing straight ahead.","po":"Stand tall, knees almost straight with a soft bend, chest up, core braced.","exn":"Inhale and lower the heels below the platform until you feel a deep calf stretch. Hold one second. Exhale and press up onto the toes as high as possible, squeezing one second at the top.","cm":"Bouncing through short reps with no stretch or squeeze. Bending the knees to bounce the weight. Rushing, which is the most common calf mistake."},{"id":"seated-calf-raise-machine","n":"Seated calf raise machine","eq":"machine","lt":"weighted","p":["calves/calves"],"s":[],"su":"Sit with the balls of the feet on the platform, pads snug across the lower thighs just above the knees.","po":"Sit tall, back straight, core lightly braced, knees bent at 90 degrees. This angle biases the soleus.","exn":"Inhale and lower the heels for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second at the top.","cm":"Short bouncy reps. Setting the pad on the kneecap rather than the lower thigh."},{"id":"donkey-calf-raise","n":"Donkey calf raise","eq":"machine","lt":"weighted","p":["calves/calves"],"s":[],"su":"Balls of the feet on a raised platform, hinged forward at the hips with the torso roughly parallel to the floor and the pad across the hips.","po":"Flat back, chest up, core braced, knees almost straight.","exn":"Inhale and lower the heels for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second.","cm":"Rounding the lower back in the hinged position. Bouncing without a full stretch."},{"id":"leg-press-calf-raise","n":"Leg press calf raise","eq":"machine","lt":"weighted","p":["calves/calves"],"s":[],"su":"Sit in the leg press with only the balls of the feet on the bottom edge of the platform, heels hanging off.","po":"Back and hips flat against the pad, legs almost straight with a soft knee bend. Keep the safeties engaged.","exn":"Inhale and let the platform push the toes back into a deep stretch, hold one second. Exhale and press up as far as the ankles allow, squeezing one second.","cm":"Letting the feet slip off the platform, which is genuinely dangerous under load. Bending the knees to press the weight."},{"id":"smith-machine-calf-raise","n":"Smith machine calf raise","eq":"machine","lt":"weighted","p":["calves/calves"],"s":[],"su":"Bar on the upper traps, balls of the feet on a raised block or plate, heels hanging free.","po":"Stand tall, knees almost straight, chest up, core braced.","exn":"Inhale and lower the heels for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second at the top.","cm":"Bouncing rapidly through a short range. Letting the block slide out from under the feet."},{"id":"barbell-standing-calf-raise","n":"Barbell standing calf raise","eq":"barbell","lt":"weighted","p":["calves/calves"],"s":[],"su":"Bar on the upper traps as in a squat. Balls of the feet on a raised block, heels hanging free. Feet hip width.","po":"Stand tall, knees almost straight, chest up, core braced hard for balance.","exn":"Inhale and lower the heels for a stretch, hold one second. Exhale and press up onto the toes, squeezing one second.","cm":"Wobbling because balance is the limiting factor rather than the calves. Bouncing without a full range."},{"id":"dumbbell-standing-calf-raise","n":"Dumbbell standing calf raise","eq":"dumbbell","lt":"weighted","p":["calves/calves"],"s":[],"su":"A dumbbell in each hand at your sides. Balls of the feet on a raised block, heels hanging free.","po":"Stand tall, chest up, knees almost straight, core braced.","exn":"Inhale and lower the heels for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second.","cm":"Rushing the reps. Bending the knees to bounce the dumbbells up."},{"id":"single-leg-dumbbell-calf-raise","n":"Single-leg dumbbell calf raise","eq":"dumbbell","lt":"weighted","p":["calves/calves"],"s":[],"su":"One dumbbell in the same-side hand, other hand on a support. Ball of the working foot on a raised block, other foot lifted.","po":"Stand tall, working knee almost straight, hips level, core braced.","exn":"Inhale and lower the heel for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second. Complete all reps, then switch.","cm":"Pulling on the support to help. Bending the knee to bounce."},{"id":"bodyweight-calf-raise","n":"Bodyweight calf raise","eq":"bodyweight","lt":"bodyweight","p":["calves/calves"],"s":[],"su":"Stand with the balls of the feet on a step or raised edge, heels hanging free. Hand on a wall for balance.","po":"Stand tall, knees almost straight, chest up, core braced.","exn":"Inhale and lower the heels for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second at the top.","cm":"Doing fast bouncy reps on flat ground with no stretch. Rushing through high rep counts."},{"id":"single-leg-bodyweight-calf-raise","n":"Single-leg bodyweight calf raise","eq":"bodyweight","lt":"bodyweight","p":["calves/calves"],"s":[],"su":"Ball of one foot on a step, other foot lifted behind. Fingertips on a wall for balance only.","po":"Stand tall, working knee almost straight, hips level, core braced.","exn":"Inhale and lower the heel for a deep stretch, hold one second. Exhale and press up as high as possible, squeezing one second. Complete all reps, then switch.","cm":"Leaning on the wall to take load off. Cutting the stretch short at the bottom."},{"id":"band-calf-raise","n":"Band calf raise","eq":"bands","lt":"weighted","p":["calves/calves"],"s":[],"su":"Sit with the legs extended and loop a band around the balls of the feet, holding both ends. Or stand on the band and hold the handles.","po":"Sit or stand tall, back straight, knees almost straight, core braced.","exn":"Exhale and point the toes away against the band as far as they go, squeezing one second. Return over 2 to 3 seconds into a stretch, inhaling.","cm":"Letting the band snap the feet back. Using so little tension there is no real resistance at the top."},{"id":"jump-rope","n":"Jump rope","eq":"other","lt":"timed","p":["calves/calves"],"s":[],"su":"Rope length checked by standing on the middle, handles reaching roughly to the armpits. Feet together, rope behind the heels.","po":"Stand tall, chest up, elbows tucked close to the ribs, core braced, eyes forward. Wrists do the turning, not the arms.","exn":"Jump about 2cm off the floor, landing softly on the balls of the feet with soft knees. Keep a steady rhythm for the set duration, breathing continuously.","cm":"Jumping far higher than needed, which tires you out fast. Landing flat-footed or on the heels. Swinging from the shoulders instead of the wrists."}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SUBS = D.subs, EX = D.ex, BODIES = D.bodies;
const SUBL = Object.fromEntries(SUBS.map(s => [s.id, s.l]));
const EXBY = Object.fromEntries(EX.map(e => [e.id, e]));

/* which sub-groups have artwork on which view (real, from body_paths.dart) */
const VIEWSUBS = { front: new Set(), back: new Set() };
BODIES.frontMale.s.forEach(s => VIEWSUBS.front.add(s.id));
BODIES.backMale.s.forEach(s => VIEWSUBS.back.add(s.id));
/* side-delt has no artwork of its own — docs/00 §13. It rides front-delt's segment. */
const RIDERS = { 'shoulders/front-delt': ['shoulders/front-delt', 'shoulders/side-delt'] };
const NO_ART = SUBS.filter(s => !VIEWSUBS.front.has(s.id) && !VIEWSUBS.back.has(s.id)).map(s => s.id);

const primaryFor = sub => EX.filter(e => e.p.includes(sub));
const EQS = [...new Set(EX.map(e => e.eq))].sort();

/* ---------- synthetic logged history (in memory, seeded, never stored) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAYTYPES = [
  ['chest/mid','chest/upper','chest/lower','shoulders/front-delt','triceps/triceps'],
  ['back/lats','back/upper','back/lower','biceps/biceps','forearms/forearms'],
  ['quads/quads','hamstrings/hamstrings','glutes/glutes','calves/calves','abs/upper']
];
function buildHistory(state){
  if (state === 'new') return [];
  const n = state === 'heavy' ? 210 : 28;
  const span = state === 'heavy' ? 760 : 86;
  const rnd = mulberry(state === 'heavy' ? 99 : 7);
  const today = new Date(2026, 8, 14);
  const sessions = [];
  /* real lifters repeat the same lifts, so each sub-group gets a stable
     favourite (plus the occasional substitute) rather than a fresh draw */
  const fav = {};
  DAYTYPES.flat().forEach(sub => { const c = primaryFor(sub); if (c.length) fav[sub] = c[Math.floor(rnd() * c.length)]; });
  /* pin one assisted lift into the rotation: only 3 of 260 exercises are assisted,
     and the inverted PB is the rule most likely to ship backwards, so it must be
     reachable in the prototype rather than left to chance */
  fav['back/lats'] = EXBY['assisted-pull-up-machine'] || fav['back/lats'];
  for (let i = 0; i < n; i++) {
    const daysAgo = Math.round(i * (span / n) + rnd() * 2);
    const d = new Date(today); d.setDate(d.getDate() - daysAgo);
    const performedOn = d.toISOString().slice(0, 10);   // local calendar date, not a timestamp
    const pool = DAYTYPES[i % 3];
    const exs = [];
    pool.forEach(sub => {
      const cands = primaryFor(sub);
      if (!cands.length || !fav[sub]) return;
      if (rnd() < 0.25) return;
      const e = rnd() < 0.82 ? fav[sub] : cands[Math.floor(rnd() * cands.length)];
      const prog = 1 - (daysAgo / (span * 1.9));
      const sets = [];
      const nsets = 3 + (rnd() < 0.3 ? 1 : 0);
      for (let s = 0; s < nsets; s++) {
        if (e.lt === 'timed') sets.push({ dur: Math.round((35 + prog * 70 + rnd() * 14) / 5) * 5 });
        else if (e.lt === 'assisted') sets.push({ assist: Math.max(5, Math.round((42 - prog * 26 + rnd() * 6) / 2.5) * 2.5), reps: 6 + Math.floor(rnd() * 4) });
        else if (e.lt === 'bodyweight') sets.push({ added: rnd() < 0.45 ? Math.round(prog * 16 / 2.5) * 2.5 : 0, reps: 6 + Math.floor(rnd() * 7) });
        else sets.push({ kg: Math.round((18 + prog * 48 + rnd() * 7) / 2.5) * 2.5, reps: 5 + Math.floor(rnd() * 5) });
      }
      exs.push({ id: e.id, sets });
    });
    if (exs.length) sessions.push({ performedOn, exs });
  }
  return sessions.sort((a, b) => b.performedOn.localeCompare(a.performedOn));
}

/* ---------- derived on read (nothing below is ever stored) ---------- */
const fmtDur = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function fmtSet(lt, st){
  if (lt === 'timed') return fmtDur(st.dur);
  if (lt === 'assisted') return st.assist + 'kg × ' + st.reps;
  if (lt === 'bodyweight') return (st.added ? '+' + st.added + 'kg × ' + st.reps : st.reps + ' reps');
  return st.kg + 'kg × ' + st.reps;
}
const score = (lt, st) => lt === 'timed' ? st.dur : lt === 'assisted' ? -st.assist
  : (lt === 'bodyweight' ? (st.added || 0) : st.kg) * 1000 + st.reps;

function sessionsFor(exId){
  return H.filter(s => s.exs.some(e => e.id === exId))
          .map(s => ({ performedOn: s.performedOn, sets: s.exs.find(e => e.id === exId).sets }));
}
function statsFor(exId){
  const lt = EXBY[exId].lt, ss = sessionsFor(exId);
  if (!ss.length) return null;
  let best = null;
  ss.forEach(s => s.sets.forEach(st => { if (!best || score(lt, st) > score(lt, best)) best = st; }));
  const last = ss[0].sets.reduce((a, b) => score(lt, b) > score(lt, a) ? b : a);
  return { best, last, times: ss.length, lt, sessions: ss };
}
function isPBSession(exId, idx){
  const lt = EXBY[exId].lt, ss = sessionsFor(exId);
  const older = ss.slice(idx + 1).flatMap(s => s.sets);
  if (!older.length) return idx === ss.length - 1 ? false : true;
  const prevBest = Math.max(...older.map(st => score(lt, st)));
  return Math.max(...ss[idx].sets.map(st => score(lt, st))) > prevBest;
}
/* Window: rolling 7-day blocks. performedOn is a calendar DATE, so this is a
   date-range comparison, never a timestamp one. (Hevy ships a 7-day body graph
   alongside its calendar-week chart; a calendar week reads as empty on a Monday.) */
function weekRange(off){
  const end = new Date(2026, 8, 14); end.setDate(end.getDate() + off * 7);
  const start = new Date(end); start.setDate(start.getDate() - 6);
  const iso = x => x.toISOString().slice(0, 10);
  return { a: iso(start), b: iso(end) };
}
function weekLabel(off){
  if (off === 0) return 'Last 7 days';
  if (off === -999) return 'All time';
  return 'The 7 days to ' + weekRange(off).b;
}
/* IDEA 3: summed maps count PRIMARY only. Secondary attribution is far too
   lopsided in this dataset (front-delt 43, forearms 41 … chest/upper 0). */
function trainedSubs(off){
  const inWin = off === -999 ? H : (() => { const { a, b } = weekRange(off);
    return H.filter(s => s.performedOn >= a && s.performedOn <= b); })();
  const out = new Map();
  inWin.forEach(s => s.exs.forEach(e => EXBY[e.id].p.forEach(p =>
    out.set(p, (out.get(p) || 0) + e.sets.length))));
  return out;
}
function sideCounts(off){
  const t = trainedSubs(off); let front = 0, back = 0;
  t.forEach((n, sub) => { if (VIEWSUBS.front.has(sub) || sub === 'shoulders/side-delt') front += n;
                          if (VIEWSUBS.back.has(sub)) back += n; });
  return { front, back };
}
function freqFor(sub, last = 10){
  const recent = H.slice(0, last);
  const hit = recent.filter(s => s.exs.some(e => EXBY[e.id].p.includes(sub))).length;
  return { hit, of: recent.length };
}
function lastLine(exId){
  const st = statsFor(exId);
  return st ? 'Last: ' + fmtSet(st.lt, st.last) : null;
}
function daysAgo(iso){
  const d = Math.round((new Date(2026, 8, 14) - new Date(iso + 'T00:00:00')) / 86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
}
/* IDEA 14: equipment coverage — which sub-groups your kit cannot reach */
function coverage(owned){
  const m = {};
  SUBS.forEach(s => m[s.id] = EX.filter(e => e.p.includes(s.id) && owned.has(e.eq)).length);
  return m;
}
/* IDEA 8: mechanical equivalents — same primary sub-group, different equipment */
function equivalents(ex){
  return EX.filter(o => o.id !== ex.id && o.p.some(p => ex.p.includes(p)))
           .sort((a, b) => (a.eq === ex.eq ? 1 : 0) - (b.eq === ex.eq ? 1 : 0)
                        || (b.lt === ex.lt ? 1 : 0) - (a.lt === ex.lt ? 1 : 0))
           .slice(0, 8);
}

/* ---------- body diagram: real polygons, real hit-testing ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function diagram(view, opts){
  opts = opts || {};
  const asset = BODIES[view === 'back' ? 'backMale' : 'frontMale'];
  const fillOf = opts.fill || (() => 'var(--muted)');
  const deco = asset.d.map(o => `<polygon points="${o.join(',')}" fill="#1E1A15"/>`).join('');
  const segs = asset.s.map(s => {
    const subs = RIDERS[s.id] || [s.id];
    const title = subs.map(x => SUBL[x] || x).join(' / ');
    const tap = opts.ro ? '' : ` data-seg="${esc(s.id)}"`;
    return s.o.map(o => `<polygon points="${o.join(',')}" fill="${fillOf(s.id)}" stroke="#0E0D0B" stroke-width="2"${tap}
      ><title>${esc(title)}</title></polygon>`).join('');
  }).join('');
  const h = opts.h ? ` style="height:${opts.h}px"` : '';
  return `<svg class="diagram" viewBox="0 0 ${asset.w} ${asset.h}" preserveAspectRatio="xMidYMid meet"${h}>${deco}${segs}</svg>`;
}
/* IDEA 2: the fill answers ABSENCE. Trained inside the window lights up;
   everything untouched stays dark, so the dark regions are the subject. */
function neglectFill(off){
  const t = trainedSubs(off);
  return id => {
    const subs = RIDERS[id] || [id];
    return subs.some(s => t.has(s)) ? 'var(--accent)' : 'var(--muted)';
  };
}
function onSegment(el, handler){
  el.querySelectorAll('[data-seg]').forEach(p =>
    p.addEventListener('click', () => handler(p.getAttribute('data-seg'))));
}
/* a segment that carries two sub-groups asks which one (IDEA 1) */
function pickSub(segId){
  const subs = RIDERS[segId] || [segId];
  if (subs.length === 1) return go('list', { sub: subs[0] });
  S.sheet = subs; render();
}

/* ---------- screens ---------- */
function appbar(title, pushed, acts){
  return `<div class="appbar${pushed ? ' pushed' : ''}">
    ${pushed ? '<span class="back" data-act="back">&#8249;</span>' : ''}
    <h1>${esc(title)}</h1>
    <div class="acts">${acts || ''}${pushed ? '' : '<div class="avatar"></div>'}</div>
  </div>`;
}
const TABBAR = `<div class="tabbar"><span>Workout</span><span class="on">Muscles</span><span>History</span></div>`;
const MAG = `<button class="iconbtn" data-act="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>`;

function subRows(filterFn){
  const byParent = {};
  SUBS.forEach(s => { (byParent[s.g] = byParent[s.g] || []).push(s); });
  const t = trainedSubs(S.week);
  return Object.entries(byParent).map(([g, list]) => list.map(s => {
    if (filterFn && !filterFn(s)) return '';
    const n = t.get(s.id) || 0;
    const noArt = NO_ART.includes(s.id);
    return `<div class="row" data-sub="${s.id}">
      <div class="rl"><b><span class="dot ${n ? '' : 'off'}"></span>${esc(s.l)}</b>
        <small>${primaryFor(s.id).length} exercises${noArt ? ' · no map artwork' : ''}</small></div>
      <div class="rr">${n ? `<em>${n} sets</em>` : 'not this week'}<br><span class="go">&#8250;</span></div>
    </div>`;
  }).join('')).join('');
}

/* ---------- exercise list for a sub-group ---------- */
function screenList(){
  const sub = S.p.sub, list = primaryFor(sub), f = freqFor(sub);

  const mini = `<div class="minimap">${diagram(VIEWSUBS.back.has(sub) && !VIEWSUBS.front.has(sub) ? 'back' : 'front',

    ${H.length ? `<p class="hint" style="text-align:left;margin:0 0 12px">Trained in <b style="color:var(--accent2)">${f.hit} of your last ${f.of}</b> sessions.</p>` : ''}

/* ---------- exercise detail ---------- */
function statBlock(e){
  const st = statsFor(e.id);
  if (!st) return `<p class="empty">You haven't logged this yet.</p>`;
  /* IDEA 12: the inversion travels WITH the number, not only in a banner */
  const inv = e.lt === 'assisted';
  return (inv ? `<div class="banner">Less assistance is better. Your record is the lightest assist you've used.</div>` : '') +
  `<div class="tiles">
    <div class="tile"><span class="v">${inv ? '<em>↓</em> ' : ''}${fmtSet(st.lt, st.best)}</span><span class="k">${inv ? 'Lightest assist' : 'Best'}</span></div>
    <div class="tile"><span class="v">${fmtSet(st.lt, st.last)}</span><span class="k">Last</span></div>
    <div class="tile"><span class="v">${st.times}</span><span class="k">Times</span></div>
  </div>
  <div class="seclbl">Recent</div>
  ${st.sessions.slice(0, 2).map((s, i) => `<div class="sess">
    <div class="sh"><b>${daysAgo(s.performedOn)}</b>${isPBSession(e.id, i) ? '<span class="pb">PB</span>' : ''}</div>
    <div class="pills">${s.sets.map(x => `<span>${fmtSet(st.lt, x)}</span>`).join('')}</div></div>`).join('')}
  ${st.times > 2 ? `<div class="row" data-act="hist"><div class="rl"><b>See all ${st.times} sessions</b></div><span class="go">&#8250;</span></div>` : ''}`;
}
function proseBlock(e){
  const f = (lbl, txt, open) => txt ? `<details class="fld${open ? ' warn' : ''}"${open ? ' open' : ''}>
    <summary>${lbl}</summary><p>${esc(txt)}</p></details>` : '';
  /* IDEA 10: reviewed copy verbatim, only its placement changes.
     Common mistakes is the injury-relevant field, so it is the one left open. */
  return f('Common mistakes', e.cm, true) + f('Setup', e.su) + f('Posture', e.po) + f('Execution', e.exn);
}
function screenDetail(){
  const e = EXBY[S.p.ex], has = !!statsFor(e.id);
  const muscles = `<div class="seclbl">Muscles</div>
    <div class="chips" style="margin-bottom:10px">
      ${e.p.map(p => `<i class="on">${esc(SUBL[p] || p)}</i>`).join('')}
      ${e.s.map(p => `<i>${esc(SUBL[p] || p)}</i>`).join('')}</div>
    ${diagram(S.view, { fill: id => { const subs = RIDERS[id] || [id];
        if (subs.some(x => e.p.includes(x))) return 'var(--accent)';
        if (subs.some(x => e.s.includes(x))) return 'var(--accent2)';
        return 'var(--muted)'; }, h: 200, ro: true })}`;
  const eq = equivalents(e);
  /* IDEA 8: a mechanical substitutes rail — same primary muscle, other equipment */
  const rail = `<div class="seclbl">Other exercises for ${esc(SUBL[e.p[0]] || e.p[0])}</div>
    <div class="rail">${eq.map(o => `<div class="card" data-ex="${o.id}"><b>${esc(o.n)}</b><small>${o.eq}</small></div>`).join('')}</div>`;
  /* IDEA 9: ordering branches on whether history exists */
  const history = statBlock(e), ref = muscles + proseBlock(e);
  return appbar(e.n, true) + `<div class="body">
    <div class="seclbl" style="margin-top:0">${e.eq} · ${e.lt}</div>
    ${has ? history + ref : ref + '<div class="seclbl">Your history</div>' + history}
    ${rail}
  </div>`;
}

/* ---------- exercise history ---------- */
function screenHistory(){
  const e = EXBY[S.p.ex], st = statsFor(e.id);
  return appbar('History', true) + `<div class="body">
    <div class="seclbl" style="margin-top:0">${esc(e.n)}</div>
    <div class="tiles"><div class="tile"><span class="v">${st.times}</span><span class="k">Sessions</span></div>
      <div class="tile"><span class="v">${fmtSet(st.lt, st.best)}</span><span class="k">${e.lt === 'assisted' ? 'Lightest' : 'Best'}</span></div>
      <div class="tile"><span class="v">${st.sessions[st.sessions.length - 1].performedOn.slice(5)}</span><span class="k">First</span></div></div>
    ${st.sessions.map((s, i) => { const pb = isPBSession(e.id, i);
      const bestIdx = s.sets.reduce((bi, x, xi, arr) => score(st.lt, x) > score(st.lt, arr[bi]) ? xi : bi, 0);
      return `<div class="sess"><div class="sh"><b>${s.performedOn} · ${daysAgo(s.performedOn)}</b>${pb ? '<span class="pb">PB</span>' : ''}</div>
        <div class="pills">${s.sets.map((x, xi) => `<span class="${pb && xi === bestIdx ? 'rec' : ''}">${fmtSet(st.lt, x)}</span>`).join('')}</div></div>`;
    }).join('')}
  </div>`;
}

/* ---------- search: one field, three vocabularies (IDEA 4 + 6) ---------- */
function screenSearch(){
  const q = (S.q || '').trim().toLowerCase();
  let rows = '';
  if (q) {
    const subHits = SUBS.filter(s => s.l.toLowerCase().includes(q) || s.id.includes(q));
    const eqHits = EQS.filter(x => x.includes(q));
    /* IDEA 6: your own log ranks first — the only personal signal available offline */
    const logged = new Set(H.flatMap(s => s.exs.map(e => e.id)));
    const exHits = EX.filter(e => e.n.toLowerCase().includes(q)).sort((a, b) => {
      const la = logged.has(a.id) ? 0 : 1, lb = logged.has(b.id) ? 0 : 1;
      if (la !== lb) return la - lb;
      const pa = a.n.toLowerCase().startsWith(q) ? 0 : 1, pb = b.n.toLowerCase().startsWith(q) ? 0 : 1;
      return pa - pb || a.n.localeCompare(b.n);
    });
    rows = subHits.map(s => `<div class="row" data-sub="${s.id}"><div class="rl"><b>${esc(s.l)}<span class="kind">muscle</span></b>
        <small>${primaryFor(s.id).length} exercises</small></div><span class="go">&#8250;</span></div>`).join('')
      + eqHits.map(x => `<div class="row" data-eqgo="${x}"><div class="rl"><b>${esc(x)}<span class="kind">equipment</span></b>
        <small>${EX.filter(e => e.eq === x).length} exercises</small></div><span class="go">&#8250;</span></div>`).join('')
      + exHits.slice(0, 30).map(e => `<div class="row" data-ex="${e.id}"><div class="rl">
        <b>${esc(e.n)}${logged.has(e.id) ? '<span class="kind">logged</span>' : ''}</b>
        <small><span class="eqchip">${e.eq}</span>${esc(lastLine(e.id) || 'not logged yet')}</small></div><span class="go">&#8250;</span></div>`).join('');
    /* never return zero — fall through to muscles and equipment */
    if (!rows) rows = `<p class="empty">Nothing matches "${esc(q)}".</p>` + subRows();
  } else {
    rows = `<div class="seclbl">Muscles</div>` + subRows();
  }
  return appbar('Search', true) + `<div class="body">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6156" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" placeholder="lats · kettlebell · swing" value="${esc(S.q || '')}" autofocus></div>
    ${rows}</div>`;
}
function screenEquip(){
  const list = EX.filter(e => e.eq === S.p.eq);
  return appbar(S.p.eq, true) + `<div class="body"><div class="seclbl" style="margin-top:0">${list.length} exercises</div>
    ${list.map(e => `<div class="row" data-ex="${e.id}"><div class="rl"><b>${esc(e.n)}</b>
      <small>${esc(SUBL[e.p[0]] || '')} · ${esc(lastLine(e.id) || 'not logged yet')}</small></div>
      <span class="go">&#8250;</span></div>`).join('')}</div>`;
}

/* ---------- router + switcher ---------- */
const VARIANTS = {
  A: { name: 'Map + list', ideas: '1 · 2 · 3 · 7', land: landingA,
       blurb: `The diagram and a full <b>19-row companion list</b> share one screen. A segment tap and a row tap go to the same place, so the two screens <code>docs/03</code> puts in between are gone. The list is the only way to reach <b>Side delt</b> — it has no artwork of its own.`,
       watch: `Scroll down: the list is long. Is that a fair price for reaching every sub-group?` },
  B: { name: 'Full-bleed map', ideas: '15 · 2 · 3 · 7', land: landingB,
       blurb: `Nothing but the map. Search moves into the pinned header's unused <code>actions</code> slot, front/back becomes a turn control. The tab is one object rather than a page of controls.`,
       watch: `Side delt is unreachable here, and there is no text fallback for a mis-tap. Does the map earn that?` },
  C: { name: 'Index first', ideas: '4 · 6 · 14', land: landingC,
       blurb: `List-led, not map-led. Search is the hero and indexes <b>three vocabularies</b>. Declaring your equipment dims what your kit cannot reach, and your own recent lifts sit above the fold. The map is demoted to a card.`,
       watch: `Toggle equipment chips off — with bodyweight only, three sub-groups have no exercises at all.` }
};
const S = { variant: 'A', data: 'regular', screen: 'land', p: {}, view: 'front', week: 0, q: '',
            owned: new Set(EQS), sheet: null, stack: [] };
let H = [];

function go(screen, p, replace){
  if (!replace && S.screen !== screen) S.stack.push({ screen: S.screen, p: S.p, q: S.q });
  S.screen = screen; S.p = p || {}; render();
}
function back(){ const prev = S.stack.pop(); if (prev) { S.screen = prev.screen; S.p = prev.p; S.q = prev.q; } else S.screen = 'land'; render(); }

function render(){
  const V = VARIANTS[S.variant];
  let html;
  if (S.screen === 'land') html = V.land();
  else if (S.screen === 'list') html = screenList();
  else if (S.screen === 'detail') html = screenDetail();
  else if (S.screen === 'history') html = screenHistory();
  else if (S.screen === 'search') html = screenSearch();
  else if (S.screen === 'equip') html = screenEquip();
  else if (S.screen === 'map') html = appbar('Body map', true) + `<div class="body">
      <div class="flip"><button data-act="v-front" class="${S.view === 'front' ? 'on' : ''}">Front</button>
      <button data-act="v-back" class="${S.view === 'back' ? 'on' : ''}">Back</button></div>
      ${diagram(S.view, { fill: neglectFill(S.week) })}<p class="hint">Tap a muscle.</p></div>`;

  if (S.sheet) html += `<div style="position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end" data-act="sheet-x">
    <div style="width:100%;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 18px 22px">
      <div class="seclbl" style="margin-top:0">This segment carries two muscles</div>
      ${S.sheet.map(x => `<div class="row" data-sub="${x}"><div class="rl"><b>${esc(SUBL[x] || x)}</b>
        <small>${primaryFor(x).length} exercises</small></div><span class="go">&#8250;</span></div>`).join('')}
    </div></div>`;

  const phone = document.getElementById('phone');
  phone.innerHTML = html;
  onSegment(phone, pickSub);
  phone.querySelectorAll('[data-sub]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation(); S.sheet = null;
    const sub = el.getAttribute('data-sub');
    go('list', { sub }, S.screen === 'list');   /* replace, don't push (IDEA 11) */
  }));
  phone.querySelectorAll('[data-ex]').forEach(el => el.addEventListener('click', () =>
    go('detail', { ex: el.getAttribute('data-ex') })));
  phone.querySelectorAll('[data-eqgo]').forEach(el => el.addEventListener('click', () =>
    go('equip', { eq: el.getAttribute('data-eqgo') })));
  phone.querySelectorAll('[data-eq]').forEach(el => el.addEventListener('click', () => {
    const q = el.getAttribute('data-eq');
    S.owned.has(q) ? S.owned.delete(q) : S.owned.add(q);
    if (!S.owned.size) S.owned.add(q);
    render();
  }));
  phone.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', ev => {
    const a = el.getAttribute('data-act');
    if (a === 'sheet-x' && ev.target !== el) return;
    if (a === 'back') back();
    else if (a === 'search') go('search', {});
    else if (a === 'map') go('map', {});
    else if (a === 'hist') go('history', { ex: S.p.ex });
    else if (a === 'turn') { S.view = S.view === 'front' ? 'back' : 'front'; render(); }
    else if (a === 'v-front') { S.view = 'front'; render(); }
    else if (a === 'v-back') { S.view = 'back'; render(); }
    else if (a === 'wk-') { S.week = S.week === -12 ? -999 : (S.week === -999 ? -999 : S.week - 1); render(); }
    else if (a === 'wk+') { S.week = S.week === -999 ? -12 : Math.min(0, S.week + 1); render(); }
    else if (a === 'sheet-x') { S.sheet = null; render(); }
  }));
  const q = phone.querySelector('#q');
  if (q) { q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; render();
    const n = document.getElementById('q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); q.focus(); }

  document.getElementById('vlabel').textContent = S.variant + ' — ' + V.name;
  document.querySelectorAll('#dataseg i').forEach(i =>
    i.classList.toggle('on', i.getAttribute('data-d') === S.data));
  document.getElementById('caption').innerHTML =
    `<h2>${S.variant} — ${esc(V.name)}</h2><p class="ideas">ideas ${V.ideas}</p><p>${V.blurb}</p>
     <p><b>Worth watching.</b> ${V.watch}</p>
     <p><b>State.</b> ${H.length} sessions · window ${weekLabel(S.week)} · ${trainedSubs(S.week).size}/19 sub-groups lit ·
     ${S.owned.size}/8 equipment. Everything shown is derived on read; nothing here is stored.</p>
     <p style="color:#5A5148">Throwaway prototype. Real geometry, taxonomy and exercises; synthetic logged history.</p>`;
  const u = new URL(location); u.searchParams.set('variant', S.variant); u.searchParams.set('data', S.data);
  history.replaceState(null, '', u);
}
function setVariant(v){ S.variant = v; S.screen = 'land'; S.stack = []; S.sheet = null; render(); }
function setData(d){ S.data = d; H = buildHistory(d); S.screen = 'land'; S.stack = []; render(); }

const ORDER = ['A', 'B', 'C'];
document.getElementById('prev').onclick = () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 2) % 3]);
document.getElementById('next').onclick = () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 1) % 3]);
document.querySelectorAll('#dataseg i').forEach(i => i.onclick = () => setData(i.getAttribute('data-d')));
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});
const sp = new URLSearchParams(location.search);
if (ORDER.includes((sp.get('variant') || '').toUpperCase())) S.variant = sp.get('variant').toUpperCase();
if (['new', 'regular', 'heavy'].includes(sp.get('data'))) S.data = sp.get('data');
H = buildHistory(S.data);
render();
</script>
