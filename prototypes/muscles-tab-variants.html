<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Muscles tab variants</title>
<!--
  THROWAWAY PROTOTYPE. Not production code, not the visual reference.

  Question: what should the Muscles tab look like?
  Three structurally different variants of the Muscles tab landing and its
  drill-down, switchable via ?variant=A|B|C and the floating bottom bar.

    A — Map + list      ideas 1, 2, 3, 7
    B — Full-bleed map  ideas 15, 2, 3, 7
    C — Index first     ideas 4, 6, 14

  Deeper screens (exercise list / detail / history) are shared by all three
  and carry ideas 8, 9, 10, 11, 12.

  Real data: body_paths.dart (42 segments, real polygons, real hit-testing),
  muscle_taxonomy.dart (19 sub-groups), exercises.json (260 exercises).
  Logged history is SYNTHETIC and generated in-memory from a seeded PRNG —
  nothing persists, nothing is stored. Everything shown is derived on read.

  Ideas are from docs/ideation/2026-09-14-muscles-tab-ideation.html
-->
<style>
:root{
  --page:#17140F; --surface:#211D18; --line:#332C22; --muted:#241F19;
  --ink:#F5EFE8; --ink2:#A89C8E; --ink3:#6B6156;
  --accent:#D85A30; --accent2:#F0997B; --onaccent:#1B0C05; --danger:#C4553A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0E0D0B;color:var(--ink);font:14px/1.5 var(--sans);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:26px 16px 130px}

.stage{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.caption{max-width:290px;font-size:12.5px;line-height:1.6;color:var(--ink3);padding-top:8px}
.caption h2{font-size:15px;color:var(--ink);margin:0 0 8px;font-weight:650}
.caption p{margin:0 0 10px}
.caption b{color:var(--ink2);font-weight:600}
.caption .ideas{font:11px/1.6 var(--mono);color:var(--accent2)}

/* ---- phone ---- */
.phone{width:390px;height:800px;background:var(--page);border:1px solid #3A322A;border-radius:30px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.55);position:relative}
.appbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--page);z-index:5}
.appbar .back{font-size:20px;color:var(--ink2);cursor:pointer;line-height:1;padding:2px 6px 2px 0}
.appbar h1{margin:0;font-size:25px;font-weight:680;letter-spacing:-.02em;flex:1}
.appbar.pushed h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
.appbar .acts{display:flex;align-items:center;gap:12px}
.avatar{width:30px;height:30px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:0 0 auto}
.iconbtn{width:30px;height:30px;border-radius:999px;background:transparent;border:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}
.body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 18px 18px}
.body.flush{padding:0}
.body::-webkit-scrollbar{width:0}
.tabbar{flex:0 0 auto;display:flex;gap:6px;padding:9px;margin:0 14px 14px;background:rgba(33,29,24,.94);
  border:1px solid var(--line);border-radius:999px}
.tabbar span{flex:1;text-align:center;font-size:11px;letter-spacing:.03em;color:var(--ink3);padding:7px 0;border-radius:999px;cursor:default}
.tabbar span.on{background:var(--surface);color:var(--ink);font-weight:600}

/* ---- common bits ---- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:14px;cursor:pointer}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:13.5px var(--sans)}
.search input::placeholder{color:var(--ink3)}
.hint{font-size:11.5px;color:var(--ink3);text-align:center;margin:10px 0 0}
.seclbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:650;margin:18px 0 9px}
.seclbl:first-child{margin-top:0}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.stepper button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:9px;
  width:30px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.stepper button:hover{color:var(--ink)}
.stepper .win{font-size:12.5px;color:var(--ink);font-weight:600}
.stepper .win small{display:block;font-size:10.5px;color:var(--ink3);font-weight:400;text-align:center}

.flip{display:flex;gap:7px;margin-bottom:12px}
.flip button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  border-radius:10px;padding:8px 6px;cursor:pointer;font:600 12px var(--sans);text-align:center}
.flip button.on{background:rgba(216,90,48,.16);border-color:rgba(240,153,123,.45);color:var(--ink)}
.flip button b{display:block;font-size:15px;font-weight:680;color:var(--ink);letter-spacing:-.01em}
.flip button.on b{color:var(--accent2)}
.flip button small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-top:1px}

.diagram{display:block;width:100%;height:auto;max-height:100%;touch-action:manipulation}
.diagram polygon{cursor:pointer;transition:fill .12s}
.diagram polygon:hover{fill:var(--accent2)!important}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:rgba(255,255,255,.02)}
.row .rl b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.row .rl small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.row .rr{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap}
.row .rr em{font-style:normal;color:var(--accent2)}
.row .go{color:var(--ink3);font-size:15px}
.dot{display:inline-block;width:6px;height:6px;border-radius:999px;background:var(--accent);margin-right:6px;vertical-align:middle}
.dot.off{background:#3A332A}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips i{font-style:normal;font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--muted);color:var(--ink3);cursor:pointer}
.chips i.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:650}
.chips i.dim{opacity:.4}
.eqchip{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;
  border-radius:999px;border:1px solid var(--line);background:var(--muted);color:var(--ink3);margin-right:6px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;margin-bottom:14px}
.tile{background:var(--surface);padding:12px 10px;text-align:center}
.tile .v{font-size:17px;font-weight:680;letter-spacing:-.02em;color:var(--ink);display:block}
.tile .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:4px;display:block}
.tile .v em{font-style:normal;color:var(--accent2);font-size:13px}
.empty{font-size:13px;color:var(--ink3);padding:14px 0;margin-bottom:6px}
.banner{border:1px solid rgba(240,153,123,.45);background:rgba(216,90,48,.10);border-radius:10px;
  padding:10px 12px;font-size:12px;color:var(--accent2);margin-bottom:12px}

details.fld{border-top:1px solid var(--line);padding:10px 0}
details.fld summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);font-weight:650;list-style:none}
details.fld summary::-webkit-details-marker{display:none}
details.fld summary::after{content:' +';color:var(--ink3)}
details.fld[open] summary::after{content:' –'}
details.fld p{margin:9px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
details.fld.warn summary{color:var(--accent2)}

.rail{display:flex;gap:9px;overflow-x:auto;padding:2px 0 6px;margin:0 -18px;padding-left:18px;padding-right:18px}
.rail::-webkit-scrollbar{height:0}
.rail .card{flex:0 0 auto;width:132px;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:11px;cursor:pointer}
.rail .card b{display:block;font-size:12px;font-weight:600;line-height:1.35;margin-bottom:5px}
.rail .card small{font-size:10px;color:var(--ink3)}

.sess{border-bottom:1px solid var(--line);padding:12px 0}
.sess .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sess .sh b{font-size:12.5px;font-weight:600}
.pb{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:rgba(216,90,48,.18);
  border:1px solid rgba(240,153,123,.4);color:var(--accent2);border-radius:999px;padding:2px 7px;font-weight:650}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pills span{font:11px var(--mono);background:var(--muted);border:1px solid var(--line);border-radius:6px;
  padding:3px 7px;color:var(--ink2)}
.pills span.rec{background:rgba(216,90,48,.16);border-color:rgba(240,153,123,.4);color:var(--accent2)}
.minimap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
.minimap svg{display:block;width:100%;height:118px}
.minimap p{margin:6px 0 0;font-size:10.5px;color:var(--ink3);text-align:center}
.btn{display:block;width:100%;background:var(--accent);color:var(--onaccent);border:0;border-radius:12px;
  padding:14px;font:680 14px var(--sans);cursor:pointer;margin-bottom:10px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600}
.kind{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:650;
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:7px}

/* ---- switcher ---- */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:50;display:flex;align-items:center;
  gap:5px;background:#F5EFE8;color:#17140F;border-radius:999px;padding:6px 7px;box-shadow:0 10px 34px rgba(0,0,0,.6);
  font:13px var(--sans);flex-wrap:wrap;justify-content:center;max-width:94vw}
.switch button{border:0;background:transparent;cursor:pointer;font:650 14px var(--sans);color:#17140F;
  padding:6px 10px;border-radius:999px}
.switch button:hover{background:rgba(0,0,0,.08)}
.switch .lab{font-weight:680;padding:0 8px;min-width:168px;text-align:center;font-size:13px}
.switch .sep{width:1px;height:22px;background:rgba(0,0,0,.15);margin:0 3px}
.switch .seg{display:flex;background:rgba(0,0,0,.07);border-radius:999px;padding:2px}
.switch .seg i{font-style:normal;font-size:11px;font-weight:650;padding:5px 10px;border-radius:999px;cursor:pointer;color:#4A423A}
.switch .seg i.on{background:#17140F;color:#F5EFE8}
.switch .tag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8A6A3A;padding-left:6px}
@media(max-width:900px){.caption{max-width:390px}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone"></div>
  <div class="caption" id="caption"></div>
</div>

<div class="switch">
  <span class="tag">Prototype</span>
  <button id="prev" title="Previous variant (←)">&#8249;</button>
  <span class="lab" id="vlabel"></span>
  <button id="next" title="Next variant (→)">&#8250;</button>
  <span class="sep"></span>
  <span class="seg" id="dataseg">
    <i data-d="new">New user</i><i data-d="regular">Regular</i><i data-d="heavy">2 years in</i>
  </span>
</div>

"Lower back"},{"id":"shoulders/front-delt","g":"shoulders","l":"Front delt"},{"id":"shoulders/side-delt","g":"shoulders","l":"Side delt"},{"id":"shoulders/rear-delt","g":"shoulders","l":"Rear delt"},{"id":"biceps/biceps","g":"biceps","l":"Biceps"},{"id":"triceps/triceps","g":"triceps","l":"Triceps"},{"id":"forearms/forearms","g":"forearms","l":"Forearms"},{"id":"abs/upper","g":"abs","l":"Upper abs"},{"id":"abs/lower","g":"abs","l":"Lower abs"},{"id":"obliques/obliques","g":"obliques","l":"Obliques"},{"id":"quads/quads","g":"quads","l":"Quads"},{"id":"hamstrings/hamstrings","g":"hamstrings","l":"Hamstrings"},{"id":"glutes/glutes","g":"glutes","l":"Glutes"},{"id":"calves/calves","g":"calves","l":"Calves"}],"ex":[{"id":"barbell-bench-press","n":"Barbell bench press","eq":"barbell","lt":"weighted","p":["chest/mid"],"s":["chest/lower","shoulders/front-delt","triceps/triceps"],"su":"Flat bench, eyes under the bar. Grip roughly 1.5x shoulder width. Feet flat, planted wide.","po":"Shoulder blades pinched back and down into the bench. Chest up, slight natural arch in the lower back. Glutes stay in contact with the bench.","exn":"Unrack and hold over the upper chest. Inhale, lower to mid-chest in about 2 seconds with elbows at 45 degrees to the torso. Touch lightly, press up and exhale through the top half.","cm":"Flaring elbows to 90 degrees, which strains the shoulder. Bouncing the bar off the chest. Lifting the hips off the bench."},{"id":"dumbbell-bench-press","n":"Dumbbell bench press","eq":"dumbbell","lt":"weighted","p":["chest/mid"],"s":["chest/lower","shoulders/front-delt","triceps/triceps"],"su":"Flat bench. Sit with dumbbells on your thighs, then kick them up one at a time as you lie back.","po":"Shoulder blades retracted, chest up, feet flat and driving into the floor.","exn":"Start with dumbbells above the chest, palms forward. Inhale and lower to chest level over 2 seconds, elbows at 45 degrees. Press up and slightly together, exhaling.","cm":"Clashing the dumbbells together at the top, which drops the tension. Dropping too deep and overstretching the shoulder."},{"id":"machine-chest-press","n":"Machine chest press","eq":"machine","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Adjust the seat so the handles sit level with your mid-chest. Feet flat on the floor.","po":"Back and head against the pad, shoulder blades pulled back, chest up.","exn":"Inhale, press the handles forward until the arms are almost straight without locking out. Exhale on the press, return over 2 seconds under control.","cm":"Setting the seat too high, which turns it into a shoulder press. Letting the shoulders roll forward at the end of the push."},{"id":"smith-machine-bench-press","n":"Smith machine bench press","eq":"machine","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Flat bench positioned so the bar path lines up with your mid-chest. Grip 1.5x shoulder width.","po":"Shoulder blades retracted and down, chest up, feet planted.","exn":"Unrack with a wrist twist. Inhale and lower to mid-chest over 2 seconds, elbows at 45 degrees. Press up and exhale.","cm":"Placing the bench too far forward so the fixed bar path hits the neck. Relying on the fixed path and letting the shoulders go loose."},{"id":"push-up","n":"Push-up","eq":"bodyweight","lt":"bodyweight","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps","abs/upper"],"su":"Hands flat on the floor just wider than the shoulders, at chest level. Legs straight, feet hip width.","po":"Body in one straight line from head to heels. Core braced, glutes squeezed, neck neutral with eyes on the floor a foot ahead.","exn":"Inhale and lower until the chest is roughly a fist's height from the floor, elbows at 45 degrees. Press up and exhale.","cm":"Hips sagging or piling up. Flaring elbows straight out to the sides. Only going halfway down."},{"id":"wide-grip-push-up","n":"Wide-grip push-up","eq":"bodyweight","lt":"bodyweight","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Hands flat on the floor, roughly twice shoulder width, at chest level.","po":"Straight line from head to heels, core braced, glutes tight.","exn":"Inhale and lower under control until the chest is just off the floor. Press up and exhale. Range of motion is shorter than a standard push-up.","cm":"Going too wide, which stresses the shoulder joint for very little extra chest work. Letting the hips drop."},{"id":"cable-chest-press","n":"Cable chest press","eq":"cable","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Pulleys set at chest height. Grab both handles, step forward into a split stance for stability.","po":"Chest up, shoulders back and down, core braced, front knee softly bent.","exn":"Inhale, press both handles forward and slightly together until the arms are nearly straight. Exhale on the press, return slowly to a light stretch.","cm":"Standing square with feet level, which makes you unstable. Letting the cables yank the arms back too fast."},{"id":"pec-deck-machine","n":"Pec deck machine","eq":"machine","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt"],"su":"Set the seat so the handles are at chest height. Sit back with elbows on the pads or hands on the grips.","po":"Back flat against the pad, chest up, shoulder blades pulled back.","exn":"Inhale, bring the pads together in front of the chest in a hugging arc. Squeeze for a beat, exhale, then return over 2 seconds to a stretch.","cm":"Setting the start position so wide that the shoulders overstretch. Shrugging the shoulders up during the squeeze."},{"id":"dumbbell-fly","n":"Dumbbell fly","eq":"dumbbell","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt"],"su":"Flat bench, one dumbbell in each hand pressed above the chest, palms facing each other.","po":"Shoulder blades retracted, chest up, feet planted.","exn":"Keep a fixed 10 to 15 degree bend in the elbows. Inhale and open the arms in a wide arc until you feel a chest stretch, roughly level with the bench. Exhale and hug back up.","cm":"Bending and straightening the elbows, which turns it into a press. Going too deep and straining the shoulder. Using far too much weight."},{"id":"cable-crossover-mid-pulley","n":"Cable crossover (mid pulley)","eq":"cable","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt"],"su":"Both pulleys at chest height. A handle in each hand, step forward into a split stance.","po":"Chest up, shoulders down, slight forward lean from the hips, core braced.","exn":"Fixed slight elbow bend. Inhale, then bring the hands together in front of the chest in a wide arc and exhale. Squeeze for a beat, return slowly to a stretch.","cm":"Turning it into a press by bending the elbows. Standing too far back so tension disappears at the finish."},{"id":"barbell-floor-press","n":"Barbell floor press","eq":"barbell","lt":"weighted","p":["chest/mid"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Lie on the floor inside a rack, bar set low. Knees bent, feet flat. Grip 1.5x shoulder width.","po":"Shoulder blades pinched, chest up, glutes and upper back pressed into the floor.","exn":"Inhale, lower until the upper arms rest lightly on the floor, elbows at 45 degrees. Pause for one second, press up and exhale.","cm":"Bouncing the elbows off the floor. Letting the elbows flare wide at the bottom."},{"id":"dumbbell-floor-press","n":"Dumbbell floor press","eq":"dumbbell","lt":"weighted","p":["chest/mid"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Lie flat on the floor with a dumbbell in each hand, knees bent, feet flat.","po":"Shoulder blades pulled back into the floor, chest up, core braced.","exn":"Inhale and lower until the triceps touch the floor, elbows at 45 degrees. Pause one second, press up and exhale.","cm":"Slamming the elbows down. Letting the dumbbells drift toward the head instead of staying over the chest."},{"id":"kettlebell-floor-press","n":"Kettlebell floor press","eq":"kettlebell","lt":"weighted","p":["chest/mid"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Lie on the floor with a kettlebell in each hand, bells resting on the back of the forearms. Knees bent.","po":"Wrists straight and stacked over the elbows, shoulder blades pinched, core braced.","exn":"Inhale and lower until the triceps touch the floor. Pause one second, press up and exhale.","cm":"Letting the wrists bend back under the bell. Allowing the bells to bang the forearms on the way down."},{"id":"resistance-band-chest-press","n":"Resistance band chest press","eq":"bands","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Anchor the band at chest height behind you. A handle in each hand, step forward into a split stance until there is tension.","po":"Chest up, shoulders back and down, core braced.","exn":"Inhale, press both handles forward and slightly together, exhaling. Squeeze the chest at full extension, then return over 2 seconds against the band.","cm":"Letting the band snap the arms back. Standing too close to the anchor, leaving no tension at the start."},{"id":"plate-press-svend-press","n":"Plate press (Svend press)","eq":"other","lt":"weighted","p":["chest/mid"],"s":["shoulders/front-delt"],"su":"Stand tall holding a weight plate flat between both palms at chest height, fingers pointing forward.","po":"Chest up, shoulders back and down, core braced, feet shoulder width.","exn":"Squeeze the palms hard into the plate throughout. Inhale, press the plate straight out until the arms are nearly straight, exhaling. Return slowly, keeping the squeeze.","cm":"Loosening the inward squeeze, which is the entire point of the movement. Letting the plate drift down or up instead of straight out."},{"id":"incline-barbell-bench-press","n":"Incline barbell bench press","eq":"barbell","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Bench set to 30 degrees. Eyes under the bar, grip 1.5x shoulder width, feet flat.","po":"Shoulder blades retracted and down, chest up, hips on the bench.","exn":"Unrack over the upper chest. Inhale and lower to just below the collarbone over 2 seconds, elbows at 45 degrees. Press up and exhale.","cm":"Setting the bench above 45 degrees, which shifts the work to the front delts. Bouncing the bar off the chest."},{"id":"incline-dumbbell-press","n":"Incline dumbbell press","eq":"dumbbell","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Bench at 30 degrees. Sit with dumbbells on the thighs and kick them up as you lie back.","po":"Shoulder blades pinched back, chest up, feet flat and driving into the floor.","exn":"Start with the dumbbells above the upper chest. Inhale and lower to chest level over 2 seconds, elbows at 45 degrees. Press up and slightly in, exhaling.","cm":"Bench angle too steep, turning it into a shoulder press. Banging the dumbbells together at the top."},{"id":"incline-machine-chest-press","n":"Incline machine chest press","eq":"machine","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Adjust the seat so the handles line up with your upper chest, just below the collarbone.","po":"Back and head flat against the pad, shoulder blades back, chest up.","exn":"Inhale, press the handles up and forward until nearly straight without locking out. Exhale on the press, return over 2 seconds.","cm":"Seat set too low, which drags the work down to the mid-chest. Shoulders rolling forward at lockout."},{"id":"incline-smith-machine-press","n":"Incline smith machine press","eq":"machine","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Bench at 30 degrees under the bar, positioned so the fixed path meets your upper chest.","po":"Shoulder blades retracted, chest up, feet planted flat.","exn":"Unrack with a wrist twist. Inhale and lower to the upper chest over 2 seconds, elbows at 45 degrees. Press and exhale.","cm":"Misplacing the bench so the bar path hits the throat or the belly. Letting the fixed path do the stabilising while the shoulders go slack."},{"id":"incline-dumbbell-fly","n":"Incline dumbbell fly","eq":"dumbbell","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt"],"su":"Bench at 30 degrees. Dumbbells pressed above the upper chest, palms facing each other.","po":"Shoulder blades pulled back, chest up, feet flat.","exn":"Hold a fixed 10 to 15 degree elbow bend. Inhale and open the arms wide until you feel a stretch across the upper chest. Exhale and hug back up.","cm":"Straightening and re-bending the elbows. Dropping the arms far below bench level and stressing the shoulder."},{"id":"low-to-high-cable-crossover","n":"Low-to-high cable crossover","eq":"cable","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt"],"su":"Both pulleys at the lowest setting. A handle in each hand, step forward into a split stance.","po":"Chest up, shoulders back and down, slight forward lean, core braced.","exn":"Fixed slight elbow bend. Inhale, then sweep the hands up and together to about chin height, exhaling. Squeeze for a beat and lower slowly.","cm":"Shrugging at the top so the traps take over. Bending the elbows and turning it into a press."},{"id":"feet-elevated-push-up","n":"Feet-elevated push-up","eq":"bodyweight","lt":"bodyweight","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Feet on a bench or box roughly 30 to 60cm high. Hands flat on the floor just wider than the shoulders.","po":"Straight line from head to heels, core braced hard, glutes squeezed, neck neutral.","exn":"Inhale and lower until the chest is a fist's height off the floor, elbows at 45 degrees. Press up and exhale.","cm":"Letting the hips sag as the elevation makes it harder. Going too high too soon, which wrecks the line."},{"id":"incline-cable-press","n":"Incline cable press","eq":"cable","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Incline bench at 30 degrees set between two pulleys, both at the lowest setting. A handle in each hand.","po":"Shoulder blades back, chest up, feet flat.","exn":"Inhale, press both handles up and slightly together over the upper chest, exhaling. Return over 2 seconds to a stretch.","cm":"Placing the bench too far forward so the cables pull from the wrong angle. Letting the handles drift apart at the top."},{"id":"reverse-grip-bench-press","n":"Reverse-grip bench press","eq":"barbell","lt":"weighted","p":["chest/upper"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Flat bench, hands underhand at shoulder width. Have a spotter help unrack, since the grip is awkward.","po":"Shoulder blades retracted, chest up, wrists straight and stacked over the elbows.","exn":"Inhale and lower to the lower chest with elbows tucked close to the ribs. Press up and exhale, driving toward the upper chest.","cm":"Loose wrists under an underhand grip. Unracking alone, which is the riskiest moment of this lift."},{"id":"landmine-press","n":"Landmine press","eq":"barbell","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"One end of a barbell in a landmine sleeve or a corner. Hold the free end at shoulder height in one or both hands.","po":"Half-kneeling or standing tall, chest up, core braced, hips square to the bar.","exn":"Inhale, press the bar up and forward along its arc until the arm is nearly straight, exhaling. Lower over 2 seconds.","cm":"Leaning back to help the press. Letting the hips twist toward the working arm."},{"id":"incline-band-press","n":"Incline band press","eq":"bands","lt":"weighted","p":["chest/upper"],"s":["shoulders/front-delt","triceps/triceps"],"su":"Anchor the band behind an incline bench set to 30 degrees, at roughly bench height. A handle in each hand.","po":"Shoulder blades back, chest up, feet flat.","exn":"Inhale, press up and slightly together over the upper chest, exhaling at the top where band tension peaks. Return over 2 seconds.","cm":"Letting the band snap the arms back. Anchoring too high so the resistance pulls straight down."},{"id":"decline-barbell-bench-press","n":"Decline barbell bench press","eq":"barbell","lt":"weighted","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Decline bench at 15 to 30 degrees, legs secured. Grip 1.5x shoulder width. Have a spotter for unracking.","po":"Shoulder blades retracted, chest up, head supported.","exn":"Unrack over the lower chest. Inhale and lower to the lower chest over 2 seconds, elbows at 45 degrees. Press up and exhale.","cm":"Sitting up quickly afterwards while blood is pooled in the head. Bouncing the bar off the ribs."},{"id":"decline-dumbbell-press","n":"Decline dumbbell press","eq":"dumbbell","lt":"weighted","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Decline bench at 15 to 30 degrees, legs hooked. Dumbbells passed up or kicked into place.","po":"Shoulder blades pinched, chest up, head supported on the bench.","exn":"Start above the lower chest. Inhale and lower to chest level over 2 seconds, elbows at 45 degrees. Press up and slightly in, exhaling.","cm":"Getting into position without help, which is where most decline injuries happen. Letting the dumbbells drift toward the head."},{"id":"chest-dip","n":"Chest dip","eq":"bodyweight","lt":"bodyweight","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Parallel bars, hands at your sides. Push up to a supported start with arms straight.","po":"Lean the torso forward about 30 degrees and keep it there. Chest up, shoulders down away from the ears, ankles crossed behind.","exn":"Inhale and lower until the upper arms are roughly parallel to the floor, elbows flaring slightly out. Press up and exhale, keeping the forward lean.","cm":"Going deeper than shoulder comfort allows. Drifting upright mid-rep, which turns it into a triceps dip. Shrugging at the bottom."},{"id":"assisted-chest-dip-machine","n":"Assisted chest dip machine","eq":"machine","lt":"assisted","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Set the assistance weight, then kneel or stand on the pad with hands on the parallel bars.","po":"Torso leaned forward about 30 degrees, chest up, shoulders pulled down away from the ears.","exn":"Inhale and lower until the upper arms are parallel to the floor. Press up and exhale. Remember: lower assistance weight means you are getting stronger.","cm":"Bouncing off the pad for momentum. Letting the torso drift upright and shifting the work to the triceps."},{"id":"high-to-low-cable-crossover","n":"High-to-low cable crossover","eq":"cable","lt":"weighted","p":["chest/lower"],"s":["shoulders/front-delt"],"su":"Both pulleys at the highest setting. A handle in each hand, step forward into a split stance.","po":"Chest up, shoulders back and down, slight forward lean from the hips, core braced.","exn":"Fixed slight elbow bend. Inhale, sweep the hands down and together in front of the hips, exhaling. Squeeze a beat, return slowly to a stretch.","cm":"Bending the elbows into a pressdown, which makes it a triceps move. Standing too upright so the arc gets flat."},{"id":"decline-machine-press","n":"Decline machine press","eq":"machine","lt":"weighted","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Set the seat so the handles sit level with your lower chest. Feet flat.","po":"Back flat against the pad, shoulder blades back, chest up.","exn":"Inhale, press the handles forward and slightly down until nearly straight. Exhale on the press, return over 2 seconds.","cm":"Seat too high, which turns it into a flat press. Locking the elbows hard at the end."},{"id":"hands-elevated-push-up","n":"Hands-elevated push-up","eq":"bodyweight","lt":"bodyweight","p":["chest/lower"],"s":["triceps/triceps","shoulders/front-delt"],"su":"Hands on a bench or box roughly 30 to 60cm high, just wider than the shoulders. Feet on the floor, legs straight.","po":"Straight line from head to heels, core braced, glutes squeezed.","exn":"Inhale and lower until the chest is just off the bench edge, elbows at 45 degrees. Press up and exhale.","cm":"Letting the hips pike up because the movement is easier. Choosing a surface that slides or tips."},{"id":"decline-dumbbell-fly","n":"Decline dumbbell fly","eq":"dumbbell","lt":"weighted","p":["chest/lower"],"s":["shoulders/front-delt"],"su":"Decline bench at 15 to 30 degrees, legs hooked. Dumbbells pressed above the lower chest, palms facing.","po":"Shoulder blades retracted, chest up, head supported.","exn":"Fixed 10 to 15 degree elbow bend. Inhale and open the arms wide to a chest stretch. Exhale and hug back up over the lower chest.","cm":"Going too heavy on a movement with a long lever. Dropping the arms far past bench level."},{"id":"decline-smith-machine-press","n":"Decline smith machine press","eq":"machine","lt":"weighted","p":["chest/lower"],"s":["triceps/triceps"],"su":"Decline bench at 15 to 30 degrees under the bar, lined up so the fixed path meets the lower chest. Legs secured.","po":"Shoulder blades pinched, chest up, head supported.","exn":"Unrack with a wrist twist. Inhale and lower to the lower chest over 2 seconds, elbows at 45 degrees. Press and exhale.","cm":"Misaligning the bench so the fixed path lands on the ribs or throat. Rushing to sit up at the end of the set."},{"id":"pull-up","n":"Pull-up","eq":"bodyweight","lt":"bodyweight","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms","shoulders/rear-delt"],"su":"Overhand grip on a fixed bar, hands roughly 1.5x shoulder width. Hang with arms straight, ankles crossed behind.","po":"Chest up and proud, shoulders pulled down away from the ears before the first inch of movement. Ribs down, core braced so the legs don't swing.","exn":"Exhale and drive the elbows down and back until the chin clears the bar. Lower over 2 to 3 seconds to a full hang, inhaling.","cm":"Kipping and swinging for momentum. Stopping halfway down instead of reaching a full hang. Shrugging into the ears at the bottom."},{"id":"chin-up","n":"Chin-up","eq":"bodyweight","lt":"bodyweight","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms"],"su":"Underhand grip on a fixed bar, hands about shoulder width. Hang with arms straight, ankles crossed.","po":"Chest up, shoulders pulled down away from the ears, ribs down, core braced.","exn":"Exhale and pull the elbows down toward the ribs until the chin clears the bar. Lower over 2 to 3 seconds to a full hang, inhaling.","cm":"Swinging the legs to generate momentum. Cutting the bottom short. Letting the elbows drift far forward, which turns it into a curl."},{"id":"assisted-pull-up-machine","n":"Assisted pull-up machine","eq":"machine","lt":"assisted","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms"],"su":"Set the assistance weight, then kneel or stand on the pad and take an overhand grip 1.5x shoulder width.","po":"Chest up, shoulders pulled down away from the ears, core braced so the pad doesn't bounce.","exn":"Exhale and drive the elbows down and back until the chin clears the bar. Lower over 2 to 3 seconds. Less assistance weight means you are getting stronger.","cm":"Bouncing off the pad at the bottom. Using so much assistance that the back barely works."},{"id":"lat-pulldown","n":"Lat pulldown","eq":"cable","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms"],"su":"Set the thigh pad snug. Overhand grip roughly 1.5x shoulder width. Sit with arms straight overhead.","po":"Chest up, slight backward lean of about 15 degrees, shoulders down, core braced.","exn":"Exhale and pull the bar to the upper chest, driving the elbows down and back. Squeeze for a beat, return over 2 to 3 seconds, inhaling.","cm":"Leaning back 45 degrees and turning it into a row. Pulling the bar behind the neck, which stresses the shoulder. Yanking with the arms instead of the elbows."},{"id":"close-grip-lat-pulldown","n":"Close-grip lat pulldown","eq":"cable","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms"],"su":"Attach a V-handle or take a narrow neutral grip. Thigh pad snug, arms straight overhead.","po":"Chest up, slight 15 degree lean back, shoulders pulled down, core braced.","exn":"Exhale and pull the handle to the upper chest, elbows driving straight down along the ribs. Squeeze, return over 2 to 3 seconds.","cm":"Rocking the torso to move heavier weight. Stopping short of a full overhead stretch."},{"id":"wide-grip-lat-pulldown","n":"Wide-grip lat pulldown","eq":"cable","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","shoulders/rear-delt"],"su":"Overhand grip roughly 2x shoulder width. Thigh pad snug, arms straight overhead.","po":"Chest up, slight 15 degree lean back, shoulders down away from the ears.","exn":"Exhale and pull the bar to the collarbone, elbows flaring down and out. Squeeze, return over 2 to 3 seconds, inhaling.","cm":"Going so wide the range of motion collapses. Pulling behind the neck. Shrugging at the top of the return."},{"id":"straight-arm-pulldown","n":"Straight-arm pulldown","eq":"cable","lt":"weighted","p":["back/lats"],"s":["triceps/triceps","abs/upper"],"su":"Straight bar or rope on a high pulley. Stand a step back, arms straight out in front at shoulder height.","po":"Hinge forward about 15 degrees at the hips, chest up, core braced, knees softly bent.","exn":"Keep the elbows locked in a fixed slight bend. Exhale and sweep the bar down in an arc to the thighs. Squeeze the lats a beat, return slowly, inhaling.","cm":"Bending the elbows, which turns it into a triceps pushdown. Standing too upright so the arc is short."},{"id":"barbell-bent-over-row","n":"Barbell bent-over row","eq":"barbell","lt":"weighted","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt","back/lower","forearms/forearms"],"su":"Bar on the floor or in a rack. Overhand grip just wider than shoulder width, feet hip width.","po":"Hinge at the hips to about 45 degrees, back flat, chest up, ribs down, core braced hard. Knees softly bent.","exn":"Inhale and brace. Pull the bar to the lower ribs, elbows driving back at 45 degrees. Exhale at the top, lower over 2 seconds.","cm":"Rounding the lower back, which is the main injury risk here. Standing up as you pull. Using the legs to jerk the bar."},{"id":"pendlay-row","n":"Pendlay row","eq":"barbell","lt":"weighted","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt","back/lower"],"su":"Bar on the floor. Overhand grip just wider than shoulder width, torso roughly parallel to the floor.","po":"Flat back, chest up, core braced hard, hips higher than the knees.","exn":"Inhale and brace. Explosively pull the bar to the lower ribs. Exhale, then return it fully to the floor and reset before each rep.","cm":"Letting the torso rise as you pull, which defeats the point. Rounding the back to reach the floor between reps."},{"id":"single-arm-dumbbell-row","n":"Single-arm dumbbell row","eq":"dumbbell","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","shoulders/rear-delt","forearms/forearms"],"su":"One knee and one hand on a bench, opposite foot planted. Dumbbell hanging at arm's length.","po":"Back flat and roughly parallel to the floor, chest up, hips square, core braced.","exn":"Inhale, pull the dumbbell to the hip, elbow driving back close to the ribs. Exhale at the top, lower over 2 to 3 seconds to a full stretch.","cm":"Twisting the torso open to lift heavier. Yanking with the arm instead of leading with the elbow."},{"id":"seated-cable-row","n":"Seated cable row","eq":"cable","lt":"weighted","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt","forearms/forearms"],"su":"Feet on the platform, knees softly bent. Grab the handle and sit up tall with arms straight.","po":"Chest up, shoulders back and down, spine neutral, core braced. Torso stays upright throughout.","exn":"Exhale and pull the handle to the navel, elbows driving straight back along the ribs. Squeeze a beat, return over 2 to 3 seconds, inhaling to a stretch.","cm":"Rocking the torso back and forth to move weight. Rounding the back at the stretch. Shrugging the shoulders on the pull."},{"id":"t-bar-row","n":"T-bar row","eq":"barbell","lt":"weighted","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt","back/lower"],"su":"Straddle the bar, chest pad set if the machine has one. Take a neutral grip on the handles.","po":"Hinge to about 45 degrees, back flat, chest up, core braced, knees softly bent.","exn":"Inhale and brace. Pull the handles to the lower ribs, elbows back at 45 degrees. Exhale at the top, lower over 2 seconds to a full stretch.","cm":"Jerking upright with the hips on every rep. Rounding the lower back under a heavy load."},{"id":"chest-supported-machine-row","n":"Chest-supported machine row","eq":"machine","lt":"weighted","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt"],"su":"Set the chest pad so the handles reach comfortably with arms straight. Feet flat.","po":"Chest pressed into the pad, shoulders back and down, core lightly braced.","exn":"Exhale and pull the handles back, elbows driving toward the hips. Squeeze a beat, return over 2 to 3 seconds, inhaling.","cm":"Pushing the chest off the pad to gain leverage. Shrugging at the top of the pull."},{"id":"inverted-row","n":"Inverted row","eq":"bodyweight","lt":"bodyweight","p":["back/lats","back/upper"],"s":["biceps/biceps","shoulders/rear-delt","abs/upper"],"su":"Bar in a rack at roughly hip height. Hang underneath with an overhand grip 1.5x shoulder width, heels on the floor.","po":"Straight line from head to heels, glutes squeezed, core braced, chest up.","exn":"Exhale and pull the chest to the bar, elbows driving back at 45 degrees. Lower over 2 to 3 seconds, inhaling. Lower the bar to make it harder.","cm":"Hips sagging toward the floor. Only pulling halfway up. Craning the neck to touch the bar first."},{"id":"dumbbell-pullover","n":"Dumbbell pullover","eq":"dumbbell","lt":"weighted","p":["back/lats"],"s":["chest/mid","triceps/triceps"],"su":"Lie flat on a bench, or across it with the upper back supported. Hold one dumbbell over the chest with both palms under the top plate.","po":"Ribs down, core braced, feet planted. Hips stay level with the bench.","exn":"Fixed slight elbow bend. Inhale and lower the dumbbell in an arc behind the head until you feel a lat and ribcage stretch. Exhale and pull it back over the chest.","cm":"Letting the hips drop to chase more range. Bending the elbows heavily, which turns it into a triceps move."},{"id":"kettlebell-row","n":"Kettlebell row","eq":"kettlebell","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","forearms/forearms"],"su":"One knee and one hand on a bench, opposite foot planted. Kettlebell hanging at arm's length.","po":"Back flat and roughly parallel to the floor, chest up, hips square, core braced.","exn":"Inhale, pull the bell to the hip with the elbow tight to the ribs. Exhale at the top, lower over 2 to 3 seconds to a full stretch.","cm":"Rotating the torso to help the lift. Letting the wrist bend under the bell."},{"id":"resistance-band-lat-pulldown","n":"Resistance band lat pulldown","eq":"bands","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper"],"su":"Anchor the band overhead. Kneel or sit facing the anchor, a handle in each hand, arms straight up.","po":"Chest up, shoulders down, slight 15 degree lean back, core braced.","exn":"Exhale and pull the handles down to shoulder level, elbows driving down and back. Squeeze a beat, return over 2 to 3 seconds against the band.","cm":"Letting the band snap the arms back up. Kneeling too far from the anchor so there is no stretch at the top."},{"id":"meadows-row","n":"Meadows row","eq":"barbell","lt":"weighted","p":["back/lats"],"s":["biceps/biceps","back/upper","shoulders/rear-delt"],"su":"One end of a barbell in a landmine sleeve or corner. Stand side-on, stagger the stance, and grip the free end overhand.","po":"Hinge at the hips with a flat back, chest up, free hand braced on the knee, core tight.","exn":"Inhale, pull the bar up toward the hip with the elbow high and back. Exhale at the top, lower over 2 to 3 seconds to a full stretch.","cm":"Twisting the torso to add reach. Rounding the back under a heavy loaded end."},{"id":"machine-pullover","n":"Machine pullover","eq":"machine","lt":"weighted","p":["back/lats"],"s":["triceps/triceps"],"su":"Set the seat so the shoulders line up with the machine's pivot. Secure the lap belt if there is one.","po":"Back flat against the pad, chest up, core braced.","exn":"Inhale at the top stretch. Pull the handles down in an arc toward the thighs, exhaling. Squeeze the lats a beat, return over 2 to 3 seconds.","cm":"Cutting the top stretch short. Pushing with the arms instead of driving from the lats."},{"id":"barbell-shrug","n":"Barbell shrug","eq":"barbell","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"Bar held in front of the thighs, overhand grip just wider than the hips. Feet hip width.","po":"Stand tall, chest up, shoulders back, arms completely straight, core braced. Chin tucked slightly.","exn":"Exhale and lift the shoulders straight up toward the ears as high as possible. Hold one second at the top, lower over 2 seconds, inhaling.","cm":"Rolling the shoulders in circles, which does nothing extra and grinds the joint. Bending the elbows. Bouncing at the bottom."},{"id":"dumbbell-shrug","n":"Dumbbell shrug","eq":"dumbbell","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"A dumbbell in each hand at your sides, palms facing in. Feet hip width.","po":"Stand tall, chest up, arms straight, core braced, chin slightly tucked.","exn":"Exhale and lift the shoulders straight up toward the ears. Hold one second, lower over 2 seconds, inhaling.","cm":"Rolling the shoulders. Leaning forward or back to add momentum."},{"id":"machine-shrug","n":"Machine shrug","eq":"machine","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"Set the handles so you can stand tall with arms straight. Feet flat and shoulder width.","po":"Stand tall, chest up, arms straight, core braced.","exn":"Exhale and shrug the shoulders straight up. Hold one second, lower over 2 seconds under control, inhaling.","cm":"Bending the knees to bounce the weight up. Cutting the range short at the top."},{"id":"cable-shrug","n":"Cable shrug","eq":"cable","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"Straight bar on a low pulley, overhand grip. Step back until the cable is taut. Feet hip width.","po":"Stand tall, chest up, arms straight, core braced, slight backward lean to counter the cable.","exn":"Exhale and shrug straight up. Hold one second, lower over 2 seconds against the cable, inhaling.","cm":"Leaning too far back and turning it into an upright row. Letting the cable drag the shoulders down fast."},{"id":"trap-bar-shrug","n":"Trap bar shrug","eq":"barbell","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"Stand inside a trap bar, grip the neutral handles, and stand up to a tall position.","po":"Chest up, shoulders back, arms straight, core braced. The neutral grip keeps the load beside you.","exn":"Exhale and shrug straight up. Hold one second, lower over 2 seconds, inhaling.","cm":"Bending the elbows. Using leg drive to bounce the bar."},{"id":"kettlebell-shrug","n":"Kettlebell shrug","eq":"kettlebell","lt":"weighted","p":["back/upper"],"s":["forearms/forearms"],"su":"A kettlebell in each hand at your sides, arms straight. Feet hip width.","po":"Stand tall, chest up, core braced, wrists straight.","exn":"Exhale and shrug the shoulders straight up. Hold one second, lower over 2 seconds, inhaling.","cm":"Rolling the shoulders. Letting the bells swing forward and back."},{"id":"face-pull","n":"Face pull","eq":"cable","lt":"weighted","p":["back/upper","shoulders/rear-delt"],"s":["biceps/biceps"],"su":"Rope attachment on a pulley set just above head height. Grip both rope ends with thumbs pointing back. Step back until taut.","po":"Split stance, chest up, core braced, slight lean back. Shoulders down away from the ears.","exn":"Exhale and pull the rope toward your forehead, splitting the hands wide and driving the elbows high and back. Squeeze a beat, return over 2 seconds, inhaling.","cm":"Setting the pulley too low, which turns it into a row. Letting the elbows drop below shoulder height. Using so much weight the torso rocks."},{"id":"barbell-upright-row","n":"Barbell upright row","eq":"barbell","lt":"weighted","p":["back/upper","shoulders/side-delt"],"s":["biceps/biceps","forearms/forearms"],"su":"Bar in front of the thighs, overhand grip at roughly shoulder width. Wider is kinder to the shoulders than narrow.","po":"Stand tall, chest up, core braced, shoulders back.","exn":"Exhale and pull the bar up along the body, leading with the elbows, stopping when the upper arms reach shoulder height. Lower over 2 seconds, inhaling.","cm":"Pulling above shoulder height with a narrow grip, which pinches the shoulder. Leaning back to heave the bar. Stop the movement if it pinches."},{"id":"dumbbell-upright-row","n":"Dumbbell upright row","eq":"dumbbell","lt":"weighted","p":["back/upper","shoulders/side-delt"],"s":["biceps/biceps","forearms/forearms"],"su":"A dumbbell in each hand in front of the thighs, palms facing the body. Feet hip width.","po":"Stand tall, chest up, core braced, shoulders back and down.","exn":"Exhale and pull the dumbbells up along the body, elbows leading, stopping at shoulder height. Lower over 2 seconds, inhaling.","cm":"Going above shoulder height. Swinging the torso. Letting the wrists bend sharply at the top."},{"id":"cable-upright-row","n":"Cable upright row","eq":"cable","lt":"weighted","p":["back/upper","shoulders/side-delt"],"s":["biceps/biceps"],"su":"Straight bar on a low pulley, overhand grip at shoulder width. Stand close so the cable runs vertically.","po":"Stand tall, chest up, core braced, shoulders back.","exn":"Exhale and pull the bar up along the body, elbows leading, stopping at shoulder height. Lower over 2 seconds, inhaling.","cm":"Standing too far from the pulley so the cable pulls forward. Shrugging hard at the top."},{"id":"chest-supported-dumbbell-row","n":"Chest-supported dumbbell row","eq":"dumbbell","lt":"weighted","p":["back/upper"],"s":["back/lats","biceps/biceps","shoulders/rear-delt"],"su":"Incline bench at 30 to 45 degrees. Lie chest-down with a dumbbell in each hand hanging straight down.","po":"Chest pressed into the pad, head neutral, shoulders down, core lightly braced.","exn":"Exhale and row both dumbbells toward the hips, elbows driving back and close. Squeeze a beat, lower over 2 to 3 seconds, inhaling.","cm":"Lifting the chest off the pad. Flaring the elbows straight out, which shifts work to the rear delts only."},{"id":"seal-row","n":"Seal row","eq":"barbell","lt":"weighted","p":["back/upper"],"s":["back/lats","biceps/biceps","shoulders/rear-delt"],"su":"Lie chest-down on a bench raised high enough that the bar clears the floor. Grip the bar with arms hanging straight.","po":"Chest and hips on the bench throughout, head neutral, core lightly braced.","exn":"Exhale and row the bar to the lower ribs, elbows driving back. Squeeze a beat, lower over 2 to 3 seconds to a full stretch, inhaling.","cm":"Lifting the chest off the bench to cheat, which is the whole reason this variation exists. Bouncing the bar off the floor."},{"id":"prone-y-raise","n":"Prone Y-raise","eq":"dumbbell","lt":"weighted","p":["back/upper"],"s":["shoulders/rear-delt"],"su":"Incline bench at 30 degrees. Lie chest-down holding light dumbbells, arms hanging straight down.","po":"Chest on the pad, head neutral, shoulders pulled down away from the ears.","exn":"Thumbs up. Exhale and raise both arms out and up into a Y shape until level with the ears. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Going too heavy, which turns it into a shrug. Shrugging the shoulders up instead of keeping them down."},{"id":"farmer-s-carry","n":"Farmer's carry","eq":"dumbbell","lt":"timed","p":["back/upper","forearms/forearms"],"s":["abs/upper","obliques/obliques"],"su":"A heavy dumbbell in each hand at your sides, palms facing in. Stand tall before moving.","po":"Chest up, shoulders back and down, ribs stacked over the hips, core braced hard. Head neutral, eyes forward.","exn":"Walk at a steady controlled pace for the set duration. Breathe in a shallow rhythm rather than holding your breath. Set the weights down deliberately.","cm":"Leaning back or to one side. Shrugging the shoulders up. Holding the breath for the whole carry."},{"id":"band-pull-apart","n":"Band pull-apart","eq":"bands","lt":"weighted","p":["back/upper","shoulders/rear-delt"],"s":[],"su":"Hold a light band with both hands, arms straight out in front at shoulder height, hands shoulder width.","po":"Stand tall, chest up, ribs down, shoulders back and down, core braced.","exn":"Exhale and pull the band apart until the arms are out to the sides, squeezing the shoulder blades together. Hold one second, return over 2 seconds, inhaling.","cm":"Bending the elbows. Letting the band snap back. Using a band so heavy the shoulders shrug up."},{"id":"back-extension","n":"Back extension","eq":"bodyweight","lt":"bodyweight","p":["back/lower"],"s":["glutes/glutes","hamstrings/hamstrings"],"su":"Set the hip pad just below the hip bones so the hips can hinge freely. Ankles secured, feet on the platform.","po":"Spine neutral from head to tail, chest up, core braced, arms crossed on the chest.","exn":"Inhale and lower by hinging at the hips until you feel a hamstring stretch, roughly 60 to 90 degrees. Exhale and rise until the body is straight.","cm":"Hyperextending past a straight line at the top, which compresses the lower back. Rounding the spine on the way down instead of hinging."},{"id":"machine-back-extension","n":"Machine back extension","eq":"machine","lt":"bodyweight","p":["back/lower"],"s":["glutes/glutes","hamstrings/hamstrings"],"su":"Set the seat and pad so the pad sits across the upper back and the pivot lines up with your hips.","po":"Chest up, spine neutral, core braced, feet flat.","exn":"Inhale, then push back against the pad to a straight torso, exhaling. Pause one second, return over 2 to 3 seconds under control.","cm":"Slamming back into full extension. Letting the weight stack drop and yank you forward."},{"id":"conventional-deadlift","n":"Conventional deadlift","eq":"barbell","lt":"weighted","p":["back/lower","hamstrings/hamstrings","glutes/glutes"],"s":["back/upper","back/lats","quads/quads","forearms/forearms"],"su":"Bar over mid-foot, roughly 2cm from the shins. Feet hip width. Hinge and grip just outside the legs.","po":"Chest up, flat back, shoulders slightly ahead of the bar, hips higher than the knees, lats squeezed as if holding paper under the armpits. Core braced hard.","exn":"Inhale and brace. Push the floor away with the legs, keeping the bar dragging up the shins. Stand tall, exhale at the top. Hinge back down under control.","cm":"Rounding the lower back, which is the main injury risk. Letting the hips shoot up first so it becomes a stiff-leg pull. Leaning back at the top."},{"id":"trap-bar-deadlift","n":"Trap bar deadlift","eq":"barbell","lt":"weighted","p":["back/lower","quads/quads","glutes/glutes"],"s":["hamstrings/hamstrings","back/upper","forearms/forearms"],"su":"Stand inside the trap bar, feet hip width, centred between the handles. Hinge and take the neutral grip.","po":"Chest up, flat back, hips slightly higher than the knees, shoulders down, core braced hard.","exn":"Inhale and brace. Push the floor away and stand tall, exhaling at the top. Hinge back down under control, touching the plates lightly.","cm":"Standing too far forward or back inside the frame. Rounding the back. Jerking the bar off the floor."},{"id":"barbell-good-morning","n":"Barbell good morning","eq":"barbell","lt":"weighted","p":["back/lower","hamstrings/hamstrings"],"s":["glutes/glutes"],"su":"Bar racked across the upper back as in a squat. Feet hip to shoulder width. Start light, this one punishes ego.","po":"Chest up, flat back, core braced hard, knees softly bent and held there.","exn":"Inhale and brace. Hinge at the hips, pushing them straight back, until the torso reaches roughly 45 to 70 degrees or the hamstrings stop you. Exhale as you drive the hips forward to stand.","cm":"Bending the knees more as you descend, which turns it into a squat. Rounding the back. Going far heavier than the hamstrings can control."},{"id":"rack-pull","n":"Rack pull","eq":"barbell","lt":"weighted","p":["back/lower","back/upper"],"s":["back/lats","glutes/glutes","forearms/forearms"],"su":"Bar set on rack pins at roughly knee height. Feet hip width, grip just outside the legs.","po":"Chest up, flat back, shoulders over or slightly behind the bar, lats engaged, core braced hard.","exn":"Inhale and brace. Drive the hips forward and stand tall, exhaling at the top. Lower under control back to the pins and let it settle before the next rep.","cm":"Loading far more than you can control because the range is short. Yanking off the pins. Leaning back at lockout."},{"id":"reverse-hyperextension","n":"Reverse hyperextension","eq":"machine","lt":"bodyweight","p":["back/lower"],"s":["glutes/glutes","hamstrings/hamstrings"],"su":"Lie chest-down on the machine, hips at the edge of the pad, ankles behind the roller. Grip the handles.","po":"Chest and ribs on the pad, core braced, spine neutral, head in line with the torso.","exn":"Inhale at the bottom. Exhale and raise the legs until they are level with the torso, squeezing the glutes. Lower over 2 to 3 seconds.","cm":"Swinging the legs and using momentum. Lifting past horizontal into lower-back hyperextension."},{"id":"superman","n":"Superman","eq":"bodyweight","lt":"bodyweight","p":["back/lower"],"s":["glutes/glutes"],"su":"Lie face down on the floor, arms extended overhead, legs straight, forehead resting down.","po":"Neck neutral, core lightly engaged, hips pressed into the floor.","exn":"Exhale and lift the arms, chest and legs a few inches off the floor at the same time. Hold for 2 seconds, lower slowly and inhale.","cm":"Cranking the neck up to look forward. Lifting so high the lower back pinches."},{"id":"bird-dog","n":"Bird dog","eq":"bodyweight","lt":"bodyweight","p":["back/lower"],"s":["glutes/glutes","abs/upper"],"su":"On all fours, hands under the shoulders and knees under the hips. Spine neutral.","po":"Flat back like a tabletop, core braced, hips level, neck in line with the spine.","exn":"Exhale and extend the right arm forward and the left leg back until both are level with the torso. Hold 2 seconds, return slowly, inhale, then switch sides.","cm":"Letting the hips rotate open as the leg lifts. Lifting the limbs above shoulder or hip height and arching the lower back."},{"id":"barbell-overhead-press","n":"Barbell overhead press","eq":"barbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps","back/upper","abs/upper"],"su":"Bar racked at upper-chest height. Grip just outside shoulder width, elbows slightly in front of the bar. Feet hip width.","po":"Stand tall, ribs down, glutes and core braced hard so the lower back doesn't arch. Chest up, chin tucked back out of the bar path.","exn":"Inhale and brace. Press the bar straight up past the face, then push the head slightly forward once it clears. Exhale at lockout with the bar over mid-foot. Lower to the collarbone over 2 seconds.","cm":"Leaning back into a standing incline press. Pressing around the face instead of tucking the chin. Letting the ribs flare and the lower back arch."},{"id":"seated-dumbbell-shoulder-press","n":"Seated dumbbell shoulder press","eq":"dumbbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps"],"su":"Upright bench with the back pad near vertical. Dumbbells at shoulder height, palms forward, elbows at about 45 degrees to the torso.","po":"Back against the pad, ribs down, core braced, feet flat and driving into the floor.","exn":"Inhale, press the dumbbells up and slightly together until the arms are nearly straight. Exhale at the top, lower over 2 seconds to ear height.","cm":"Clanging the dumbbells together at the top. Flaring the elbows straight out to 90 degrees. Arching the lower back off the pad."},{"id":"standing-dumbbell-shoulder-press","n":"Standing dumbbell shoulder press","eq":"dumbbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps","abs/upper"],"su":"Dumbbells at shoulder height, palms forward, elbows at about 45 degrees. Feet hip width.","po":"Stand tall, ribs down, glutes and core braced hard, chest up.","exn":"Inhale and brace. Press up and slightly together until the arms are nearly straight, exhaling. Lower over 2 seconds to ear height.","cm":"Using a leg dip to start the press, which makes it a push press. Leaning back as the set gets hard."},{"id":"machine-shoulder-press","n":"Machine shoulder press","eq":"machine","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps"],"su":"Set the seat so the handles sit at roughly shoulder or ear height. Feet flat.","po":"Back against the pad, ribs down, core braced, chest up.","exn":"Inhale, press the handles up until the arms are nearly straight without locking hard. Exhale on the press, lower over 2 to 3 seconds.","cm":"Seat set too low, which forces an awkward overhead angle. Slamming into lockout."},{"id":"smith-machine-shoulder-press","n":"Smith machine shoulder press","eq":"machine","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps"],"su":"Bench set upright under the bar so the fixed path runs just in front of the face. Grip just outside shoulder width.","po":"Back against the pad, ribs down, core braced, chin tucked out of the bar path.","exn":"Unrack with a wrist twist. Inhale, press straight up to nearly locked, exhaling. Lower to chin height over 2 seconds.","cm":"Placing the bench so the bar path scrapes the nose. Letting the fixed path do the stabilising while the core goes slack."},{"id":"arnold-press","n":"Arnold press","eq":"dumbbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps"],"su":"Seated upright. Start with dumbbells at chest height, palms facing you, elbows tucked in front.","po":"Back against the pad, ribs down, core braced, chest up.","exn":"Inhale. As you press up, rotate the palms outward so they face forward at the top. Exhale at lockout. Reverse the rotation on the way down over 2 to 3 seconds.","cm":"Rushing the rotation so it happens all at once at the top. Using heavy weight, which makes the rotation jerky and hard on the shoulder."},{"id":"push-press","n":"Push press","eq":"barbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt","triceps/triceps","quads/quads"],"su":"Bar racked on the front delts at collarbone height, grip just outside shoulder width. Feet hip width.","po":"Chest up, ribs down, core braced hard, weight through the mid-foot.","exn":"Inhale and brace. Dip the knees about 10cm, then drive explosively through the legs and press the bar overhead, exhaling at lockout. Lower to the shoulders under control.","cm":"Dipping too deep, which turns it into a squat. Letting the chest fall forward during the dip. Leaning back at lockout."},{"id":"dumbbell-front-raise","n":"Dumbbell front raise","eq":"dumbbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt"],"su":"A dumbbell in each hand in front of the thighs, palms facing the body. Feet hip width.","po":"Stand tall, chest up, ribs down, core braced, shoulders back and down.","exn":"Fixed slight elbow bend. Exhale and raise one or both arms forward to shoulder height, no higher. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Swinging the torso to throw the weight up. Going above shoulder height, where the traps take over."},{"id":"barbell-front-raise","n":"Barbell front raise","eq":"barbell","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt"],"su":"Bar held in front of the thighs, overhand grip at shoulder width. Feet hip width.","po":"Stand tall, chest up, ribs down, core braced hard, glutes squeezed.","exn":"Fixed slight elbow bend. Exhale and raise the bar forward to shoulder height. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Leaning back to counterbalance the bar. Using momentum from the hips."},{"id":"cable-front-raise","n":"Cable front raise","eq":"cable","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt"],"su":"Straight bar or single handle on a low pulley behind you. Step forward until the cable is taut.","po":"Stand tall, chest up, ribs down, core braced, slight forward lean to counter the cable.","exn":"Fixed slight elbow bend. Exhale and raise the handle forward to shoulder height. Hold one second, lower over 2 to 3 seconds against the cable.","cm":"Letting the cable drag the arm down fast. Rocking the torso to start each rep."},{"id":"plate-front-raise","n":"Plate front raise","eq":"other","lt":"weighted","p":["shoulders/front-delt"],"s":["shoulders/side-delt"],"su":"Hold a weight plate at the 3 and 9 o'clock positions with both hands, in front of the thighs.","po":"Stand tall, chest up, ribs down, core braced, shoulders back.","exn":"Fixed slight elbow bend. Exhale and raise the plate forward to shoulder height. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Raising above shoulder height. Leaning back as the plate gets further from the body."},{"id":"landmine-shoulder-press","n":"Landmine shoulder press","eq":"barbell","lt":"weighted","p":["shoulders/front-delt"],"s":["triceps/triceps","abs/upper"],"su":"One barbell end in a landmine sleeve or corner. Hold the free end at shoulder height, half-kneeling or standing.","po":"Chest up, ribs down, hips square, core braced hard. Torso stays vertical.","exn":"Inhale, press the bar up and forward along its natural arc until the arm is nearly straight, exhaling. Lower over 2 to 3 seconds.","cm":"Leaning back to help. Letting the hips rotate toward the pressing arm."},{"id":"pike-push-up","n":"Pike push-up","eq":"bodyweight","lt":"bodyweight","p":["shoulders/front-delt"],"s":["triceps/triceps","shoulders/side-delt"],"su":"Hands flat on the floor slightly wider than the shoulders, feet walked in so the hips are high and the body forms an inverted V.","po":"Hips high, back flat, core braced, head between the arms and neck neutral.","exn":"Inhale and lower until the crown of the head is just off the floor, elbows at 45 degrees. Press up and exhale.","cm":"Letting the hips drop so it becomes a regular push-up. Banging the head on the floor. Flaring the elbows straight out."},{"id":"kettlebell-overhead-press","n":"Kettlebell overhead press","eq":"kettlebell","lt":"weighted","p":["shoulders/front-delt"],"s":["triceps/triceps","abs/upper"],"su":"Clean one kettlebell to the rack position at the shoulder, bell resting on the back of the forearm, elbow tucked.","po":"Stand tall, ribs down, glutes and core braced, wrist straight and stacked over the elbow.","exn":"Inhale and brace. Press the bell up, letting the palm rotate to face forward at lockout, exhaling. Lower over 2 to 3 seconds to the rack.","cm":"Letting the wrist bend back under the bell. Leaning away from the working side."},{"id":"band-overhead-press","n":"Band overhead press","eq":"bands","lt":"weighted","p":["shoulders/front-delt"],"s":["triceps/triceps"],"su":"Stand on the middle of the band, a handle in each hand at shoulder height, palms forward.","po":"Stand tall, ribs down, core and glutes braced, chest up.","exn":"Inhale, press up until the arms are nearly straight, exhaling at the top where band tension peaks. Lower over 2 to 3 seconds against the band.","cm":"Letting the band snap the arms down. Arching the lower back as tension increases near lockout."},{"id":"dumbbell-lateral-raise","n":"Dumbbell lateral raise","eq":"dumbbell","lt":"weighted","p":["shoulders/side-delt"],"s":["back/upper"],"su":"A light dumbbell in each hand at your sides, palms facing in. Feet hip width.","po":"Stand tall, chest up, ribs down, shoulders pulled down away from the ears, core braced.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to the sides to shoulder height, leading with the elbows. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Swinging the torso to heave the weights up. Going above shoulder height, which hands the work to the traps. Shrugging as you lift."},{"id":"seated-dumbbell-lateral-raise","n":"Seated dumbbell lateral raise","eq":"dumbbell","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"Sit on the end of a bench, feet flat, a dumbbell in each hand at your sides.","po":"Sit tall, chest up, shoulders down away from the ears, core braced. Seated position removes the option to swing.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to shoulder height. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Leaning the torso back to cheat. Shrugging at the top."},{"id":"cable-lateral-raise","n":"Cable lateral raise","eq":"cable","lt":"weighted","p":["shoulders/side-delt"],"s":["back/upper"],"su":"Single handle on the lowest pulley. Stand side-on, take the handle in the far hand across the body.","po":"Stand tall, chest up, shoulders down, core braced, free hand on the frame for balance.","exn":"Fixed slight elbow bend. Exhale and raise the arm out to shoulder height. Hold one second, lower over 2 to 3 seconds against the cable.","cm":"Letting the cable pull the arm down fast. Leaning away from the machine to gain leverage."},{"id":"leaning-cable-lateral-raise","n":"Leaning cable lateral raise","eq":"cable","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"Grip the machine upright with one hand and lean away so the body tilts about 20 degrees. Handle from the low pulley in the far hand.","po":"Body in a straight line from the anchoring hand to the feet, core braced, shoulder pulled down.","exn":"Fixed slight elbow bend. Exhale and raise the arm out to shoulder height. Hold one second, lower over 2 to 3 seconds.","cm":"Swinging the whole body in and out from the upright. Shrugging at the top of the raise."},{"id":"machine-lateral-raise","n":"Machine lateral raise","eq":"machine","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"Set the seat so the shoulder joints line up with the machine's pivot points. Arms against the pads.","po":"Sit tall, back against the pad, chest up, shoulders down away from the ears.","exn":"Exhale and press the pads out and up to shoulder height, leading with the elbows. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Seat set too high or low so the pivot misses the shoulder. Shrugging into the pads."},{"id":"band-lateral-raise","n":"Band lateral raise","eq":"bands","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"Stand on the middle of a light band, a handle in each hand at your sides.","po":"Stand tall, chest up, shoulders down, core braced.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to shoulder height where tension peaks. Hold one second, lower over 2 to 3 seconds.","cm":"Using a band so heavy the last few degrees force a shrug. Letting the band snap the arms down."},{"id":"kettlebell-lateral-raise","n":"Kettlebell lateral raise","eq":"kettlebell","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"A light kettlebell in each hand at your sides, bells hanging below the handles.","po":"Stand tall, chest up, shoulders down, core braced, wrists straight.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to shoulder height. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Letting the bells swing forward. Going heavier than the offset load allows and shrugging."},{"id":"plate-lateral-raise","n":"Plate lateral raise","eq":"other","lt":"weighted","p":["shoulders/side-delt"],"s":[],"su":"A light plate in each hand held by the rim, arms at your sides.","po":"Stand tall, chest up, shoulders down away from the ears, core braced.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to shoulder height. Hold one second, lower over 2 to 3 seconds.","cm":"Gripping so hard the forearms fatigue first. Raising above shoulder height."},{"id":"lu-raise","n":"Lu raise","eq":"dumbbell","lt":"weighted","p":["shoulders/side-delt"],"s":["back/upper","shoulders/front-delt"],"su":"Very light dumbbells at your sides, palms facing in. Feet hip width. Start lighter than you think.","po":"Stand tall, chest up, ribs down, core braced hard, shoulders down.","exn":"Exhale and sweep the arms out and all the way overhead until the dumbbells nearly touch above the head. Lower over 3 seconds along the same path, inhaling.","cm":"Using anything but very light weight. Arching the lower back as the arms pass overhead. Rushing the lowering phase."},{"id":"cable-y-raise","n":"Cable Y-raise","eq":"cable","lt":"weighted","p":["shoulders/side-delt"],"s":["shoulders/front-delt","back/upper"],"su":"Two low pulleys, handles crossed so the left hand takes the right cable and vice versa. Step back until taut.","po":"Stand tall, chest up, ribs down, core braced, shoulders pulled down.","exn":"Thumbs up. Exhale and sweep both arms out and up into a Y at about 45 degrees above the shoulders. Hold one second, lower over 2 to 3 seconds.","cm":"Shrugging the shoulders up into the ears. Using enough weight that the torso leans back."},{"id":"barbell-overhead-carry","n":"Barbell overhead carry","eq":"barbell","lt":"timed","p":["shoulders/side-delt"],"s":["abs/upper","back/upper"],"su":"Press a light barbell overhead with a grip just outside shoulder width. Lock the arms before you move.","po":"Arms locked straight with the bar over mid-foot, ribs down, glutes and core braced hard, chest up, eyes forward.","exn":"Walk at a slow controlled pace for the set duration, breathing shallow and steady. Lower the bar carefully to the rack or shoulders at the end.","cm":"Letting the ribs flare and the bar drift behind the head. Holding the breath. Starting heavier than you can control overhead."},{"id":"bent-over-dumbbell-reverse-fly","n":"Bent-over dumbbell reverse fly","eq":"dumbbell","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"A light dumbbell in each hand. Hinge at the hips until the torso is roughly parallel to the floor, arms hanging straight down.","po":"Flat back, chest up, core braced, knees softly bent, head in line with the spine.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to the sides until level with the torso, squeezing the shoulder blades. Lower over 2 to 3 seconds, inhaling.","cm":"Standing up as you raise. Using heavy weight so the movement becomes a row. Rounding the lower back."},{"id":"chest-supported-dumbbell-reverse-fly","n":"Chest-supported dumbbell reverse fly","eq":"dumbbell","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Incline bench at 30 to 45 degrees. Lie chest-down with light dumbbells hanging straight down.","po":"Chest on the pad, head neutral, shoulders pulled down away from the ears.","exn":"Fixed slight elbow bend. Exhale and raise the arms out to the sides to shoulder level. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Lifting the chest off the pad. Bending the elbows and rowing instead of flying."},{"id":"reverse-pec-deck","n":"Reverse pec deck","eq":"machine","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Turn to face the pec deck's back pad. Set the handles so the arms start straight out in front at shoulder height.","po":"Chest against the pad, sit tall, shoulders down away from the ears, core lightly braced.","exn":"Fixed slight elbow bend. Exhale and sweep the handles out and back until level with the torso. Squeeze one second, return over 2 to 3 seconds.","cm":"Setting the start too far back, which overstretches the shoulder. Shrugging during the squeeze."},{"id":"machine-rear-delt-fly","n":"Machine rear delt fly","eq":"machine","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Set the seat so the handles sit at shoulder height with the chest against the pad.","po":"Chest on the pad, sit tall, shoulders pulled down, core lightly braced.","exn":"Exhale and drive the handles back in a wide arc until level with the torso. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Pushing the chest off the pad for leverage. Bending the elbows into a row."},{"id":"cable-reverse-fly","n":"Cable reverse fly","eq":"cable","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Two pulleys at shoulder height, cables crossed so each hand takes the opposite cable. Step back until taut.","po":"Stand tall or hinge slightly, chest up, shoulders down, core braced, split stance for stability.","exn":"Fixed slight elbow bend. Exhale and sweep the arms out and back in a wide arc. Squeeze one second, return over 2 to 3 seconds.","cm":"Letting the cables pull the arms forward fast. Bending the elbows and turning it into a row."},{"id":"reverse-cable-crossover","n":"Reverse cable crossover","eq":"cable","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Two pulleys at shoulder height, handles crossed in front. Step back until there is tension, feet in a split stance.","po":"Chest up, shoulders down away from the ears, core braced, torso still.","exn":"Fixed slight elbow bend. Exhale and pull the arms apart and back until level with the torso. Squeeze one second, return over 2 to 3 seconds.","cm":"Twisting the torso to add range. Shrugging at the end of the pull."},{"id":"rear-delt-cable-row-to-neck","n":"Rear delt cable row to neck","eq":"cable","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper","biceps/biceps"],"su":"Rope on a pulley set at upper-chest height. Grip both ends, step back until taut, split stance.","po":"Chest up, shoulders down, core braced, slight lean back.","exn":"Exhale and pull the rope toward the neck with the elbows high and flared out to the sides. Squeeze one second, return over 2 to 3 seconds.","cm":"Dropping the elbows, which turns it into a normal row. Using enough weight that the torso rocks back."},{"id":"prone-incline-rear-delt-raise","n":"Prone incline rear delt raise","eq":"dumbbell","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Incline bench at 30 degrees. Lie chest-down with light dumbbells hanging straight down, palms facing back.","po":"Chest on the pad, head neutral, shoulders pulled down.","exn":"Fixed slight elbow bend. Exhale and raise the arms straight out to the sides to shoulder level. Hold one second, lower over 2 to 3 seconds.","cm":"Going heavy and swinging. Letting the arms drift back toward the hips instead of straight out."},{"id":"band-reverse-fly","n":"Band reverse fly","eq":"bands","lt":"weighted","p":["shoulders/rear-delt"],"s":["back/upper"],"su":"Hold a band with both hands, arms straight out in front at shoulder height, hands roughly shoulder width.","po":"Stand tall, chest up, ribs down, shoulders down, core braced.","exn":"Fixed slight elbow bend. Exhale and pull the arms out and back until wide, squeezing the shoulder blades. Hold one second, return over 2 seconds.","cm":"Bending the elbows. Letting the band snap back. Shrugging as the tension rises."},{"id":"kettlebell-high-pull","n":"Kettlebell high pull","eq":"kettlebell","lt":"weighted","p":["shoulders/rear-delt","back/upper"],"s":["biceps/biceps"],"su":
