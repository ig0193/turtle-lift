"One kettlebell on the floor between the feet, stance slightly wider than the hips. Hinge and grip the handle.","po":"Flat back, chest up, core braced, shoulders down.","exn":"Hinge and swing the bell back, then drive the hips forward explosively. As it rises, pull the elbow high and back to chest height, exhaling. Let it swing back down and inhale.","cm":"Pulling with the arm instead of driving from the hips. Letting the bell get ahead of the elbow. Rounding the back at the bottom of the swing."},{"id":"barbell-curl","n":"Barbell curl","eq":"barbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Bar held at arm's length in front of the thighs, underhand grip at shoulder width. Feet hip width.","po":"Stand tall, chest up, shoulders back and down, elbows pinned to the sides of the ribs, core braced.","exn":"Exhale and curl the bar up to chest height, keeping the elbows fixed in place. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Swinging the torso and using the lower back. Letting the elbows drift forward, which brings in the front delts. Dropping the bar fast."},{"id":"ez-bar-curl","n":"EZ-bar curl","eq":"barbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"EZ bar at arm's length, hands on the angled sections at shoulder width, palms up.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced. The angled grip is easier on the wrists.","exn":"Exhale and curl to chest height with the elbows fixed. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Rocking the torso. Elbows travelling forward at the top."},{"id":"dumbbell-curl","n":"Dumbbell curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"A dumbbell in each hand at arm's length, palms facing forward. Feet hip width.","po":"Stand tall, chest up, shoulders back, elbows pinned to the ribs, core braced.","exn":"Exhale and curl both dumbbells to shoulder height. Squeeze one second, lower over 2 to 3 seconds to full arm extension, inhaling.","cm":"Swinging the weights up. Stopping short of full extension at the bottom, which cuts the range."},{"id":"alternating-dumbbell-curl","n":"Alternating dumbbell curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"A dumbbell in each hand at arm's length, palms facing in. Feet hip width.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced, torso completely still.","exn":"Exhale and curl one dumbbell up, rotating the palm to face up as it rises. Squeeze one second, lower over 2 to 3 seconds, then switch.","cm":"Leaning side to side with each rep. Starting the next arm before the first has fully lowered."},{"id":"hammer-curl","n":"Hammer curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps","forearms/forearms"],"s":[],"su":"A dumbbell in each hand at arm's length, palms facing in toward the thighs. Feet hip width.","po":"Stand tall, chest up, elbows pinned to the ribs, wrists straight, core braced.","exn":"Keep the palms facing in throughout. Exhale and curl to shoulder height. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Letting the palms rotate up, which turns it into a normal curl. Swinging the torso."},{"id":"incline-dumbbell-curl","n":"Incline dumbbell curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Bench set to about 60 degrees. Sit back with a dumbbell in each hand, arms hanging straight down behind the torso line.","po":"Back against the pad, chest up, shoulders back, upper arms hanging still throughout.","exn":"Exhale and curl both dumbbells up without letting the elbows travel forward. Squeeze one second, lower over 2 to 3 seconds to a full stretch.","cm":"Letting the elbows swing forward, which removes the stretch that makes this variation useful. Lifting the shoulders off the pad."},{"id":"concentration-curl","n":"Concentration curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Sit on a bench, feet wide. Rest the back of the working upper arm against the inside of the same-side thigh, dumbbell hanging.","po":"Torso leaned forward with a flat back, chest up, upper arm locked against the thigh.","exn":"Exhale and curl the dumbbell up toward the opposite shoulder. Squeeze one second, lower over 2 to 3 seconds to full extension, inhaling.","cm":"Pushing with the leg to help the curl. Rounding the back over the working arm."},{"id":"spider-curl","n":"Spider curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Incline bench at about 45 degrees. Lie chest-down with arms hanging straight down over the top edge.","po":"Chest on the pad, head neutral, upper arms perpendicular to the floor and locked there.","exn":"Exhale and curl the weight up toward the shoulders. Squeeze one second, lower over 2 to 3 seconds to a full stretch, inhaling.","cm":"Lifting the chest off the pad. Letting the upper arms swing back on the descent."},{"id":"zottman-curl","n":"Zottman curl","eq":"dumbbell","lt":"weighted","p":["biceps/biceps","forearms/forearms"],"s":[],"su":"A dumbbell in each hand at arm's length, palms facing forward. Feet hip width.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced.","exn":"Exhale and curl up with palms up. At the top, rotate the palms to face down, then lower over 3 seconds in that overhand position. Rotate back at the bottom.","cm":"Rushing the overhand descent, which is the part that trains the forearms. Going too heavy to control the rotation."},{"id":"preacher-curl","n":"Preacher curl","eq":"barbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Set the preacher bench so the top of the pad sits under the armpits. EZ bar or barbell, underhand grip at shoulder width.","po":"Chest against the pad, shoulders down, upper arms flat on the pad throughout.","exn":"Exhale and curl the bar up to chest height. Squeeze one second, lower over 3 seconds until the arms are almost straight, inhaling.","cm":"Letting the arms snap straight at the bottom under load, which strains the elbow. Lifting the armpits off the pad."},{"id":"machine-preacher-curl","n":"Machine preacher curl","eq":"machine","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Set the seat so the upper arms rest flat on the pad with the elbows level with the pivot. Grip the handles.","po":"Chest against the pad, shoulders down, upper arms flat throughout.","exn":"Exhale and curl the handles up. Squeeze one second, lower over 3 seconds to nearly straight arms, inhaling.","cm":"Elbows misaligned with the pivot. Slamming the stack down at the bottom."},{"id":"cable-curl","n":"Cable curl","eq":"cable","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Straight or EZ bar on the lowest pulley. Stand a step back, arms hanging straight, underhand grip at shoulder width.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced, slight forward lean to counter the cable.","exn":"Exhale and curl the bar to chest height. Squeeze one second, lower over 2 to 3 seconds against constant cable tension.","cm":"Letting the cable drag the arms straight fast. Stepping so far back that the elbows get pulled behind the torso."},{"id":"cable-rope-hammer-curl","n":"Cable rope hammer curl","eq":"cable","lt":"weighted","p":["biceps/biceps","forearms/forearms"],"s":[],"su":"Rope on the lowest pulley. Stand a step back, a rope end in each hand, palms facing in.","po":"Stand tall, chest up, elbows pinned to the ribs, wrists straight, core braced.","exn":"Keep the palms facing each other throughout. Exhale and curl up to shoulder height, spreading the rope ends slightly at the top. Lower over 2 to 3 seconds.","cm":"Rotating the palms up. Letting the elbows drift forward as fatigue sets in."},{"id":"bayesian-cable-curl","n":"Bayesian cable curl","eq":"cable","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Single handle on the lowest pulley. Face away from the machine and step forward so the arm hangs behind the torso line.","po":"Stand tall in a split stance, chest up, upper arm fixed behind the body, core braced.","exn":"Exhale and curl the handle up without letting the elbow travel forward. Squeeze one second, lower over 3 seconds to a deep stretch, inhaling.","cm":"Letting the elbow swing forward, which removes the behind-the-body stretch. Standing too close so there is no tension at the bottom."},{"id":"drag-curl","n":"Drag curl","eq":"barbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Bar at arm's length in front of the thighs, underhand grip at shoulder width.","po":"Stand tall, chest up, shoulders back and down, core braced.","exn":"Drag the bar straight up the front of the body, letting the elbows travel backward rather than staying pinned. Exhale on the way up, lower over 2 to 3 seconds along the same path.","cm":"Letting the bar swing away from the body, which makes it a normal curl. Using heavy weight, since the range here is short."},{"id":"21s-barbell-curl","n":"21s barbell curl","eq":"barbell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Bar at arm's length, underhand grip at shoulder width. Feet hip width.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced.","exn":"Do 7 reps from the bottom to halfway, then 7 from halfway to the top, then 7 full-range reps. Exhale on each lift, breathe steadily throughout. Use lighter weight than a normal curl.","cm":"Using your usual curl weight and failing halfway through. Swinging the torso once the burn arrives."},{"id":"kettlebell-curl","n":"Kettlebell curl","eq":"kettlebell","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"A kettlebell in each hand at arm's length, palms forward, bells hanging below the handles.","po":"Stand tall, chest up, elbows pinned to the ribs, wrists straight, core braced.","exn":"Exhale and curl to shoulder height. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Letting the wrists bend back under the offset weight. Swinging the bells up."},{"id":"band-curl","n":"Band curl","eq":"bands","lt":"weighted","p":["biceps/biceps"],"s":["forearms/forearms"],"su":"Stand on the middle of the band, a handle in each hand at arm's length, palms forward.","po":"Stand tall, chest up, elbows pinned to the ribs, core braced.","exn":"Exhale and curl up to shoulder height where band tension peaks. Squeeze one second, lower over 2 to 3 seconds against the band.","cm":"Letting the band snap the arms straight. Leaning back as tension increases near the top."},{"id":"cable-pushdown-straight-bar","n":"Cable pushdown (straight bar)","eq":"cable","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Straight bar on a high pulley set at upper-chest height. Overhand grip at shoulder width. Step back half a pace.","po":"Stand tall with a slight 10 degree forward lean, chest up, elbows pinned to the sides of the ribs, core braced.","exn":"Exhale and push the bar down until the arms are straight, keeping the elbows fixed. Squeeze one second, return over 2 to 3 seconds until the forearms reach about 90 degrees.","cm":"Letting the elbows drift forward and away from the ribs. Leaning the whole bodyweight onto the bar. Shrugging the shoulders on the push."},{"id":"cable-rope-pushdown","n":"Cable rope pushdown","eq":"cable","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Rope on a high pulley at upper-chest height. Grip both ends with palms facing in. Step back half a pace.","po":"Stand tall with a slight forward lean, chest up, elbows pinned to the ribs, core braced.","exn":"Exhale and push down, spreading the rope ends apart at the bottom for an extra squeeze. Hold one second, return over 2 to 3 seconds.","cm":"Elbows flaring out and forward. Turning it into a shoulder push by leaning in."},{"id":"reverse-grip-cable-pushdown","n":"Reverse-grip cable pushdown","eq":"cable","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Straight bar on a high pulley, underhand grip at shoulder width. Step back half a pace.","po":"Stand tall, slight forward lean, elbows pinned to the ribs, wrists straight and firm, core braced.","exn":"Exhale and push the bar down to straight arms. Squeeze one second, return over 2 to 3 seconds. Use lighter weight than the overhand version.","cm":"Using overhand-grip weight and losing the wrists. Letting the elbows travel forward."},{"id":"overhead-cable-triceps-extension","n":"Overhead cable triceps extension","eq":"cable","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Rope on the lowest pulley. Face away from the machine, rope behind the head, elbows pointing forward and up.","po":"Split stance, chest up, ribs down, core braced hard so the lower back doesn't arch. Upper arms stay beside the ears.","exn":"Exhale and extend the arms overhead until straight, keeping the elbows in place. Squeeze one second, lower over 2 to 3 seconds to a deep stretch, inhaling.","cm":"Letting the elbows flare wide. Arching the lower back as the arms extend. Dropping the upper arms forward."},{"id":"cable-triceps-kickback","n":"Cable triceps kickback","eq":"cable","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Single handle on the lowest pulley. Hinge forward until the torso is roughly parallel to the floor, upper arm tucked against the ribs.","po":"Flat back, chest up, core braced, upper arm locked in place parallel to the floor.","exn":"Exhale and extend the forearm back until the arm is straight. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Letting the upper arm drop or swing. Standing up as you extend."},{"id":"ez-bar-skull-crusher","n":"EZ-bar skull crusher","eq":"barbell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Lie flat on a bench, EZ bar held over the chest with an overhand grip on the angled sections, arms straight.","po":"Shoulder blades on the bench, ribs down, core braced, upper arms angled slightly back so tension stays on the triceps.","exn":"Inhale and lower the bar toward the forehead or just behind the head by bending only at the elbows. Stop just short of contact, then extend and exhale.","cm":"Flaring the elbows wide, which strains them. Moving the upper arms instead of hinging only at the elbow. Going too heavy on a joint-sensitive move."},{"id":"close-grip-bench-press","n":"Close-grip bench press","eq":"barbell","lt":"weighted","p":["triceps/triceps"],"s":["chest/mid","shoulders/front-delt"],"su":"Flat bench, overhand grip at roughly shoulder width. Not narrower, which just hurts the wrists.","po":"Shoulder blades retracted, chest up, feet flat, elbows tucked to about 20 degrees from the torso.","exn":"Inhale and lower the bar to the lower chest with the elbows tucked close. Press up and exhale, driving through the triceps.","cm":"Gripping so narrow the wrists bend painfully. Flaring the elbows, which turns it back into a chest press."},{"id":"jm-press","n":"JM press","eq":"barbell","lt":"weighted","p":["triceps/triceps"],"s":["chest/mid"],"su":"Flat bench, barbell with an overhand grip at shoulder width, bar held over the chest.","po":"Shoulder blades retracted, chest up, feet flat, elbows tucked. Start very light, this is a technical lift.","exn":"Inhale and lower the bar toward the upper chest and throat by bending the elbows and letting the upper arms travel slightly back. Stop just above the collarbone, then press and exhale.","cm":"Treating it as a close-grip bench, which loses the point. Going heavy before the groove is learned, with the bar tracking near the throat."},{"id":"dumbbell-overhead-triceps-extension","n":"Dumbbell overhead triceps extension","eq":"dumbbell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Sit or stand holding one dumbbell with both hands, pressed overhead. Palms cupping the top plate.","po":"Chest up, ribs down, core braced hard, upper arms beside the ears and locked there.","exn":"Inhale and lower the dumbbell behind the head by bending only the elbows, until you feel a triceps stretch. Exhale and extend back up.","cm":"Letting the elbows flare wide. Arching the lower back to help. Moving the upper arms instead of hinging at the elbow."},{"id":"single-arm-dumbbell-overhead-extension","n":"Single-arm dumbbell overhead extension","eq":"dumbbell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Sit or stand with one dumbbell pressed overhead in one hand, palm facing forward.","po":"Chest up, ribs down, core braced, upper arm beside the ear. Free hand can support the working elbow.","exn":"Inhale and lower the dumbbell behind the head by bending the elbow. Exhale and extend back to straight over 2 seconds.","cm":"Letting the torso lean away from the working arm. Elbow drifting outward."},{"id":"lying-dumbbell-triceps-extension","n":"Lying dumbbell triceps extension","eq":"dumbbell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Lie flat on a bench with a dumbbell in each hand pressed above the chest, palms facing in.","po":"Shoulder blades on the bench, ribs down, core braced, upper arms angled slightly back.","exn":"Inhale and lower the dumbbells toward the ears by bending only the elbows. Exhale and extend back up over the chest.","cm":"Flaring the elbows out. Letting the upper arms swing back and turning it into a pullover."},{"id":"dumbbell-triceps-kickback","n":"Dumbbell triceps kickback","eq":"dumbbell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"One knee and hand on a bench, or hinged forward standing. Dumbbell in hand, upper arm tucked against the ribs and parallel to the floor.","po":"Flat back, chest up, core braced, upper arm locked in place.","exn":"Exhale and extend the forearm back until the arm is straight. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Swinging the dumbbell back with momentum. Letting the upper arm drop below parallel."},{"id":"machine-triceps-extension","n":"Machine triceps extension","eq":"machine","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Set the seat so the elbows line up with the machine's pivot and rest on the pad.","po":"Back against the pad, chest up, elbows fixed on the pad throughout, core lightly braced.","exn":"Exhale and extend the arms until straight. Squeeze one second, return over 2 to 3 seconds under control.","cm":"Elbows sliding off the pad. Slamming the stack down between reps."},{"id":"assisted-triceps-dip-machine","n":"Assisted triceps dip machine","eq":"machine","lt":"assisted","p":["triceps/triceps"],"s":["chest/lower","shoulders/front-delt"],"su":"Set the assistance weight, kneel or stand on the pad, hands on the parallel bars.","po":"Torso upright and vertical, chest up, shoulders down away from the ears, elbows tucked close to the ribs.","exn":"Inhale and lower until the upper arms are roughly parallel to the floor. Press up and exhale. Less assistance weight means you are getting stronger.","cm":"Leaning the torso forward, which shifts the work to the chest. Bouncing off the pad."},{"id":"bench-triceps-dip","n":"Bench triceps dip","eq":"bodyweight","lt":"bodyweight","p":["triceps/triceps"],"s":["shoulders/front-delt","chest/lower"],"su":"Sit on a bench, hands gripping the edge beside the hips. Slide the hips forward off the bench, legs out in front.","po":"Torso upright and close to the bench, chest up, shoulders pulled down away from the ears, elbows pointing straight back.","exn":"Inhale and lower until the elbows reach about 90 degrees. Press up and exhale. Stop if the front of the shoulder pinches.","cm":"Dropping far below 90 degrees, which strains the shoulder. Letting the hips drift away from the bench. Flaring the elbows out."},{"id":"parallel-bar-dip-upright","n":"Parallel bar dip (upright)","eq":"bodyweight","lt":"bodyweight","p":["triceps/triceps"],"s":["chest/lower","shoulders/front-delt"],"su":"Parallel bars, hands at your sides. Push up to a supported start with the arms straight.","po":"Torso vertical, chest up, shoulders pulled down away from the ears, elbows tucked close to the ribs, ankles crossed.","exn":"Inhale and lower until the upper arms are roughly parallel to the floor, keeping the torso upright. Press up and exhale.","cm":"Leaning forward, which turns it into a chest dip. Going deeper than shoulder comfort allows. Shrugging at the bottom."},{"id":"diamond-push-up","n":"Diamond push-up","eq":"bodyweight","lt":"bodyweight","p":["triceps/triceps"],"s":["chest/mid","shoulders/front-delt"],"su":"Hands flat on the floor under the chest, index fingers and thumbs touching to form a triangle.","po":"Straight line from head to heels, core braced, glutes squeezed, elbows tracking back close to the ribs.","exn":"Inhale and lower until the chest touches the hands. Press up and exhale.","cm":"Flaring the elbows straight out, which is hard on the wrists and elbows. Hips sagging as the movement gets tough."},{"id":"kettlebell-overhead-extension","n":"Kettlebell overhead extension","eq":"kettlebell","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Hold one kettlebell with both hands by the horns, pressed overhead, bell hanging behind the head.","po":"Chest up, ribs down, core braced hard, upper arms beside the ears, wrists straight.","exn":"Inhale and lower the bell behind the head by bending only the elbows. Exhale and extend back up over 2 seconds.","cm":"Letting the wrists bend back. Arching the lower back as the bell drops behind."},{"id":"band-triceps-pushdown","n":"Band triceps pushdown","eq":"bands","lt":"weighted","p":["triceps/triceps"],"s":[],"su":"Anchor a band overhead. Grip both ends, elbows pinned to the ribs, forearms at about 90 degrees.","po":"Stand tall, slight forward lean, chest up, elbows fixed at the sides, core braced.","exn":"Exhale and push down to straight arms where band tension peaks. Squeeze one second, return over 2 to 3 seconds against the band.","cm":"Letting the band pull the forearms up fast. Elbows drifting forward as tension increases."},{"id":"barbell-wrist-curl","n":"Barbell wrist curl","eq":"barbell","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Sit on a bench, forearms resting on the thighs, wrists just past the knees, palms up. Bar held loosely.","po":"Sit tall with a flat back, forearms flat and still on the thighs throughout.","exn":"Let the bar roll to the fingertips, then exhale and curl it up by closing the fingers and flexing the wrist. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Lifting the forearms off the thighs. Using so much weight the wrists can't complete the range."},{"id":"barbell-reverse-wrist-curl","n":"Barbell reverse wrist curl","eq":"barbell","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Sit on a bench, forearms on the thighs, wrists just past the knees, palms facing down. Bar held overhand.","po":"Sit tall with a flat back, forearms flat and still throughout.","exn":"Exhale and lift the back of the hands upward as far as they will go. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Going as heavy as the palms-up version, which the wrist extensors cannot handle. Lifting the forearms off the thighs."},{"id":"behind-the-back-barbell-wrist-curl","n":"Behind-the-back barbell wrist curl","eq":"barbell","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Stand with a barbell held behind the back at arm's length, palms facing back, grip at hip width.","po":"Stand tall, chest up, shoulders back and down, arms straight and still.","exn":"Let the bar roll to the fingertips, then exhale and curl it up by flexing the wrists. Squeeze one second, lower over 2 seconds.","cm":"Bending the elbows to help. Letting the bar roll out of the fingers entirely."},{"id":"ez-bar-reverse-curl","n":"EZ-bar reverse curl","eq":"barbell","lt":"weighted","p":["forearms/forearms"],"s":["biceps/biceps"],"su":"EZ bar held at arm's length in front of the thighs, overhand grip on the angled sections.","po":"Stand tall, chest up, elbows pinned to the ribs, wrists straight and locked, core braced.","exn":"Exhale and curl the bar up to chest height with the palms staying down. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Using normal curl weight, which the overhand grip cannot support. Letting the wrists collapse backward."},{"id":"dumbbell-wrist-curl","n":"Dumbbell wrist curl","eq":"dumbbell","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Sit on a bench, one forearm resting on the thigh, wrist just past the knee, palm up. Dumbbell held loosely.","po":"Sit tall with a flat back, forearm flat and still on the thigh.","exn":"Let the dumbbell roll to the fingertips, then exhale and curl it up by closing the fingers and flexing the wrist. Lower over 2 seconds.","cm":"Lifting the forearm off the thigh. Skipping the fingertip roll, which halves the range."},{"id":"dumbbell-reverse-wrist-curl","n":"Dumbbell reverse wrist curl","eq":"dumbbell","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Sit on a bench, one forearm on the thigh, wrist just past the knee, palm facing down.","po":"Sit tall with a flat back, forearm flat and still.","exn":"Exhale and lift the back of the hand upward as far as it will go. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Going too heavy for the small extensor muscles. Rotating the forearm to cheat the movement."},{"id":"cable-wrist-curl","n":"Cable wrist curl","eq":"cable","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Straight bar on the lowest pulley. Kneel or sit with the forearms resting on a bench, wrists past the edge, palms up.","po":"Forearms flat and still on the bench, back flat, shoulders relaxed.","exn":"Exhale and curl the bar up by flexing the wrists against constant cable tension. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Lifting the forearms off the bench. Positioning so far from the pulley that the cable pulls at an angle."},{"id":"kettlebell-farmer-hold","n":"Kettlebell farmer hold","eq":"kettlebell","lt":"timed","p":["forearms/forearms"],"s":["back/upper"],"su":"A heavy kettlebell in each hand at your sides, arms straight. Stand tall before starting the clock.","po":"Chest up, shoulders back and down, ribs stacked over the hips, core braced hard, wrists straight.","exn":"Hold still for the set duration, gripping hard. Breathe in a shallow steady rhythm rather than holding your breath. Set the bells down deliberately.","cm":"Shrugging the shoulders up. Letting the bells drift forward. Holding the breath for the whole set."},{"id":"dead-hang","n":"Dead hang","eq":"bodyweight","lt":"timed","p":["forearms/forearms"],"s":["back/lats","back/upper"],"su":"Grip a pull-up bar overhand at roughly shoulder width. Step off and let the body hang.","po":"Arms straight, shoulders active and pulled slightly down rather than fully loose. Ribs down, core lightly braced so the legs don't swing.","exn":"Hang for the set duration, gripping hard. Breathe slow and steady. Step down under control rather than dropping.","cm":"Hanging completely limp with shoulders in the ears. Swinging. Dropping off the bar from height."},{"id":"plate-pinch-hold","n":"Plate pinch hold","eq":"other","lt":"timed","p":["forearms/forearms"],"s":[],"su":"Stand holding one or two smooth weight plates pinched between the thumb and fingers, arms at your sides.","po":"Stand tall, chest up, shoulders back and down, arms straight and still.","exn":"Pinch hard and hold for the set duration. Breathe steadily. Set the plates down under control before the grip fully fails.","cm":"Letting the plates slip and drop on your feet. Holding to complete failure over a bare floor."},{"id":"wrist-roller","n":"Wrist roller","eq":"other","lt":"timed","p":["forearms/forearms"],"s":[],"su":"Hold the roller bar out in front at shoulder height with both hands, weight hanging from the cord.","po":"Stand tall, chest up, arms straight out in front and held level, core braced.","exn":"Roll the cord up by alternating wrist flexion hand over hand, then reverse it down slowly. Breathe steadily throughout, don't hold your breath.","cm":"Letting the arms drop as the shoulders fatigue. Letting the weight unwind fast instead of lowering it under control."},{"id":"band-wrist-extension","n":"Band wrist extension","eq":"bands","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Loop a light band around the fingers of one hand, other end anchored or held. Forearm resting on a thigh or bench, palm down.","po":"Forearm flat and still, wrist just past the edge, shoulders relaxed.","exn":"Exhale and open the fingers and extend the wrist upward against the band. Hold one second, return over 2 seconds, inhaling.","cm":"Using a band so heavy the forearm lifts to help. Rushing the return."},{"id":"machine-gripper","n":"Machine gripper","eq":"machine","lt":"weighted","p":["forearms/forearms"],"s":[],"su":"Set the handle spacing so the hand can open comfortably at the start. Grip with the whole hand.","po":"Sit or stand tall, wrist straight and in line with the forearm, shoulder relaxed.","exn":"Exhale and squeeze the handle fully closed. Hold one second, open slowly over 2 seconds, inhaling.","cm":"Letting the wrist bend to add leverage. Snapping the handle open on the return."},{"id":"crunch","n":"Crunch","eq":"bodyweight","lt":"bodyweight","p":["abs/upper"],"s":[],"su":"Lie on your back, knees bent at about 90 degrees, feet flat. Hands lightly behind the ears or crossed on the chest.","po":"Lower back stays in contact with the floor, chin a fist's width from the chest, neck relaxed.","exn":"Exhale and curl the shoulder blades off the floor by rounding the upper spine, about 30 degrees of movement. Hold one second, lower over 2 seconds, inhaling.","cm":"Pulling on the neck with the hands. Trying to sit all the way up, which brings in the hip flexors. Yanking up with momentum."},{"id":"sit-up","n":"Sit-up","eq":"bodyweight","lt":"bodyweight","p":["abs/upper"],"s":["abs/lower"],"su":"Lie on your back, knees bent, feet flat and anchored or not. Arms crossed on the chest.","po":"Chin a fist's width from the chest, spine rounding smoothly rather than hinging in one block.","exn":"Exhale and curl up one vertebra at a time until the torso is upright. Lower over 2 to 3 seconds, inhaling, rolling down through the spine.","cm":"Hooking the feet and yanking up with the hip flexors. Flinging the arms forward for momentum. Slamming back down."},{"id":"decline-sit-up","n":"Decline sit-up","eq":"bodyweight","lt":"bodyweight","p":["abs/upper"],"s":["abs/lower"],"su":"Set the decline bench to 15 to 30 degrees. Hook the ankles under the pads, arms crossed on the chest.","po":"Chin a fist's width from the chest, core braced, spine rounding smoothly.","exn":"Exhale and curl up until the torso is upright. Lower over 2 to 3 seconds, inhaling, and stop just before the shoulders touch down.","cm":"Starting at too steep a decline. Free-falling backward between reps. Pulling on the neck."},{"id":"toe-touch-crunch","n":"Toe-touch crunch","eq":"bodyweight","lt":"bodyweight","p":["abs/upper"],"s":[],"su":"Lie on your back with the legs straight up toward the ceiling, arms reaching up toward the feet.","po":"Lower back pressed into the floor, legs held vertical and still, neck relaxed.","exn":"Exhale and curl the shoulder blades off the floor, reaching the hands toward the toes. Hold one second, lower over 2 seconds, inhaling.","cm":"Swinging the arms up for momentum. Letting the legs drop forward to meet the hands."},{"id":"plank","n":"Plank","eq":"bodyweight","lt":"timed","p":["abs/upper"],"s":["abs/lower","obliques/obliques"],"su":"Forearms on the floor, elbows directly under the shoulders, hands facing forward. Legs straight, feet hip width.","po":"Straight line from head to heels. Glutes squeezed, ribs pulled down, core braced hard, neck neutral with eyes on the floor.","exn":"Hold for the set duration. Breathe shallow and steady through the nose. Stop the set when the hips start to drop rather than grinding out sloppy time.","cm":"Hips sagging toward the floor, which loads the lower back. Piking the hips up to make it easier. Holding the breath."},{"id":"v-up","n":"V-up","eq":"bodyweight","lt":"bodyweight","p":["abs/upper","abs/lower"],"s":[],"su":"Lie flat on your back, arms extended overhead, legs straight.","po":"Lower back pressed toward the floor at the start, core braced, neck neutral.","exn":"Exhale and lift the arms and legs at the same time, folding at the hips to meet over the middle. Hold one second, lower over 2 to 3 seconds, inhaling.","cm":"Bending the knees to make the lever shorter. Slamming the legs and shoulders down between reps."},{"id":"cable-crunch","n":"Cable crunch","eq":"cable","lt":"weighted","p":["abs/upper"],"s":["obliques/obliques"],"su":"Rope on a high pulley. Kneel facing the machine, rope held beside the ears, elbows tucked.","po":"Hips fixed in place, chest up at the start, hands locked beside the head throughout.","exn":"Exhale and crunch down by rounding the upper spine, bringing the elbows toward the thighs. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Hinging at the hips instead of rounding the spine, which turns it into a pulldown. Letting the hands drift away from the head."},{"id":"machine-crunch","n":"Machine crunch","eq":"machine","lt":"weighted","p":["abs/upper"],"s":[],"su":"Set the seat and pad so the pivot lines up with your waist. Grip the handles.","po":"Back against the pad, chest up at the start, core braced, feet secured.","exn":"Exhale and crunch forward by rounding the spine. Squeeze one second, return over 2 to 3 seconds under control.","cm":"Pulling with the arms instead of the abs. Letting the stack slam down between reps."},{"id":"weighted-dumbbell-crunch","n":"Weighted dumbbell crunch","eq":"dumbbell","lt":"weighted","p":["abs/upper"],"s":[],"su":"Lie on your back, knees bent, feet flat. Hold one dumbbell against the chest or just above it.","po":"Lower back on the floor, chin a fist's width from the chest, neck relaxed.","exn":"Exhale and curl the shoulder blades off the floor about 30 degrees. Hold one second, lower over 2 seconds, inhaling.","cm":"Using the dumbbell's momentum to swing up. Adding weight before a bodyweight crunch is clean."},{"id":"ab-wheel-rollout","n":"Ab wheel rollout","eq":"other","lt":"bodyweight","p":["abs/upper"],"s":["abs/lower","back/lower"],"su":"Kneel on a mat with the wheel under the shoulders, hands gripping the handles. Start from your knees, not your feet.","po":"Ribs pulled down, glutes squeezed, lower back flat and locked. This position must not change during the rep.","exn":"Inhale and roll forward as far as you can hold a flat back, then exhale and pull back to the start. Stop well short of full extension at first.","cm":"Letting the lower back arch as you extend, which is the main injury risk. Rolling out further than you can pull back from."},{"id":"stability-ball-crunch","n":"Stability ball crunch","eq":"other","lt":"bodyweight","p":["abs/upper"],"s":[],"su":"Sit on the ball then walk the feet forward until the lower back is supported on the ball. Feet flat, hip width.","po":"Hips level, core braced, chin a fist's width from the chest, neck relaxed.","exn":"Exhale and curl the shoulder blades up by rounding the spine. Hold one second, lower over 2 seconds into a slight backward stretch, inhaling.","cm":"Letting the hips drop so the ball rolls. Using such a big range that the lower back overextends at the bottom."},{"id":"hanging-leg-raise","n":"Hanging leg raise","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":["forearms/forearms","obliques/obliques"],"su":"Hang from a pull-up bar with an overhand grip at shoulder width, legs straight, body still.","po":"Shoulders pulled down away from the ears, ribs down, core braced hard so the body doesn't swing.","exn":"Exhale and raise the straight legs until they reach at least hip height, tilting the pelvis up at the top. Lower over 2 to 3 seconds, inhaling.","cm":"Swinging and using momentum. Only raising the legs by hinging at the hip without tilting the pelvis. Dropping the legs fast."},{"id":"hanging-knee-raise","n":"Hanging knee raise","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":["forearms/forearms"],"su":"Hang from a pull-up bar with an overhand grip at shoulder width, legs together.","po":"Shoulders pulled down away from the ears, ribs down, core braced so the body stays still.","exn":"Exhale and raise the knees toward the chest, curling the pelvis up at the top. Lower over 2 to 3 seconds, inhaling.","cm":"Kipping the legs up with a body swing. Stopping at 90 degrees without the pelvic tilt, which skips the abs."},{"id":"captain-s-chair-knee-raise","n":"Captain's chair knee raise","eq":"machine","lt":"bodyweight","p":["abs/lower"],"s":[],"su":"Forearms on the pads, hands gripping the handles, back against the pad. Legs hanging straight.","po":"Back flat against the pad, shoulders down away from the ears, core braced.","exn":"Exhale and raise the knees toward the chest, curling the pelvis up at the top. Lower over 2 to 3 seconds, inhaling.","cm":"Swinging the legs up. Arching the back off the pad. Stopping short of the pelvic tilt."},{"id":"lying-leg-raise","n":"Lying leg raise","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":[],"su":"Lie flat on your back, legs straight and together, hands under the hips or beside them for support.","po":"Lower back pressed into the floor throughout. If it lifts, that is your range limit. Neck relaxed.","exn":"Exhale and raise the straight legs to about 90 degrees. Lower over 2 to 3 seconds, inhaling, stopping before the lower back peels off the floor.","cm":"Letting the lower back arch on the way down, which is where injuries happen. Dropping the legs fast. Bending the knees to cheat."},{"id":"reverse-crunch","n":"Reverse crunch","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":[],"su":"Lie flat on your back, knees bent at about 90 degrees, arms flat at your sides.","po":"Lower back pressed into the floor, neck relaxed, upper body still.","exn":"Exhale and curl the pelvis up off the floor, bringing the knees toward the chest. Hold one second, lower over 2 seconds, inhaling.","cm":"Swinging the legs to generate lift. Pushing off the floor with the hands. Simply pulling the knees in without lifting the pelvis."},{"id":"cable-reverse-crunch","n":"Cable reverse crunch","eq":"cable","lt":"weighted","p":["abs/lower"],"s":[],"su":"Ankle straps or a rope on a low pulley. Lie on your back with the feet toward the machine, knees bent at 90 degrees.","po":"Lower back pressed into the floor, upper body anchored by gripping something overhead.","exn":"Exhale and curl the pelvis up off the floor against the cable, knees toward the chest. Hold one second, lower over 2 to 3 seconds.","cm":"Letting the cable pull the legs straight fast. Arching the lower back at the bottom."},{"id":"flutter-kick","n":"Flutter kick","eq":"bodyweight","lt":"timed","p":["abs/lower"],"s":[],"su":"Lie flat on your back, legs straight, hands under the hips for support. Lift the heels about 15cm off the floor.","po":"Lower back pressed into the floor throughout, neck relaxed, shoulders down.","exn":"Alternate small rapid kicks, one leg up and one down, staying within about 30cm of the floor. Hold for the set duration, breathing shallow and steady.","cm":"Letting the lower back arch off the floor as fatigue sets in. Kicking so high the abs disengage."},{"id":"scissor-kick","n":"Scissor kick","eq":"bodyweight","lt":"timed","p":["abs/lower"],"s":[],"su":"Lie flat on your back, legs straight, hands under the hips. Lift both heels about 15cm off the floor.","po":"Lower back pressed into the floor, neck relaxed, core braced.","exn":"Cross one leg over the other, then switch, in a steady scissoring rhythm for the set duration. Breathe shallow and steady rather than holding your breath.","cm":"Lower back arching off the floor. Going so fast the movement becomes a flail."},{"id":"mountain-climber","n":"Mountain climber","eq":"bodyweight","lt":"timed","p":["abs/lower"],"s":["obliques/obliques","shoulders/front-delt"],"su":"Start in a push-up position, hands under the shoulders, body in a straight line.","po":"Hips level and low, shoulders stacked over the wrists, core braced, neck neutral.","exn":"Drive one knee toward the chest, then switch legs in a steady running rhythm for the set duration. Breathe in a continuous rhythm, don't hold your breath.","cm":"Letting the hips bounce up and down. Shoulders drifting behind the wrists. Going so fast the form collapses."},{"id":"dead-bug","n":"Dead bug","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":["abs/upper"],"su":"Lie on your back with arms straight up over the shoulders and knees bent at 90 degrees over the hips.","po":"Lower back pressed flat into the floor throughout. This contact is the entire exercise. Ribs down, neck relaxed.","exn":"Exhale and slowly extend the right arm overhead and the left leg straight out, stopping before the lower back lifts. Inhale and return, then switch sides.","cm":"Letting the lower back arch as the limbs extend. Moving fast. Extending further than the core can hold."},{"id":"dragon-flag","n":"Dragon flag","eq":"bodyweight","lt":"bodyweight","p":["abs/lower"],"s":["abs/upper"],"su":"Lie on a bench and grip it firmly behind your head. Only attempt this once hanging leg raises are easy.","po":"Body held in one rigid straight line from shoulders to toes, core braced extremely hard, shoulders pinned to the bench.","exn":"Exhale and lift the whole body up so it pivots on the upper back. Inhale and lower slowly over 3 to 5 seconds, keeping the line, stopping before the hips sag.","cm":"Attempting it before the core is ready, which strains the lower back badly. Piking at the hips. Dropping fast on the way down."},{"id":"russian-twist","n":"Russian twist","eq":"bodyweight","lt":"bodyweight","p":["obliques/obliques"],"s":["abs/upper"],"su":"Sit on the floor, knees bent, heels lightly touching down or lifted. Lean back to about 45 degrees.","po":"Flat back with the chest up, not rounded. Core braced hard, shoulders down.","exn":"Exhale as you rotate the torso to one side, leading with the shoulders rather than just the arms. Inhale back through centre, then rotate to the other side.","cm":"Rounding the lower back at 45 degrees. Just swinging the arms while the torso stays square. Going fast enough to lose control."},{"id":"weighted-russian-twist","n":"Weighted Russian twist","eq":"dumbbell","lt":"weighted","p":["obliques/obliques"],"s":["abs/upper"],"su":"Sit on the floor, knees bent, leaning back to about 45 degrees. Hold one dumbbell with both hands at the chest.","po":"Flat back, chest up, core braced hard. Add weight only once the bodyweight version is clean.","exn":"Exhale and rotate the torso to one side, moving the weight with the chest rather than the arms. Inhale through centre, then rotate the other way.","cm":"Letting the back round under load. Swinging the weight with the arms alone."},{"id":"side-plank","n":"Side plank","eq":"bodyweight","lt":"timed","p":["obliques/obliques"],"s":["abs/upper"],"su":"Lie on one side, forearm on the floor with the elbow directly under the shoulder. Legs stacked, feet together.","po":"Straight line from head to feet, hips lifted and level, top shoulder stacked over the bottom, neck neutral.","exn":"Lift the hips and hold for the set duration. Breathe shallow and steady. Lower under control and switch sides.","cm":"Hips sinking toward the floor. Rotating the chest toward the floor. Elbow drifting out of line with the shoulder."},{"id":"bicycle-crunch","n":"Bicycle crunch","eq":"bodyweight","lt":"bodyweight","p":["obliques/obliques"],"s":["abs/upper","abs/lower"],"su":"Lie on your back, hands lightly behind the ears, knees bent and lifted over the hips.","po":"Lower back pressed into the floor, chin a fist's width from the chest, elbows kept wide.","exn":"Exhale and bring one elbow toward the opposite knee while extending the other leg straight. Inhale and switch in a steady controlled rhythm.","cm":"Pulling on the neck with the hands. Racing through reps so the rotation disappears. Letting the lower back lift off the floor."},{"id":"hanging-oblique-knee-raise","n":"Hanging oblique knee raise","eq":"bodyweight","lt":"bodyweight","p":["obliques/obliques"],"s":["abs/lower","forearms/forearms"],"su":"Hang from a pull-up bar with an overhand grip at shoulder width, legs together.","po":"Shoulders pulled down away from the ears, ribs down, core braced so the body doesn't swing.","exn":"Exhale and raise the knees toward one shoulder, twisting at the waist at the top. Lower over 2 to 3 seconds, inhaling, then alternate sides.","cm":"Swinging the body to throw the knees across. Twisting only at the hips without lifting the pelvis."},{"id":"cable-woodchopper","n":"Cable woodchopper","eq":"cable","lt":"weighted","p":["obliques/obliques"],"s":["abs/upper"],"su":"Set the pulley high with a single handle. Stand side-on, feet slightly wider than the hips, grip with both hands.","po":"Chest up, flat back, core braced, knees softly bent. Hips pivot with the movement rather than staying locked.","exn":"Exhale and pull the handle down and across the body toward the opposite hip, rotating through the torso and letting the back heel turn. Return over 2 to 3 seconds, inhaling.","cm":"Rotating from the lower back rather than through the hips and mid-back. Using only the arms. Standing too upright."},{"id":"pallof-press","n":"Pallof press","eq":"cable","lt":"weighted","p":["obliques/obliques"],"s":["abs/upper"],"su":"Set the pulley at chest height with a single handle. Stand side-on, grip with both hands at the sternum, step out until taut.","po":"Feet shoulder width, knees softly bent, chest up, ribs down, core braced hard. Hips and shoulders square and locked.","exn":"Exhale and press the handle straight out from the chest, resisting the cable's pull to rotate you. Hold 2 seconds, return over 2 seconds, inhaling.","cm":"Letting the torso rotate toward the machine, which defeats the whole point. Going so heavy that the hips twist."},{"id":"cable-side-bend","n":"Cable side bend","eq":"cable","lt":"weighted","p":["obliques/obliques"],"s":[],"su":"Single handle on the lowest pulley. Stand side-on and grip it with the near hand, arm straight at your side.","po":"Stand tall, chest up, feet hip width, free hand on the hip or behind the head. Movement happens only in the frontal plane.","exn":"Inhale and let the cable draw you into a side bend. Exhale and pull back up to tall by contracting the opposite side. Hold one second at the top.","cm":"Bending forward or twisting instead of bending directly sideways. Using so much weight the whole torso leans."},{"id":"dumbbell-side-bend","n":"Dumbbell side bend","eq":"dumbbell","lt":"weighted","p":["obliques/obliques"],"s":[],"su":"A dumbbell in one hand at your side, arm straight. Free hand on the hip or behind the head. Feet hip width.","po":"Stand tall, chest up, shoulders level, movement strictly sideways with no forward lean or twist.","exn":"Inhale and lower the dumbbell down the side of the leg. Exhale and pull back up to tall, squeezing the opposite side. Hold one second.","cm":"Holding a dumbbell in each hand, which cancels the resistance out entirely. Twisting the torso as you bend."},{"id":"suitcase-carry","n":"Suitcase carry","eq":"dumbbell","lt":"timed","p":["obliques/obliques"],"s":["forearms/forearms","back/upper"],"su":"One heavy dumbbell in one hand at your side. Stand tall before moving.","po":"Shoulders and hips level and square, ribs stacked over the hips, core braced hard on both sides. Do not lean away from the load.","exn":"Walk at a steady controlled pace for the set duration, resisting the pull to one side. Breathe shallow and steady. Switch hands for the next set.","cm":"Leaning away from the weight, which removes the entire training effect. Shrugging the loaded shoulder up. Holding the breath."},{"id":"landmine-rotation","n":"Landmine rotation","eq":"barbell","lt":"weighted","p":["obliques/obliques"],"s":["abs/upper","shoulders/front-delt"],"su":"One barbell end in a landmine sleeve. Hold the free end with both hands at chest height, arms extended.","po":"Feet slightly wider than the hips, chest up, core braced. Hips pivot with the rotation, back heel free to turn.","exn":"Exhale and sweep the bar in an arc from one hip to the other, rotating through the hips and mid-back. Control the return over 2 seconds, inhaling.","cm":"Keeping the feet locked flat so the lower back absorbs the twist. Letting the bar drop rather than controlling the arc."},{"id":"machine-torso-rotation","n":"Machine torso rotation","eq":"machine","lt":"weighted","p":["obliques/obliques"],"s":[],"su":"Set the seat and pad so the chest and legs are secured and the torso can rotate freely.","po":"Sit tall, chest up, hips locked in place by the pads, core braced.","exn":"Exhale and rotate the torso to one side under control. Hold one second, return over 2 to 3 seconds, inhaling. Complete all reps, then switch sides.","cm":"Using a range far beyond comfortable rotation. Letting the weight stack snap you back to centre."},{"id":"barbell-back-squat","n":"Barbell back squat","eq":"barbell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","hamstrings/hamstrings","back/lower","abs/upper"],"su":"Bar racked at upper-chest height, resting across the upper traps. Grip just outside the shoulders. Unrack and step back two paces, feet shoulder width, toes turned out 15 to 30 degrees.","po":"Chest up, ribs down, upper back tight, core braced hard as if about to be punched. Weight through the mid-foot, knees tracking over the toes.","exn":"Inhale and brace. Sit down and slightly back until the hip crease drops below the knee, or as low as you can hold a flat back. Drive through the whole foot to stand, exhaling past the hardest point.","cm":"Knees caving inward. Rounding the lower back at the bottom, the so-called butt wink. Rising with the hips first so the torso folds forward."},{"id":"barbell-front-squat","n":"Barbell front squat","eq":"barbell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","abs/upper","back/upper"],"su":"Bar racked across the front delts and collarbone, elbows driven high so the upper arms are parallel to the floor. Feet shoulder width, toes out 15 degrees.","po":"Elbows up throughout, chest tall and vertical, ribs down, core braced hard. The torso stays far more upright than in a back squat.","exn":"Inhale and brace. Squat straight down until the hip crease passes below the knee. Drive up through the mid-foot, exhaling, keeping the elbows high the whole way.","cm":"Letting the elbows drop, which dumps the bar forward. Leaning the torso forward like a back squat. Gripping so tight the wrists strain instead of resting the bar on the shoulders."},{"id":"box-squat","n":"Box squat","eq":"barbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Set a box or bench so that sitting on it puts the thighs at or just below parallel. Bar on the upper traps, feet shoulder width or slightly wider.","po":"Chest up, ribs down, core braced hard, shins close to vertical as you sit back.","exn":"Inhale and brace. Sit back onto the box under control, pause for one second without relaxing. Drive up through the mid-foot and exhale.","cm":"Flopping onto the box and bouncing off it, which loads the spine. Relaxing the core during the pause."},{"id":"zercher-squat","n":"Zercher squat","eq":"barbell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","abs/upper","back/upper"],"su":"Bar cradled in the crooks of both elbows, held against the body. Use a pad or sleeve, this is uncomfortable. Feet shoulder width, toes out slightly.","po":"Chest up and very tall, elbows tucked in, upper back tight, core braced extremely hard. Start far lighter than your back squat.","exn":"Inhale and brace. Squat straight down between the knees until the elbows are inside the thighs. Drive up through the mid-foot and exhale.","cm":"Loading it like a back squat, which the arms and upper back cannot hold. Rounding forward as the bar drags the torso down."},{"id":"landmine-squat","n":"Landmine squat","eq":"barbell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","abs/upper"],"su":"One barbell end in a landmine sleeve. Hold the free end at chest height with both hands. Feet shoulder width, toes out slightly.","po":"Chest up, torso upright, core braced. The bar's arc naturally counterbalances you and keeps the torso vertical.","exn":"Inhale, squat down until the thighs are at least parallel, letting the bar travel along its arc. Drive up through the mid-foot and exhale.","cm":"Letting the bar drift away from the chest. Standing too close or too far so the arc fights you."},{"id":"goblet-squat","n":"Goblet squat","eq":"dumbbell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","abs/upper"],"su":"Hold one dumbbell vertically against the chest, cupping the top end with both hands. Feet shoulder width, toes out 15 degrees.","po":"Chest up, elbows tucked in, torso upright, core braced. The front load helps keep you vertical.","exn":"Inhale, squat down until the elbows brush the inside of the knees. Pause briefly, drive up through the mid-foot and exhale.","cm":"Letting the dumbbell drift away from the chest. Rounding the upper back as the weight pulls forward."},{"id":"kettlebell-goblet-squat","n":"Kettlebell goblet squat","eq":"kettlebell","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","abs/upper"],"su":"Hold one kettlebell by the horns at chest height, bell resting against the sternum. Feet shoulder width, toes out slightly.","po":"Chest up, elbows tucked, torso upright, core braced, wrists straight.","exn":"Inhale, squat down until the elbows brush the inside of the knees. Drive up through the mid-foot and exhale.","cm":"Letting the bell pull the chest down. Letting the heels lift off the floor."},{"id":"leg-press","n":"Leg press","eq":"machine","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes","hamstrings/hamstrings"],"su":"Sit with the back and hips flat against the pad. Feet on the platform at shoulder width, mid-height, toes turned out slightly.","po":"Lower back and hips glued to the pad throughout. This contact is non-negotiable. Head back, core braced.","exn":"Release the safeties. Inhale and lower the platform until the knees reach about 90 degrees or just before the hips start to curl off the pad. Press up and exhale, stopping just short of locking the knees.","cm":"Going so deep the lower back rounds off the pad, which is the main injury risk. Snapping the knees into full lockout. Letting the knees cave inward."},{"id":"hack-squat-machine","n":"Hack squat machine","eq":"machine","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes"],"su":"Shoulders under the pads, back flat against the backrest. Feet shoulder width, mid-platform, toes out slightly.","po":"Back and hips flat against the pad, chest up, core braced, knees tracking over the toes.","exn":"Release the safeties. Inhale and lower until the thighs are at least parallel. Drive up through the mid-foot and exhale, stopping just short of lockout.","cm":"Placing the feet too low, which grinds the knees. Letting the hips curl off the pad at the bottom."},{"id":"smith-machine-squat","n":"Smith machine squat","eq":"machine","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes"],"su":"Bar on the upper traps. Feet slightly ahead of the bar line, shoulder width, toes out 15 degrees.","po":"Chest up, ribs down, core braced. The fixed bar path means foot placement determines everything.","exn":"Unrack with a wrist twist. Inhale and squat down until the thighs are at least parallel. Drive up and exhale.","cm":"Feet placed directly under the bar, which forces the knees far forward. Relying on the machine and letting the core go slack."},{"id":"belt-squat","n":"Belt squat","eq":"machine","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes"],"su":"Attach the belt around the hips, load hanging between the legs. Feet shoulder width on the platform, toes out slightly.","po":"Chest up, torso tall, core braced. The spine carries no load, which is the whole point.","exn":"Inhale and squat down until the thighs are at least parallel. Drive up through the mid-foot and exhale.","cm":"Letting the belt ride up onto the waist rather than sitting on the hips. Leaning on the handles to pull yourself up."},{"id":"leg-extension","n":"Leg extension","eq":"machine","lt":"weighted","p":["quads/quads"],"s":[],"su":"Set the seat so the knees line up with the machine's pivot, and the ankle pad rests just above the feet.","po":"Back flat against the pad, hands on the handles, thighs pressed into the seat, core lightly braced.","exn":"Exhale and extend the knees until the legs are straight. Squeeze one second at the top, lower over 2 to 3 seconds, inhaling.","cm":"Swinging the weight up with a hip thrust. Letting the stack crash down between reps. Setting the pivot out of line with the knee."},{"id":"bulgarian-split-squat","n":"Bulgarian split squat","eq":"dumbbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Stand about a stride in front of a bench. Place the top of the rear foot on it. Front foot far enough forward that the knee stays over the mid-foot at the bottom.","po":"Chest up, torso slightly forward, hips square, core braced. Weight through the front heel and mid-foot.","exn":"Inhale and lower until the front thigh is parallel to the floor and the back knee is just off the ground. Drive up through the front foot and exhale.","cm":"Front foot too close, forcing the knee far past the toes. Pushing off the back foot. Letting the hips rotate open."},{"id":"split-squat","n":"Split squat","eq":"dumbbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":[],"su":"Step into a split stance, front foot flat and rear heel lifted, feet about a stride apart and hip width laterally.","po":"Chest up, torso upright, hips square, core braced. Both knees track over the toes.","exn":"Inhale and lower straight down until the back knee is just off the floor and the front thigh is parallel. Drive up through the front heel and exhale.","cm":"Stepping the feet onto a tightrope line, which destroys balance. Pushing mainly off the back foot."},{"id":"walking-lunge","n":"Walking lunge","eq":"dumbbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":["hamstrings/hamstrings","calves/calves"],"su":"Stand tall holding a dumbbell in each hand at your sides. Feet hip width.","po":"Chest up, torso upright, shoulders back, core braced, eyes forward.","exn":"Inhale and step forward about a stride, lowering until the back knee is just off the floor and the front thigh is parallel. Exhale and drive through the front heel to step directly into the next lunge.","cm":"Taking a short step so the front knee shoots past the toes. Letting the torso pitch forward. Letting the front knee cave inward."},{"id":"reverse-lunge","n":"Reverse lunge","eq":"dumbbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Stand tall with a dumbbell in each hand at your sides. Feet hip width.","po":"Chest up, torso upright, hips square, core braced.","exn":"Inhale and step backward about a stride, lowering until the back knee is just off the floor. Drive through the front heel to return to standing, exhaling.","cm":"Stepping back onto a narrow line and losing balance. Letting the front heel lift as you drive up."},{"id":"step-up","n":"Step-up","eq":"dumbbell","lt":"weighted","p":["quads/quads","glutes/glutes"],"s":["calves/calves"],"su":"Set a box or bench at a height that puts the thigh roughly parallel when the foot is on it. Dumbbell in each hand.","po":"Chest up, torso upright, core braced, whole working foot flat on the box.","exn":"Exhale and drive through the working heel to stand up on the box, keeping the trailing leg passive. Lower over 2 to 3 seconds under control, inhaling.","cm":"Pushing off the floor with the trailing leg. Choosing a box so high the hip has to twist. Dropping back down uncontrolled."},{"id":"bodyweight-squat","n":"Bodyweight squat","eq":"bodyweight","lt":"bodyweight","p":["quads/quads"],"s":["glutes/glutes"],"su":"Stand with feet shoulder width, toes turned out 15 degrees. Arms out in front for balance.","po":"Chest up, ribs down, core braced, weight through the mid-foot, knees tracking over the toes.","exn":"Inhale and sit down and back until the thighs are at least parallel. Drive up through the whole foot and exhale.","cm":"Heels lifting off the floor. Knees caving inward. Rounding the lower back at the bottom."},{"id":"pistol-squat","n":"Pistol squat","eq":"bodyweight","lt":"bodyweight","p":["quads/quads"],"s":["glutes/glutes","abs/upper"],"su":"Stand on one leg, other leg extended straight out in front. Arms forward for balance. Build up with a box or support first.","po":"Chest up, core braced hard, working foot flat with the whole sole down, knee tracking over the toes.","exn":"Inhale and lower slowly on one leg until the hamstring meets the calf, keeping the free leg off the floor. Drive up through the whole foot and exhale.","cm":"Attempting it before you have the ankle mobility, so the heel lifts. Collapsing into the bottom rather than lowering under control."},{"id":"sissy-squat","n":"Sissy squat","eq":"bodyweight","lt":"bodyweight","p":["quads/quads"],"s":[],"su":"Stand tall, holding a support with one hand. Feet hip width, heels raised or on a small plate.","po":"Body held in a straight line from knees to head as you descend. Hips stay extended, core braced hard.","exn":"Inhale and lean back, letting the knees travel forward while the hips stay open, lowering until the thighs are near the calves. Drive up by extending the knees, exhaling.","cm":"Bending at the hips, which turns it into a normal squat. Going far deeper than the knees are conditioned for."},{"id":"wall-sit","n":"Wall sit","eq":"bodyweight","lt":"timed","p":["quads/quads"],"s":[],"su":"Stand with your back flat against a wall, then walk the feet out and slide down until the thighs are parallel to the floor.","po":"Back flat against the wall, knees directly over the ankles at 90 degrees, chest up, core braced. Hands off the thighs.","exn":"Hold the position for the set duration. Breathe steadily through the nose rather than holding your breath.","cm":"Resting the hands on the thighs to take load off. Sliding up as fatigue sets in. Letting the knees drift past the toes."},{"id":"band-squat","n":"Band squat","eq":"bands","lt":"weighted","p":["quads/quads"],"s":["glutes/glutes"],"su":"Stand on the middle of a band, feet shoulder width, and bring the top over the shoulders or hold at chest height.","po":"Chest up, ribs down, core braced, knees tracking over the toes.","exn":"Inhale and squat down until the thighs are at least parallel. Drive up through the mid-foot and exhale at the top, where band tension is highest.","cm":"Letting the band pull the torso forward. Cutting the depth short because the top is the hardest part."},{"id":"lying-leg-curl","n":"Lying leg curl","eq":"machine","lt":"weighted","p":["hamstrings/hamstrings"],"s":["calves/calves"],"su":"Lie face down with the knees just past the edge of the pad and the ankle roller sitting just above the heels.","po":"Hips pressed into the pad throughout, chest down, hands on the handles, neck neutral.","exn":"Exhale and curl the heels toward the glutes as far as they will go. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Lifting the hips off the pad to swing the weight up, which is the most common fault here. Letting the stack drop fast."},{"id":"seated-leg-curl","n":"Seated leg curl","eq":"machine","lt":"weighted","p":["hamstrings/hamstrings"],"s":["calves/calves"],"su":"Set the back pad so the knees line up with the pivot. Lap pad snug over the thighs, ankle roller just above the heels.","po":"Back flat against the pad, hips pinned by the lap pad, core lightly braced.","exn":"Exhale and curl the heels down and back as far as they will go. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Sliding forward out of the seat. Not tightening the lap pad, so the hips lift on every rep."},{"id":"standing-leg-curl","n":"Standing leg curl","eq":"machine","lt":"weighted","p":["hamstrings/hamstrings"],"s":[],"su":"Stand facing the machine, one leg against the roller just above the heel, hands on the handles.","po":"Stand tall, hips square, working thigh pressed against the pad, core braced.","exn":"Exhale and curl the heel toward the glute. Squeeze one second, lower over 2 to 3 seconds, inhaling. Complete all reps, then switch legs.","cm":"Swinging the hip forward to help. Letting the torso lean back as the weight rises."},{"id":"glute-ham-raise","n":"Glute-ham raise","eq":"machine","lt":"bodyweight","p":["hamstrings/hamstrings"],"s":["glutes/glutes","back/lower"],"su":"Set the foot plate and pad so the thighs rest on the pad and the ankles are secured. Start from a kneeling upright position.","po":"Straight line from knees to head throughout. Hips extended, glutes squeezed, core braced hard.","exn":"Inhale and lower slowly over 3 to 5 seconds, keeping the body in one line. Exhale and pull back up using the hamstrings. Use your hands on the floor to assist early on.","cm":"Bending at the hips on the way down. Attempting unassisted before the hamstrings can control the descent, which strains them badly."},{"id":"barbell-romanian-deadlift","n":"Barbell Romanian deadlift","eq":"barbell","lt":"weighted","p":["hamstrings/hamstrings"],"s":["glutes/glutes","back/lower","forearms/forearms"],"su":"Start standing tall with the bar at arm's length against the thighs, overhand grip just outside the legs. Feet hip width.","po":"Chest up, flat back, shoulders back, lats engaged, core braced hard. Knees held at a soft fixed 15 degree bend.","exn":"Inhale and brace. Push the hips straight back, sliding the bar down the thighs until you feel a strong hamstring stretch, usually around mid-shin. Drive the hips forward to stand, exhaling.","cm":"Turning it into a squat by bending the knees further as you descend. Rounding the lower back to chase depth. Letting the bar drift away from the legs."},{"id":"stiff-leg-deadlift","n":"Stiff-leg deadlift","eq":"barbell","lt":"weighted","p":["hamstrings/hamstrings"],"s":["glutes/glutes","back/lower"],"su":"Bar on the floor. Feet hip width, overhand grip just outside the legs. Legs stay nearly straight throughout.","po":"Chest up, flat back, shoulders back, core braced hard. Knees almost locked but not hyperextended.","exn":"Inhale and brace. Hinge at the hips to lower the bar toward the floor with near-straight legs, stopping where the back would round. Drive the hips forward to stand, exhaling.","cm":"Rounding the lower back to touch the floor. Locking the knees hard. Loading it like a conventional deadlift."},{"id":"dumbbell-romanian-deadlift","n":"Dumbbell Romanian deadlift","eq":"dumbbell","lt":"weighted","p":["hamstrings/hamstrings"],"s":["glutes/glutes","back/lower"],"su":"Stand tall with a dumbbell in each hand in front of the thighs, palms facing the body. Feet hip width.","po":"Chest up, flat back, shoulders back, core braced. Knees at a soft fixed 15 degree bend.","exn":"Inhale and brace. Push the hips back, lowering the dumbbells down the front of the legs until you feel a hamstring stretch. Drive the hips forward to stand, exhaling.","cm":"Letting the dumbbells drift forward away from the legs. Squatting instead of hinging."},{"id":"single-leg-romanian-deadlift","n":"Single-leg Romanian deadlift","eq":"dumbbell","lt":"weighted","p":["hamstrings/hamstrings","glutes/glutes"],"s":["back/lower"],"su":"Stand on one leg with a dumbbell in the opposite hand. Soft 15 degree bend in the standing knee.","po":"Hips square and level throughout, flat back, chest up, core braced. The rear leg extends behind as a counterweight.","exn":"Inhale and hinge forward at the hip, lowering the dumbbell toward the floor while the free leg rises behind. Stop at a hamstring stretch, then drive the hip forward to stand, exhaling.","cm":"Letting the hip of the free leg rotate open toward the ceiling. Rounding the back. Bending the standing knee to reach lower."},{"id":"kettlebell-swing","n":"Kettlebell swing","eq":"kettlebell","lt":"weighted","p":["hamstrings/hamstrings","glutes/glutes"],"s":["back/lower","abs/upper"],"su":"Kettlebell on the floor about a foot in front of you. Feet slightly wider than the hips. Hinge and grip the handle with both hands, then hike it back between the legs.","po":"Flat back, chest up, shoulders down and packed, core braced hard. This is a hip hinge, never a squat.","exn":"Snap the hips forward explosively so the bell floats up to chest height, exhaling sharply and squeezing the glutes. Let it swing back between the legs as you inhale and hinge.","cm":"Squatting the bell up instead of hinging. Lifting with the arms and shoulders. Hyperextending the lower back at the top."},{"id":"nordic-hamstring-curl","n":"Nordic hamstring curl","eq":"bodyweight","lt":"bodyweight","p":["hamstrings/hamstrings"],"s":["glutes/glutes"],"su":"Kneel on a pad with the ankles anchored under a bar or held by a partner. Body upright, arms crossed or ready to catch.","po":"Straight line from knees to head throughout. Hips extended, glutes squeezed hard, core braced.","exn":"Inhale and lower as slowly as possible, resisting all the way, keeping the body in one line. Catch yourself with the hands and push back up. Exhale on the way up.","cm":"Attempting full unassisted reps too early, which commonly causes hamstring strains. Bending at the hips instead of holding the line. Dropping fast."},{"id":"stability-ball-hamstring-curl","n":"Stability ball hamstring curl","eq":"other","lt":"bodyweight","p":["hamstrings/hamstrings"],"s":["glutes/glutes"],"su":"Lie on your back with the heels on top of a stability ball, legs straight, arms flat at your sides.","po":"Lift the hips so the body forms a straight line from shoulders to heels. Glutes squeezed, core braced, hips held high throughout.","exn":"Exhale and pull the heels toward the glutes, rolling the ball in and keeping the hips lifted. Squeeze one second, extend back over 2 to 3 seconds, inhaling.","cm":"Letting the hips drop as the ball rolls in. Rushing so the ball wobbles out of control."},{"id":"band-leg-curl","n":"Band leg curl","eq":"bands","lt":"weighted","p":["hamstrings/hamstrings"],"s":[],"su":"Anchor the band at floor level. Lie face down and loop the other end around one ankle. Scoot forward until there is tension.","po":"Hips pressed into the floor, chest down, core braced, neck neutral.","exn":"Exhale and curl the heel toward the glute against the band. Squeeze one second, lower over 2 to 3 seconds, inhaling.","cm":"Lifting the hips to help. Letting the band snap the leg straight."},{"id":"barbell-hip-thrust","n":"Barbell hip thrust","eq":"barbell","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Sit on the floor with the upper back against a bench edge, just below the shoulder blades. Barbell across the hips with a pad. Feet flat, shins vertical at the top.","po":"Ribs pulled down, chin tucked with eyes on the horizon throughout, core braced. Bench contact at the shoulder blades, not the neck.","exn":"Inhale, drive through the heels and lift the hips until the torso is parallel to the floor. Squeeze the glutes hard for one second and exhale. Lower over 2 to 3 seconds.","cm":"Hyperextending the lower back at the top instead of stopping at parallel. Letting the chin and ribs flare up. Pushing through the toes."},{"id":"sumo-deadlift","n":"Sumo deadlift","eq":"barbell","lt":"weighted","p":["glutes/glutes","quads/quads"],"s":["hamstrings/hamstrings","back/lower","forearms/forearms"],"su":"Bar over mid-foot. Take a wide stance with the toes turned out 30 to 45 degrees. Hinge down and grip inside the legs at shoulder width.","po":"Chest up, flat back, hips lower than in a conventional pull, shoulders over the bar, knees pushed out over the toes, core braced hard.","exn":"Inhale and brace. Push the floor apart with the feet and stand tall, keeping the bar against the legs. Exhale at the top, then hinge back down under control.","cm":"Letting the knees cave inward. Rounding the lower back. Jerking the bar off the floor before the slack is pulled out."},{"id":"machine-hip-thrust","n":"Machine hip thrust","eq":"machine","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Set the seat and lap pad so the pad sits across the hips, not the belly. Feet flat on the platform, shins vertical at the top.","po":"Back against the pad, ribs down, chin tucked, core braced.","exn":"Inhale, drive through the heels to extend the hips fully. Squeeze the glutes one second and exhale. Lower over 2 to 3 seconds under control.","cm":"Pad sitting on the stomach instead of the hip crease. Arching the lower back to gain extra range."},{"id":"smith-machine-hip-thrust","n":"Smith machine hip thrust","eq":"machine","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Bench set beside the bar, upper back against it just below the shoulder blades. Bar across the hips with a pad. Feet flat, shins vertical at the top.","po":"Ribs down, chin tucked, core braced, shoulder blades on the bench.","exn":"Unrack with a wrist twist. Inhale, drive through the heels until the torso is parallel to the floor, exhaling. Squeeze one second, lower over 2 to 3 seconds.","cm":"Placing the bench so the fixed bar path doesn't line up over the hips. Hyperextending the lower back at the top."},{"id":"machine-glute-kickback","n":"Machine glute kickback","eq":"machine","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Set the pad and chest support. Place one foot against the pad or footplate, hands on the handles.","po":"Chest against the pad, hips square, ribs down, core braced. The torso does not move.","exn":"Exhale and drive the working leg back and up until the hip is fully extended. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Arching the lower back to gain extra range. Rotating the hip open as the leg goes back."},{"id":"hip-abduction-machine","n":"Hip abduction machine","eq":"machine","lt":"weighted","p":["glutes/glutes"],"s":[],"su":"Set the pads against the outside of the thighs, knees bent, back flat against the seat.","po":"Back against the pad, chest up, core lightly braced. Lean slightly forward to bias the upper glutes.","exn":"Exhale and press the knees apart against the pads as far as they go. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Letting the stack snap the legs back together. Rocking the torso side to side to push heavier."},{"id":"cable-glute-kickback","n":"Cable glute kickback","eq":"cable","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Ankle strap on the lowest pulley. Face the machine, hold the frame, working leg strapped and slightly forward.","po":"Chest up, hips square, ribs down, core braced. Slight forward lean from the hips, torso still.","exn":"Exhale and drive the leg back and up until the hip is fully extended. Squeeze one second, return over 2 to 3 seconds, inhaling.","cm":"Arching the lower back rather than extending the hip. Swinging the leg with momentum."},{"id":"cable-pull-through","n":"Cable pull-through","eq":"cable","lt":"weighted","p":["glutes/glutes"],"s":["hamstrings/hamstrings","back/lower"],"su":"Rope on the lowest pulley. Face away from the machine, reach between the legs and grip both ends. Step forward until taut, feet shoulder width.","po":"Chest up, flat back, core braced, knees at a soft fixed bend.","exn":"Inhale and push the hips straight back, letting the rope travel between the legs until you feel a hamstring stretch. Drive the hips forward to stand and squeeze the glutes, exhaling.","cm":"Squatting down instead of hinging back. Pulling with the arms rather than driving with the hips. Hyperextending the lower back at the top."},{"id":"glute-bridge","n":"Glute bridge","eq":"bodyweight","lt":"bodyweight","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Lie on your back, knees bent, feet flat and hip width, heels about a hand's length from the glutes. Arms flat at your sides.","po":"Ribs pulled down, chin tucked, core braced, lower back neutral rather than arched.","exn":"Exhale and drive through the heels to lift the hips until the body forms a straight line from knees to shoulders. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Arching the lower back to lift higher instead of stopping at a straight line. Pushing through the toes. Letting the knees fall apart."},{"id":"single-leg-glute-bridge","n":"Single-leg glute bridge","eq":"bodyweight","lt":"bodyweight","p":["glutes/glutes"],"s":["hamstrings/hamstrings"],"su":"Lie on your back, one knee bent with the foot flat, the other leg extended straight or knee hugged to the chest.","po":"Hips level and square throughout, ribs down, core braced, chin tucked.","exn":"Exhale and drive through the working heel to lift the hips until the body forms a straight line. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Letting the free-leg hip drop, which lets the strong side take over. Arching the lower back to gain height."},{"id":"frog-pump","n":"Frog pump","eq":"bodyweight","lt":"bodyweight","p":["glutes/glutes"],"s":[],"su":"Lie on your back, soles of the feet pressed together, knees fallen out wide, heels drawn toward the glutes.","po":"Ribs down, core braced, chin tucked, lower back neutral.","exn":"Exhale and drive through the outer edges of the feet to lift the hips. Squeeze the glutes hard for one second, lower over 2 seconds, inhaling.","cm":"Arching the lower back to lift higher. Letting the knees drift back together."},{"id":"donkey-kick","n":"Donkey kick","eq":"bodyweight","lt":"bodyweight","p":["glutes/glutes"],"s":[],"su":"On all fours, hands under the shoulders and knees under the hips. Spine neutral.","po":"Flat back like a tabletop, hips level and square, core braced, neck in line with the spine.","exn":"Exhale and drive one heel toward the ceiling, keeping the knee bent at 90 degrees, until the thigh is level with the torso. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Arching the lower back to kick higher. Letting the hip rotate open. Swinging the leg with momentum."},{"id":"fire-hydrant","n":"Fire hydrant","eq":"bodyweight","lt":"bodyweight","p":["glutes/glutes"],"s":[],"su":"On all fours, hands under the shoulders and knees under the hips.","po":"Flat back, hips level, core braced, weight evenly spread so the torso doesn't lean.","exn":"Exhale and lift one knee out to the side, keeping it bent at 90 degrees, until the thigh is roughly parallel to the floor. Squeeze one second, lower over 2 seconds, inhaling.","cm":"Leaning the torso away to lift the leg higher. Rotating the hips instead of moving only at the working hip."},{"id":"curtsy-lunge","n":"Curtsy lunge","eq":"dumbbell","lt":"weighted","p":["glutes/glutes"],"s":["quads/quads"],"su":"Stand tall with a dumbbell in each hand at your sides. Feet hip width.","po":"Chest up, torso upright, hips as square as possible, core braced.","exn":"Inhale and step one foot back and diagonally behind the other, lowering until the front thigh is near parallel. Drive through the front heel to return, exhaling.","cm":"Crossing so far behind that the knee twists. Letting the torso rotate with the step. Letting the front knee cave inward."},{"id":"kettlebell-sumo-squat","n":"Kettlebell sumo squat","eq":"kettlebell","lt":"weighted","p":["glutes/glutes","quads
